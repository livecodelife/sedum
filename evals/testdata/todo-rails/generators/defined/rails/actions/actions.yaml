actions:
  # One endpoint is a controller action plus the route that reaches it, in two
  # files that are not valid apart: an action nothing routes to is dead, and a
  # route to a missing action is a 500. Neither child is exposed, because
  # neither is worth invoking alone.
  createEndpoint:
    composes: [addControllerAction, addRoute]

  addControllerAction:
    kwargs:
      resource: { type: string, required: true }
      verb: { type: string, required: true }
    discriminator: verb
    variants: [index, show, create, update, destroy]
    injects_into: "app/controllers/{{resource|table}}_controller.rb"
    anchor: actions
    exposed: false

  addRoute:
    kwargs:
      resource: { type: string, required: true }
      verb: { type: string, required: true }
    discriminator: verb
    variants: [index, show, create, update, destroy]
    injects_into: "config/routes.rb"
    anchor: routes
    exposed: false

  # Strong parameters are one method per resource, so this is one invocation
  # rather than one per attribute. The permitted list arrives as a bound
  # fragment for the same reason a SQL column list does: it is data the service
  # owns, and the grammar has no loops to build it from a list.
  definePermittedParams:
    kwargs:
      resource: { type: string, required: true }
      # The attribute names a caller may set, separated by commas or spaces.
      # Names only - the template turns them into symbols, so a value carrying
      # Ruby punctuation is wrong rather than merely redundant.
      attributes: { type: string, required: true }
    injects_into: "app/controllers/{{resource|table}}_controller.rb"
    anchor: private

  addValidation:
    kwargs:
      resource: { type: string, required: true }
      attribute: { type: string, required: true }
      rule: { type: string, required: true }
    injects_into: "app/models/{{resource|record}}.rb"
    anchor: validations

  # The migration's filename carries its timestamp, and injects_into is
  # rendered from bound kwargs, so the stamp has to be one of them. It is the
  # one place in this standard where an argument names a file rather than
  # describing the code going into it - the record author chose the stamp when
  # they wrote the path into affected_scope, and expansion has no way to
  # rediscover it.
  addColumn:
    kwargs:
      resource: { type: string, required: true }
      stamp: { type: string, required: true }
      name: { type: string, required: true }
      type: { type: string, required: true }
      # Every option is its own kwarg with its own type, rather than one string
      # holding the rest of the line. A single options string needs the caller
      # to know a convention - where the comma goes, whether the type repeats -
      # and the catalog has nowhere to say what that convention is, so the
      # caller guesses and the template renders the guess. Two named values
      # cannot be got wrong that way.
      # Named nullable rather than null: "null" is a JSON keyword, and a kwarg
      # whose name is a literal in the format the caller answers in is a name
      # worth not having.
      nullable: { type: bool, required: true }
      # The Ruby literal this column defaults to, emitted verbatim. Declared
      # literal rather than string and left without a description, to test
      # whether the type alone carries what the sentence carried: nil is how a
      # column with no default is written, and it is what the string type could
      # never say.
      default: { type: literal, required: true }
    injects_into: "db/migrate/{{stamp}}_create_{{resource|table}}.rb"
    anchor: columns

  addControllerTest:
    kwargs:
      resource: { type: string, required: true }
      verb: { type: string, required: true }
    discriminator: verb
    variants: [index, show, create, update, destroy]
    injects_into: "test/controllers/{{resource|table}}_controller_test.rb"
    anchor: tests

  addModelTest:
    kwargs:
      resource: { type: string, required: true }
      attribute: { type: string, required: true }
    injects_into: "test/models/{{resource|record}}_test.rb"
    anchor: tests
