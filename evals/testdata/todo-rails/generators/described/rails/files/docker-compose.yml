# The web service waits for postgres to answer rather than retrying the
# connection in Ruby. A container starting beside its database loses the race,
# and compose already knows how to express "not until this is healthy" - so the
# application does not carry a retry loop for something the orchestrator owns.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30

  web:
    build: .
    command: ./bin/rails server -b 0.0.0.0
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/app
      RAILS_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
