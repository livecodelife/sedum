# Rewritten to functionality only.
#
# The source record also specified PostgreSQL through the pg adapter, a
# connection read from the environment, a compose healthcheck instead of a retry
# loop, CSRF handling, Docker build shape, and where the linespec suite lives.
# All of it is real and none of it belongs here, for one reason: **no action in
# this package can act on any of it.** Those files are produced whole by file
# templates, so a constraint about them is text in the prompt that no selection
# can satisfy or violate.
#
# That matters more than tidiness. The eval measures action selection, so a
# constraint no action serves cannot move the number - it can only add tokens,
# and at worst send the model looking for an action that does not exist. The
# boot-ordering constraint was the clearest case: Rails put the wait in
# docker-compose.yml and Chi put it in main.go, both hardcoded in file
# templates, and a record asking for either was describing something already
# decided before Phase 4 ran.
#
# What is left maps one-to-one onto what the package can do: columns,
# endpoints, a validation, permitted parameters, and tests.
#
# affected_scope is trimmed the same way, to the six paths an action injects
# into. Authorizing Dockerfile, Gemfile, config/database.yml and the rest put
# files in the prompt's file list that no invocation could ever target.
id: eval-todo-rails
title: Todo resource with full CRUD over /todos
status: open
created_at: "2026-08-15"
author: calebcowen@gmail.com
intent: |
  Add the todo resource: a JSON API over /todos with full CRUD - list, get by
  id, create, update by id, delete by id - with todos addressed by integer
  primary key.

  A todo has a title and a completed flag, and nothing else of its own.

  Basic CRUD and nothing more. The record asked for a title validation, for a
  PUT that applies only the attributes present in the body, and for a 400 when a
  body carries none. All three left, because the Go standard this record is read
  against has no action that can express any of them, and an ask only one arm
  can answer makes the language comparison a comparison of records
  (prov-2026-40bdd9ac).
constraints:
  - >-
    Five endpoints on /todos and /todos/:id, addressed by integer id per REST
    convention: index, show, create, update, destroy.
  - >-
    The todos table carries exactly two columns of its own: title, a string that
    is not null and carries no default, and completed, a boolean that is not
    null and defaults to false. The primary key and the created_at and
    updated_at timestamps are supplied by the framework, so declaring any of
    those three again is a duplicate column.
  - >-
    JSON responses carry id, title, completed, created_at and updated_at.
  - >-
    Only title and completed are accepted from a request body. Anything else is
    ignored rather than assigned.
  - >-
    A missing record is a 404, decided the same way for every action rather than
    per action.
  - >-
    Each endpoint carries a test asserting the status it returns, and the test
    data is a fixture.
# Five paths, one per thing an action injects into.
affected_scope:
  - app/controllers/todos_controller.rb
  - app/models/todo.rb
  - config/routes.rb
  - db/migrate/20260814000000_create_todos.rb
  - test/controllers/todos_controller_test.rb
  # Rails supplies test data as fixtures. A record that authorized the tests but
  # not the fixtures they read would forbid the framework's own convention, and
  # an arm without a generator package walks into that every time
  # (prov-2026-2fb763a0).
  - test/fixtures/todos.yml
forbidden_scope: []
type: blueprint
