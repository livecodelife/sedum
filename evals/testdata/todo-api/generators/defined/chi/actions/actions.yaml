actions:
  # A file template declares the imports the standard always needs and no more.
  # Everything else - the service's own packages, whose paths start with a
  # module name no template can know, and any dependency a later invocation
  # brings in - arrives here, one import per invocation against the anchor the
  # template opened inside its import block.
  #
  # One action per file rather than one action taking the file as an argument.
  # Which files a service has is the standard's business and lives in
  # configuration; which package to import is the service's, and is data. An
  # action taking the path would hand the second decision to the caller along
  # with the first.
  #
  # Identity is the import path, so repeated invocations accumulate distinct
  # imports rather than replacing one region, and re-running with the same path
  # rewrites in place. Repetition comes from invocations, the same way fields
  # and queries do.
  # The service's own packages, wired by the run rather than by the model.
  #
  # These used to be addMainImport and addHandlerImport, taking the path as a
  # kwarg. That asked the model for the module name, which is in go.mod - a file
  # no record authorizes and no file list carries - so it was answering from
  # nothing. Measured: it bound chi, sqlx, net/http, net/http/httptest and
  # testify across the five import actions, four of them unused and one already
  # in the template, and the service did not compile (prov-2026-6fc3d13d).
  #
  # No kwargs at all now. Which packages a service has is the standard's
  # business and is written into the template; which module they live under is
  # the run's and arrives as {{module}}. The model selects and binds nothing.
  wireMainPackages:
    injects_into: "main.go"
    anchor: imports

  wireHandlerPackages:
    kwargs:
      resource: { type: string, required: true }
    injects_into: "handlers/{{resource|table}}.go"
    anchor: imports

  # One endpoint is a handler plus its route registration, in two files that
  # are not valid apart - the same shape as a C++ declaration and definition.
  createEndpoint:
    composes: [createCRUDHandler, addRoute]

  createCRUDHandler:
    kwargs:
      resource: { type: string, required: true }
      verb: { type: string, required: true }
    discriminator: verb
    variants: [create, list, get, update, delete]
    injects_into: "handlers/{{resource|table}}.go"
    anchor: handlers
    exposed: false

  addRoute:
    kwargs:
      resource: { type: string, required: true }
      verb: { type: string, required: true }
    discriminator: verb
    variants: [create, list, get, update, delete]
    injects_into: "main.go"
    anchor: routes
    exposed: false

  # Repetition comes from repeated invocations, never from a loop in a
  # template: the template grammar has no loops by design. One field is one
  # invocation.
  addModelField:
    kwargs:
      resource: { type: string, required: true }
      name: { type: string, required: true }
      go_type:
        type: literal
        required: true
        description: >-
          Go. The type of the struct field, written as Go spells it - string,
          bool, int64, time.Time. It is placed straight after the field name, so
          it carries no name and no tag.
    injects_into: "db/{{resource|table}}.go"
    anchor: fields

  createQuery:
    kwargs:
      resource: { type: string, required: true }
      operation: { type: string, required: true }
      # The query patterns are the standard; which columns a resource has is
      # the service's business, so they arrive as bound arguments. Optional
      # because a delete needs none of them - one kwarg schema covers every
      # variant, so per-variant requirements cannot be declared here.
      # Six fragments across five variants, and three of them are Go while
      # three are SQL. Declaring them literal says they are code; it cannot say
      # which language, and that is the distinction the model was getting wrong
      # - it put SQL placeholders into the Go argument lists in every sample
      # (prov-2026-bd2a6c3f). Only a sentence can say it.
      columns:
        type: literal
        required: false
        description: >-
          SQL. The resource's own column names, comma separated - "title,
          completed". Names only, no types and no table prefix. The select
          templates already write id, created_at and updated_at around this, so
          naming any of those three duplicates a column, and "*" is wrong for
          the same reason.
      placeholders:
        type: literal
        required: false
        description: >-
          SQL. One positional placeholder per name in columns, in the same order
          and unquoted - "$1, $2". These go inside the INSERT's VALUES list.
      insert_values:
        type: literal
        required: false
        description: >-
          Go, not SQL. The arguments passed to the query, reading the fields off
          the function's `in` parameter in the same order as columns -
          "in.Title, in.Completed". Never placeholders: those are the previous
          kwarg, and putting them here writes $1 into Go source.
      set_clause:
        type: literal
        required: false
        description: >-
          SQL. The assignments in an UPDATE, comma separated - "title = $2,
          completed = $3". Numbered from $2 rather than $1, because the template
          puts the row's id at $1 in the WHERE clause. updated_at is written by
          the template and does not belong here.
      update_values:
        type: literal
        required: false
        description: >-
          Go, not SQL. The arguments passed to the query, in the order the
          placeholders number them - the id first, then the fields off `in`:
          "id, in.Title, in.Completed".
      scan_targets:
        type: literal
        required: false
        description: >-
          Go, not SQL. Pointers to the fields Scan writes into, on a variable
          named for the resource singular and lowercase - "&todo.ID, &todo.Title,
          &todo.Completed, &todo.CreatedAt, &todo.UpdatedAt". One per column the
          SELECT lists, in that order, which is id, then the columns kwarg, then
          created_at and updated_at. Column names are not scan targets.
    discriminator: operation
    variants: [insert, selectAll, selectByID, update, delete]
    injects_into: "db/{{resource|table}}.go"
    anchor: queries

  # Unit tests are generated; integration specs are not. A unit test asserts
  # the shape this standard promises - the status code a verb returns, the
  # error a missing row produces - which is boilerplate. What a service is
  # supposed to do belongs to a human-authored contract.
  addHandlerTest:
    kwargs:
      resource: { type: string, required: true }
      verb: { type: string, required: true }
    discriminator: verb
    variants: [create, list, get, update, delete]
    injects_into: "handlers/{{resource|table}}_test.go"
    anchor: tests

  addQueryTest:
    kwargs:
      resource: { type: string, required: true }
      operation: { type: string, required: true }
    discriminator: operation
    variants: [insert, selectAll, selectByID, update, delete]
    injects_into: "db/{{resource|table}}_test.go"
    anchor: tests
