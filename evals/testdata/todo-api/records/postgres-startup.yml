id: prov-2026-addce7fc
title: Service fatals on startup if postgres not yet ready
status: open
created_at: "2026-06-03"
author: calebcowen@gmail.com
intent: main() calls db.Ping() once and log.Fatalf on failure. When postgres is still initializing, the service crashes before it can serve /health, causing linespec tests to time out. Fix by retrying Ping up to 30 times with 1-second delays before giving up.
constraints:
    - Retry db.Ping() up to 30 times with 1-second sleep between attempts
    - Log each attempt so failures are diagnosable
    - Fatal only after all retries exhausted
affected_scope:
    - main.go
