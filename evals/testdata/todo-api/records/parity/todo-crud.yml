# A deliberate mirror of todo-rails/records/native, expressed for Go and Chi.
#
# It exists because the native records are not comparable. Both ask for the same
# functionality - full CRUD, PostgreSQL, partial updates, no boot race - but they
# prescribe *opposite solutions* to the last one: the Rails record says the
# application "holds no retry loop of its own" and lets the database declare
# itself healthy first, while the native Chi record mandates a 30-attempt retry
# loop in main(). A model that satisfies one has violated the other.
#
# So a rails-vs-chi delta measured across the native records is not a language
# result. It confounds language, framework, package count, and two records that
# disagree about the answer. This record removes every difference except the
# stack itself: same functionality, same prescribed approach, same specificity,
# translated where the concept has no Go counterpart and dropped where it has
# none at all.
#
# What is deliberately *not* matched is the generator package. Both chi cases run
# against generators/defined, so native-vs-parity isolates the record while
# holding the package fixed.
id: eval-todo-chi-parity
title: Todo REST API on Chi and PostgreSQL, mirroring the Rails record's intent
status: open
created_at: "2026-08-15"
author: calebcowen@gmail.com
intent: |
  Add the todo resource: a JSON API over /todos with full CRUD - create, list,
  get by id, update by id, delete by id - with todos addressed by integer primary
  key. The linespec suite is the acceptance contract, and this record is what may
  change to satisfy it.

  The service stores todos in PostgreSQL, with the connection read from the
  environment rather than written into a file, and a database that comes up
  alongside the service.

  Two properties are called out because they are the ones an otherwise
  reasonable implementation gets wrong by omission rather than by mistake.

  A PUT applies only the attributes the caller sent. A client that toggles
  completed must not blank the title it never mentioned, so the update path
  assigns what arrived and nothing else. An implementation that gets this right
  by accident is indistinguishable from one that means it, until somebody edits
  the update path and only the accident was holding it up.

  The service does not race its database at boot. Ordering between a process and
  the database it depends on belongs to whatever starts them, so the database is
  declared healthy before the service is started at all, and the service carries
  no connection retry loop. A retry loop is the same wait spelled worse: it hides
  the dependency from anything reading the deployment description, and it runs on
  every boot rather than only where the ordering is genuinely unknown.
constraints:
    - Go with the Chi v5 router and the lib/pq driver, not pgx.
    - >-
      The database connection is read from the environment in every environment,
      so the same build runs anywhere without a file edit.
    - >-
      Five endpoints on /todos and /todos/{id}, addressed by integer id per REST
      convention: list, get, create, update, delete.
    - >-
      PUT applies only the attributes present in the body. An attribute the caller
      omitted keeps its stored value, and a body carrying no usable attributes is
      a 400 rather than a write of nothing. Request fields are pointers so that an
      omitted field is distinguishable from one set to its zero value.
    - >-
      A missing record is a 404, decided the same way in every handler that
      resolves one. Every handler resolves its own record and none of them depends
      on a value another produced.
    - >-
      JSON responses carry id, title, completed, created_at and updated_at, which
      is the shape the acceptance contract asserts.
    - A todo requires a title. completed defaults to false and is never null.
    - >-
      The service starts only once the database reports healthy, and holds no
      retry loop of its own.
    - >-
      Unit tests are _test.go siblings of what they cover, asserting what the API
      promises: the status each verb returns and the 404 a missing record
      produces. The handlers and db packages each carry one.
    - >-
      The todos table carries exactly two columns of its own: title, text that is
      not null and carries no default, and completed, a boolean that is not null
      and defaults to false. The schema supplies the primary key and the
      created_at and updated_at timestamps, so declaring any of those three again
      is a duplicate column.
    - >-
      INSERT uses the two-step pattern - RETURNING id, then SELECT - and UPDATE
      uses Exec with a RowsAffected check followed by SELECT, both for linespec
      proxy compatibility. The SET clause is built from the non-nil fields by
      direct assignment rather than COALESCE, so VERIFY_WRITTEN_VALUES still
      works.
    - >-
      LIST uses PrepareContext with stmt.QueryContext, to force the Extended Query
      Protocol.
    - >-
      The linespec suite is the acceptance contract for this change and is not
      modified by it. A contract edited to match an implementation has stopped
      being a contract.
# Identical to the native record's, because the file layout is the package's
# and this record varies intent rather than structure.
affected_scope:
    - .gitignore
    - .linespec.yml
    - db/todos.go
    - db/todos_test.go
    - docker-compose.yml
    - handlers/todos.go
    - handlers/todos_test.go
    - init.sql
    - main.go
forbidden_scope: []
type: blueprint
supersedes: ""
superseded_by: ""
related: []
sealed_at_sha: ""
# Retained for the behavioral arm, which is not built. Sedum reads none of this.
associated_specs:
    - path: linespecs/create_todo.linespec
      run_command: linespec test linespecs/create_todo.linespec
    - path: linespecs/get_todo.linespec
      run_command: linespec test linespecs/get_todo.linespec
    - path: linespecs/list_todos.linespec
      run_command: linespec test linespecs/list_todos.linespec
    - path: linespecs/update_todo.linespec
      run_command: linespec test linespecs/update_todo.linespec
    - path: linespecs/delete_todo.linespec
      run_command: linespec test linespecs/delete_todo.linespec
associated_traces: []
monitors: []
tags: []
