# Condensed for the eval, and deliberately not todo-api's record any more.
#
# The source project carries three: the CRUD build, and two later records that
# refine it - one making startup wait for postgres, one making PUT a partial
# update. That is the shape real work takes, and Sedum handles it correctly:
# a later record refines a region an earlier one produced, which is what the
# marker's record attribute exists for (prov-2026-36c8a99c).
#
# It is the wrong shape for this measurement. Sedum makes one model call per
# record, so three records measure three different selections and the eval pays
# for all of them to learn about one. Sequencing records against a converging
# codebase is the harness's job, not Sedum's - so the fixture states the whole
# intent once and asks the model to select for it in a single call.
#
# The two refinements are folded in as requirements rather than as history: the
# intent describes the behavior wanted, not the order it was discovered in. A
# record that read "build it this way, then fix it that way" would be asking the
# model to select for a changelog.
id: eval-todo-chi
title: Todo REST API on Chi and PostgreSQL, with partial updates and resilient startup
status: open
created_at: "2026-08-15"
author: calebcowen@gmail.com
intent: |
  Build a REST todo API using Chi v5 and PostgreSQL with full CRUD: create, list
  all, get by ID, update by ID, delete by ID. Todos are addressed by integer
  primary key. Go source files live in the repo root, and unit tests live beside
  the code they cover.

  Two properties are called out because they are the ones an otherwise
  reasonable implementation gets wrong by omission rather than by mistake.

  A PUT applies only the attributes the caller sent. Request fields are pointers
  so that an omitted field is distinguishable from one set to its zero value,
  and the SET clause is built from the fields that arrived. A client toggling
  completed must not blank the title it never mentioned, and a body carrying no
  usable field is a 400 rather than a write of nothing.

  The service does not crash while its database is still coming up. Startup
  retries the connection rather than fataling on the first failure, so the
  service can answer /health while postgres finishes initializing.
constraints:
    - Chi v5 router, lib/pq driver (not pgx)
    - All endpoints address todos by integer ID per REST conventions
    - INSERT uses two-step pattern (RETURNING id then SELECT) for linespec proxy compatibility
    - UPDATE uses Exec (no RETURNING), RowsAffected check, then SELECT
    - LIST query uses PrepareContext + stmt.QueryContext to force Extended Query Protocol
    - Update request fields are pointers (*string, *bool); nil means the caller omitted it
    - The UPDATE SET clause is built from the non-nil fields only, by direct assignment
      rather than COALESCE, so VERIFY_WRITTEN_VALUES still works
    - An update body with no usable field is a 400 rather than a write of nothing
    - Startup retries the database connection up to 30 times at one-second intervals,
      logging each attempt, and fatals only once they are exhausted
    - Docker multi-stage build; postgres 16-alpine with md5 auth; host port 5433
    - Single root .linespec.yml covers both service config and provenance
    - Unit tests are _test.go siblings of the file they cover; handlers and db packages each carry one
    - Update tests cover a body with one field set, a body with several, and an empty body
affected_scope:
    - .gitignore
    - .linespec.yml
    - db/todos.go
    - db/todos_test.go
    - docker-compose.yml
    - handlers/todos.go
    - handlers/todos_test.go
    - init.sql
    - main.go
forbidden_scope: []
type: blueprint
supersedes: ""
superseded_by: ""
related: []
sealed_at_sha: ""
