# The same functionality as todo-rails/records/todo-crud.yml, expressed for Go
# and Chi. Read that file's header first - the reasoning for stripping these
# records to functionality is written there and is not repeated.
#
# A third "parity" record existed briefly, because the two native records
# prescribed opposite solutions to boot ordering and so could not be compared.
# Stripping both to functionality removed the disagreement along with everything
# else that no action could serve, and two records now reach parity where three
# were needed before.
#
# What differs between this and the Rails record is only what the stack forces:
# /todos/{id} rather than /todos/:id, and a validation expressed as a NOT NULL
# column plus a handler check rather than as a model validation. The behavior
# asked for is the same, constraint for constraint.
#
# affected_scope is six paths, matching the Rails record's six. The compose and
# repo packages are unused as a result - they own docker-compose.yml,
# .linespec.yml and .gitignore, which are produced whole by file templates and
# which no action targets. Dropping them also drops the two unfillable anchors
# they plant.
id: eval-todo-chi
title: Todo resource with full CRUD over /todos
status: open
created_at: "2026-08-15"
author: calebcowen@gmail.com
intent: |
  Add the todo resource: a JSON API over /todos with full CRUD - list, get by
  id, create, update by id, delete by id - with todos addressed by integer
  primary key.

  A todo has a title and a completed flag, and nothing else of its own.

  Basic CRUD and nothing more. The record asked for a title validation, for a
  PUT that applies only the attributes present in the body, and for a 400 when a
  body carries none. This package has no action that can express any of them, so
  a run selecting perfectly still failed those assertions - and the Ruby record
  this one is compared against dropped them in the same change, because an ask
  only one arm can answer makes the language comparison a comparison of records
  (prov-2026-40bdd9ac).
constraints:
  - >-
    Five endpoints on /todos and /todos/{id}, addressed by integer id per REST
    convention: list, get, create, update, delete.
  - >-
    The todos table carries exactly two columns of its own: title, text that is
    not null and carries no default, and completed, a boolean that is not null
    and defaults to false. The primary key and the created_at and updated_at
    timestamps are supplied by the schema, so declaring any of those three again
    is a duplicate column.
  - >-
    JSON responses carry id, title, completed, created_at and updated_at.
  - >-
    Only title and completed are read from a request body. Anything else is
    ignored rather than assigned.
  - >-
    A missing record is a 404, decided the same way in every handler that
    resolves one.
  - >-
    Each endpoint carries a handler test asserting the status it returns, and
    each query carries a test of its own.
# Six paths, matching the Rails record's six.
affected_scope:
  - db/todos.go
  - db/todos_test.go
  - handlers/todos.go
  - handlers/todos_test.go
  - init.sql
  - main.go
forbidden_scope: []
type: blueprint
