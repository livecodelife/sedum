# The generality check for the Go standard.
#
# Same generator package set as todo-chi-defined, a different record. It exists
# because the run that validated that package's fragment descriptions cannot be
# read as evidence that they generalize: the descriptions give their examples in
# terms of todos, the record generated todos, and "the model read the rule" and
# "the model copied the example" produce identical output under those conditions
# (prov-2026-b585fbbc).
#
# groceries shares no field name and no type with todos, so the two hypotheses
# come apart: a copy binds in.Title against a struct that has no Title, which
# does not compile, and the bindings below score it directly.
id: grocery-chi-defined

application:
  name: grocery
  # Tier 1, same as both todo arms. Five endpoints, two fields, no auth and no
  # relations - the application is the same shape, which is what makes the
  # resource the only thing that varies.
  complexity: 1

language: go
framework: chi
tightness: defined
arm: sedum

# The one line that matters: the same package set todo-chi-defined runs. A copy
# of it would answer a different question, since what is under test is whether
# that package generalizes past the resource its descriptions were written from.
generators: todo-api/generators/defined
records: grocery-api/records

# The Go standard declares a module variable, supplied by the run rather than
# bound by the model (prov-2026-6fc3d13d).
variables:
  module: grocery

models:
  - id: qwen2.5-coder-14b-instruct
    engine: llama.cpp
    quant: q4_k_m
  - id: qwen/qwen3-4b-2507
    engine: mlx
    quant: 4bit
  # The large row. A 30B mixture-of-experts on a machine that can hold it, so
  # that a rate measured on a 4B and a 14B is read against something well above
  # both rather than only against something below.
  - id: qwen/qwen3-30b-a3b
    engine: mlx
    quant: 4bit
  # The size ladder: one family, one specialisation, one quantisation, varying
  # only in size. The 0.5B is expected to score badly and is the floor a low
  # number is read against (prov-2026-84158f7e).
  - id: qwen2.5-coder-0.5b-instruct-mlx
    engine: mlx
    quant: 4bit
  - id: qwen2.5-coder-3b-instruct-mlx
    engine: mlx
    quant: 4bit
  - id: qwen2.5-coder-7b-instruct-mlx
    engine: mlx
    quant: 4bit
  # The specialised twin of qwen/qwen3-30b-a3b: same size, same mixture of
  # experts, same active parameter count, same quantisation, differing only in
  # what it was trained for. It carries no a3b in its name and is one.
  - id: qwen/qwen3-coder-30b
    engine: mlx
    quant: 4bit

# The target's own parser over what Sedum wrote, keyed by the extension it
# reads. gofmt -e reports parse errors and exits non-zero on them; -l keeps a
# merely unformatted file from being reported as malformed, which it is not.
#
# It says the output is well-formed Go and nothing more (prov-2026-d61010a4).
# What one sample of this case costs. The rails constant the harness defaults
# to is 90s, and this case runs roughly three times that on the same 14B row:
# its record drives more files and a larger catalog, so a sample is a longer
# prompt and a longer answer. Observed valid samples across the clean coarse
# entries in results/: 217-301s, median 244s.
#
# A typical sample rather than the slowest. Headroom doubles it for the
# timeout, and an estimate that overstates is one nobody starts a run from
# (prov-2026-59ed14d5).
per_sample: 5m

check:
  ".go": ["gofmt", "-e", "-l"]

expect:
  # Authored from the package, not established from a run - no run has produced
  # a complete answer to this record yet. Identical to todo-chi-defined's
  # counts, because the record asks for the same shape.
  actions:
    wireMainPackages: 1
    wireHandlerPackages: 1
    createEndpoint: 5
    createQuery: 5
    addHandlerTest: 5
    addQueryTest: 5
    addModelField: 2
    createTable: 1

  # This case carried binding expectations on createQuery's columns,
  # placeholders, insert_values and scan_targets, and they were the point of it:
  # every value was derivable from this record and the templates and from
  # nothing else, so a model applying the descriptions' rules bound them and a
  # model reusing the descriptions' examples bound the todo forms and scored
  # zero (prov-2026-2b121b62).
  #
  # Those kwargs no longer exist. createQuery binds resource and operation, and
  # the field names it used to restate are bound once by addModelField and
  # rendered through the same transform everywhere they appear
  # (prov-2026-0cc65e62). The expectation is removed rather than rewritten
  # because there is nothing left on this action to score: an operation is a
  # variant name, not a value a model can get subtly wrong.
  #
  # addModelField still carries none, for the reason it never did. Its templates
  # write {{name|exported}} and {{name|snake}}, so `name` and `Name` render
  # identically and neither spelling is more correct - and pairing looks a key
  # up rather than comparing it, so a key kwarg cannot be a list
  # (prov-2026-66b0116d). go_type is the value worth scoring and is not left
  # unmeasured: a wrong one does not compile, and the behaviour target caught
  # exactly that when a sample bound "\"string\"" with the quotes included.
  #
  # So this case no longer measures binding at all. The description experiment
  # still runs on the Rails pair, which keeps its addColumn expectations.

  behavior:
    target: grocery-chi
    pass_rate: 1.0
