# The generality check for the Go standard.
#
# Same generator package set as todo-chi-defined, a different record. It exists
# because the run that validated that package's fragment descriptions cannot be
# read as evidence that they generalize: the descriptions give their examples in
# terms of todos, the record generated todos, and "the model read the rule" and
# "the model copied the example" produce identical output under those conditions
# (prov-2026-b585fbbc).
#
# groceries shares no field name and no type with todos, so the two hypotheses
# come apart: a copy binds in.Title against a struct that has no Title, which
# does not compile, and the bindings below score it directly.
id: grocery-chi-defined

application:
  name: grocery
  # Tier 1, same as both todo arms. Five endpoints, two fields, no auth and no
  # relations - the application is the same shape, which is what makes the
  # resource the only thing that varies.
  complexity: 1

language: go
framework: chi
tightness: defined
arm: sedum

# The one line that matters: the same package set todo-chi-defined runs. A copy
# of it would answer a different question, since what is under test is whether
# that package generalizes past the resource its descriptions were written from.
generators: todo-api/generators/defined
records: grocery-api/records

# The Go standard declares a module variable, supplied by the run rather than
# bound by the model (prov-2026-6fc3d13d).
variables:
  module: grocery

models:
  - id: qwen2.5-coder-14b-instruct
    engine: llama.cpp
    quant: q4_k_m

# The target's own parser over what Sedum wrote, keyed by the extension it
# reads. gofmt -e reports parse errors and exits non-zero on them; -l keeps a
# merely unformatted file from being reported as malformed, which it is not.
#
# It says the output is well-formed Go and nothing more (prov-2026-d61010a4).
# What one sample of this case costs. The rails constant the harness defaults
# to is 90s, and this case runs roughly three times that on the same 14B row:
# its record drives more files and a larger catalog, so a sample is a longer
# prompt and a longer answer. Observed valid samples across the clean coarse
# entries in results/: 217-301s, median 244s.
#
# A typical sample rather than the slowest. Headroom doubles it for the
# timeout, and an estimate that overstates is one nobody starts a run from
# (prov-2026-59ed14d5).
per_sample: 5m

check:
  ".go": ["gofmt", "-e", "-l"]

expect:
  # Authored from the package, not established from a run - no run has produced
  # a complete answer to this record yet. Identical to todo-chi-defined's
  # counts, because the record asks for the same shape.
  actions:
    wireMainPackages: 1
    wireHandlerPackages: 1
    createEndpoint: 5
    createQuery: 5
    addHandlerTest: 5
    addQueryTest: 5
    addModelField: 2
    createTable: 1

  # These are the point of the case.
  #
  # Every value below is derivable from this record and the package's templates
  # and from nothing else - which is the discipline a binding expectation is
  # under (prov-2026-2b121b62), and here it is also the experiment. A model
  # applying the descriptions' rules binds these. A model reusing the strings
  # the descriptions use as examples binds the todo forms, scores zero on these
  # kwargs, and still selects every action perfectly.
  bindings:
    createQuery:
      because: >-
        The templates fix these. insert renders `INSERT INTO groceries
        ({{columns}}) VALUES ({{placeholders}})` and passes {{insert_values}} as
        the query arguments, so columns and placeholders are SQL and
        insert_values is Go, read off the `in` parameter in the same order.
        selectByID renders `SELECT id, {{columns}}, created_at, updated_at` and
        scans into {{scan_targets}}, so the targets are pointers on a variable
        named for the resource - grocery, singular and lowercase - one per
        column the SELECT lists, in that order. The record says the resource's
        own columns are name and quantity, and the template supplies id,
        created_at and updated_at itself.
      key: [operation]
      invocations:
        - operation: insert
          columns: "name, quantity"
          placeholders: "$1, $2"
          insert_values: "in.Name, in.Quantity"
        - operation: selectByID
          columns: "name, quantity"
          scan_targets: "&grocery.ID, &grocery.Name, &grocery.Quantity, &grocery.CreatedAt, &grocery.UpdatedAt"

    # addModelField carries no binding expectation, and the reason is the same
    # one that made `resource` a list in the Rails case (prov-2026-66b0116d).
    #
    # Its template writes {{name|exported}} for the field and {{name|snake}} for
    # the json tag, so `name` and `Name` render identically - Name and "name" in
    # both cases. Neither spelling is more correct, and pairing looks a key value
    # up rather than comparing it, so a key kwarg cannot be a list. An
    # expectation naming either form scores the author's preference and reports a
    # correct answer as unpaired, which the first run of this case did: ten
    # expected invocations unanswered beside ten answered that nobody expected.
    #
    # go_type is the value worth scoring here and it is not left unmeasured: a
    # wrong one does not compile, and the behaviour target caught exactly that
    # when a sample bound "\"string\"" with the quotes included.

  behavior:
    target: grocery-chi
    pass_rate: 1.0
