# The Ruby arm of the language comparison, and the case the harness was built
# from.
#
# Its record and todo-chi-defined's ask for the same functionality, constraint
# for constraint, so the stack is what differs between them.
id: todo-rails-defined

application:
  name: todo
  # Tier 1. Five endpoints, two fields, no auth and no relations. The floor of
  # the complexity axis rather than a representative sample of it.
  complexity: 1

language: ruby
framework: rails
tightness: defined
arm: sedum

# Vendored, so a number measured today can be re-run tomorrow. Swapping the
# generators line to another package set over this same record is the tightness
# comparison; nothing else about the case changes.
records: todo-rails/records
generators: todo-rails/generators/defined

# On a 24GB machine one 14B is resident at a time, so -eval.model narrows a run
# to one row rather than forcing a model swap mid-run.
models:
  # Continuous batching is llama.cpp-only today, so this is the row that can be
  # sampled concurrently.
  - id: qwen2.5-coder-14b-instruct
    engine: llama.cpp
    quant: q4_k_m
  # Faster single-stream, no batching. The row that matches interactive use.
  - id: qwen2.5-coder-14b-instruct-mlx
    engine: mlx
    quant: 4bit
  # A smaller row, brought forward from the model axis prov-2026-98ab639c
  # planned. It exists because the 14B rejects about five percent of the time,
  # which is too rarely to measure what the retry loop recovers - a weaker row
  # rejects often enough to have a denominator (prov-2026-de71f29b).
  #
  # mlx and 4bit as the server reports them, not as the id suggests: no
  # continuous batching, so this row is sampled one at a time.
  - id: qwen/qwen3-4b-2507
    engine: mlx
    quant: 4bit

# These were established from runs that produced a complete answer, not from
# reading the package. addColumn is the row with history: before the
# completeness pass (prov-2026-6d87dc11) it was selected in 1 of 6 valid
# samples, and after, 6 of 6.
#
# They are also now due a re-check. The record was cut to functionality and its
# scope from seventeen paths to six, so the file list the model sees has
# changed - and an expectation carried across that edit is a claim about a
# prompt that no longer exists.
# The target's own parser over what Sedum wrote, keyed by the extension it
# reads. Milliseconds per sample, no container and no database - the rung
# between "the right actions were selected" and "the application works".
#
# It says the output is well-formed Ruby and nothing more. params.permit(title,
# completed) parses here and raises NameError the first time it runs, so this
# passing is not the application working (prov-2026-d61010a4).
#
# .yml is not checked. The package claims it, but a syntax command for it would
# be asserting something about a config file no action injects into.
check:
  ".rb": ["ruby", "-c"]

expect:
  actions:
    # Two columns on the migration: title and completed.
    addColumn: 2
    # Five REST endpoints, each a composite covering the action and its route.
    createEndpoint: 5
    addControllerTest: 5
    definePermittedParams: 1
    # One per column the fixture carries, mirroring addColumn. Rails supplies
    # test data as fixtures and the record now asks for them
    # (prov-2026-2fb763a0).
    addFixtureAttribute: 2

  # Authored from the record rather than established from a run, which is the
  # opposite discipline the counts above are under. A count is a property of
  # the package and the record together that nobody has computed, so it is set
  # from an answer that was actually complete. A binding is stated in the
  # record and settled by Rails, so setting it from a run would be asking the
  # thing under test to grade itself (prov-2026-2b121b62).
  #
  # For a long time no sample bound `default` correctly on either column, and
  # that was the finding rather than a reason to wait. It has since been
  # answered by changing the package instead of the model: `default` is now an
  # optional literal carrying nil (prov-2026-f03916ba), so the correct way to
  # say "this column has no default" is to not bind it at all.
  #
  # A `~` expectation is what scores that. It means the kwarg must be absent,
  # and it works because equalBinding falls through to `want == got` with both
  # sides nil - so it needs no support beyond being written down here. It is a
  # sharper question than the literal it replaces: a model that binds "" or
  # "false" to the title column still writes a wrong migration, and dropping
  # the expectation rather than inverting it would have made exactly that case
  # unmeasurable.
  bindings:
    addColumn:
      because: >-
        The record: "The todos table carries exactly two columns of its own:
        title, a string that is not null and carries no default, and completed,
        a boolean that is not null and defaults to false." default is rendered
        into the migration verbatim. completed's is the unquoted Ruby literal
        false, bound as text. title carries no default, and the package now
        supplies nil for a default nobody binds - so the correct answer for
        title is to leave the kwarg alone, and binding anything at all is
        wrong. The primary key and the timestamps are the framework's, so a
        third column would be a duplicate.
      key: [name]
      invocations:
        # A string column with no default, which is now said by saying nothing:
        # the package binds nil for an unbound default, so the model's correct
        # move is to omit the kwarg and `~` is what scores that omission.
        #
        # resource accepts either form. This package's transforms are
        # [plural, snake] and [singular, snake], so todo and todos render
        # identically everywhere the templates use them - its README says so
        # outright - and naming one would score the author's preference rather
        # than the model's correctness (prov-2026-66b0116d).
        - resource: [todo, todos]
          # Read off the path the record authorizes, never invented. It is
          # scored because it is knowable here; a kwarg that were not would be
          # left out and report as not scored rather than be given a pattern to
          # satisfy.
          stamp: "20260814000000"
          name: title
          type: string
          nullable: false
          # Two spellings of one answer, the same way resource takes both forms
          # above. Omitting the kwarg leaves the package's declared default -
          # the literal nil - and binding that literal writes the same thing, so
          # the migration reads `default: nil` either way. A sample bound it
          # explicitly and scored twenty of twenty on behaviour while this
          # expectation called it wrong (prov-2026-0d30e826).
          #
          # Nothing else is admitted: "" does not parse and "false" is a boolean
          # default on a string column.
          default: [~, "nil"]
        # An unquoted false. The string "false" renders default: "false", which
        # is a string default on a boolean column.
        - resource: [todo, todos]
          stamp: "20260814000000"
          name: completed
          type: boolean
          nullable: false
          default: "false"

  # Applying the selection and asserting against the running application.
  # Measured only when a run asks for it with -behavior, because a behaviour
  # sample costs a scaffold, a dependency install, a database and a boot
  # (prov-2026-83340ba0).
  behavior:
    target: todo-rails
    pass_rate: 1.0
