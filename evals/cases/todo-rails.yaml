# The case the harness was built from. Its expectations are what a complete
# answer contains, taken from the runs where the model produced one - not from
# what it usually produces, which is the thing being measured.
#
# addColumn is the interesting row. Across nineteen manual runs it was selected
# on roughly half of them, and it appeared if and only if it appeared first
# (prov-2026-6d87dc11).
id: todo-rails

application:
  name: todo
  # Tier 1. A single resource, five endpoints, no auth and no relations. The
  # floor of the complexity axis rather than a representative sample of it.
  complexity: 1

framework: rails
tightness: defined
arm: sedum

# Outside this repository, because the fixture applications are real projects.
# Resolved against the root passed to Load, which defaults to the parent of the
# checkout.
generators: todo-rails/_generators
records: todo-rails/provenance

# Engine and quantization are part of a row's identity. The same checkpoint
# under MLX and under llama.cpp uses a different quantization scheme and does
# not produce identical output, so folding them together would let a rate
# measured on one be read as a claim about the other. Only the llama.cpp engine
# supports continuous batching today, which is the other reason they differ in
# practice rather than only on paper.
#
# On a 24GB machine only one of these is resident at a time, so running the
# whole list means a model swap between rows. -eval.model narrows a run to one.
models:
  # Continuous batching is llama.cpp-only today, so this is the row that can be
  # sampled concurrently.
  - id: qwen2.5-coder-14b-instruct
    engine: llama.cpp
    quant: q4_k_m
  # Faster single-stream, no batching. The row that matches interactive use.
  - id: qwen2.5-coder-14b-instruct-mlx
    engine: mlx
    quant: 4bit

expect:
  actions:
    # Two columns on the migration: title and completed.
    addColumn: 2
    # Five REST endpoints, each a composite covering the action and its route.
    createEndpoint: 5
    addControllerTest: 5
    definePermittedParams: 1
    addValidation: 1

# Reserved. Measuring this means applying the selection, starting the target and
# running its contracts, which is a different order of cost from a model call.
# Declared here so the schema does not change once it is implemented.
#
# behavior:
#   specs: todo-rails/linespec
#   pass_rate: 1.0
