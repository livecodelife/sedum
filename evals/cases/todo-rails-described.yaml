# The described arm of prov-2026-ac15ed2b.
#
# todo-rails-defined with one line changed: generators points at the package set
# whose actions and kwargs carry description fields. Everything else - the
# record, the application, the models, the expectations - is the same, because
# the comparison is only worth reading if descriptions are the one thing that
# varies.
#
# Run as a pair, at the fine resolution, against one model row. The invocation
# is in ../README.md under "The description comparison".
#
# Thirty samples per arm, fixed in the record before the run. The rails arm has
# come in at 4/4 and 5/5 across its whole history, so this is a question about
# moving a rate that is already at the ceiling: at five samples 4/5 is
# [0.38,0.96] and 5/5 is [0.57,1.00], which overlap. A run that size cannot see
# this effect in either direction, and its null result would read exactly like a
# finding.
#
# The entries already in results/ are not the undescribed arm. Every one is five
# samples or fewer, none states a resolution, and all were taken against a dirty
# tree - so both arms are drawn fresh.
id: todo-rails-described

application:
  name: todo
  # Tier 1. Five endpoints, two fields, no auth and no relations. The floor of
  # the complexity axis rather than a representative sample of it.
  complexity: 1

language: ruby
framework: rails
# Unchanged from the defined arm, and deliberately so. Tightness is how closely
# the actions and variants cover the intended output, and adding a description
# to a kwarg changes none of that - the same eight actions cover the same
# output either way. Descriptions are a different axis, and this pair varies it
# by naming a different package set while every declared field stays put.
tightness: defined
arm: sedum

records: todo-rails/records
# The one line that differs from todo-rails-defined.
generators: todo-rails/generators/described

models:
  - id: qwen2.5-coder-14b-instruct
    engine: llama.cpp
    quant: q4_k_m
  - id: qwen2.5-coder-14b-instruct-mlx
    engine: mlx
    quant: 4bit

# Identical to the defined arm's, and not independently derived. An expectation
# is a property of the record - what a complete answer to it contains - and both
# arms answer the same record with the same action names available. Two
# expectation blocks that drifted apart would be measuring two questions and
# reporting one number.
expect:
  actions:
    addColumn: 2
    createEndpoint: 5
    addControllerTest: 5
    definePermittedParams: 1
    addValidation: 1
    addModelTest: 1

  # Authored from the record rather than established from a run, which is the
  # opposite discipline the counts above are under. A count is a property of
  # the package and the record together that nobody has computed, so it is set
  # from an answer that was actually complete. A binding is stated in the
  # record and settled by Rails, so setting it from a run would be asking the
  # thing under test to grade itself (prov-2026-2b121b62).
  #
  # No sample has yet bound `default` correctly on either column, so there was
  # never an observation to establish these from - and that is the finding, not
  # a reason to wait.
  bindings:
    addColumn:
      because: >-
        The record: "The todos table carries exactly two columns of its own:
        title, a string that is not null and carries no default, and completed,
        a boolean that is not null and defaults to false." default is rendered
        into the migration verbatim, so the correct values are the Ruby
        literals nil and false - as text, because the kwarg's type is string.
        The primary key and the timestamps are the framework's, so a third
        column would be a duplicate.
      key: [name]
      invocations:
        # A string column with no default. nil is what "carries no default"
        # renders as; an empty string renders "default: " and does not parse.
        #
        # resource accepts either form. This package's transforms are
        # [plural, snake] and [singular, snake], so todo and todos render
        # identically everywhere the templates use them - its README says so
        # outright - and naming one would score the author's preference rather
        # than the model's correctness (prov-2026-66b0116d).
        - resource: [todo, todos]
          # Read off the path the record authorizes, never invented. It is
          # scored because it is knowable here; a kwarg that were not would be
          # left out and report as not scored rather than be given a pattern to
          # satisfy.
          stamp: "20260814000000"
          name: title
          type: string
          nullable: false
          default: "nil"
        # An unquoted false. The string "false" renders default: "false", which
        # is a string default on a boolean column.
        - resource: [todo, todos]
          stamp: "20260814000000"
          name: completed
          type: boolean
          nullable: false
          default: "false"
