# The Go arm of the language comparison.
#
# Its record asks for the same functionality as todo-rails-defined's, constraint
# for constraint, so the stack is what differs. A third "parity" case existed
# briefly to control for records that disagreed about deployment; stripping both
# records to functionality removed the disagreement, and two cases now do what
# three were needed for.
id: todo-chi-defined

application:
  name: todo
  # Tier 1, same as the Rails arm. Complexity describes the application, and it
  # is the same application - five endpoints, two fields, no auth, no relations.
  # The Go arm spreads over two packages where Rails uses one, but that is a
  # property of the generator package rather than of what is being asked for,
  # and rating it higher would put a package difference on the application axis.
  complexity: 1

language: go
framework: chi
tightness: defined
arm: sedum

records: todo-api/records
generators: todo-api/generators/defined

models:
  - id: qwen2.5-coder-14b-instruct
    engine: llama.cpp
    quant: q4_k_m

# One unfillable anchor remains: init.sql plants "extensions" and no action
# targets it, so the completeness pass (prov-2026-6d87dc11) fires once per
# sample and the model correctly declines. That is a standing second model call
# this case pays and the Rails one does not - worth knowing before reading a
# timing comparison between them.
#
# It used to be four. The others belonged to docker-compose.yml and .gitignore,
# which left the record's scope when it was cut to functionality.

# Established from per-sample counts, not from a mean.
#
# Five samples at commit 3e38d7c, all five valid. Three of them - samples 1, 2
# and 3 - produced *identical* answers containing exactly these counts, so this
# is what three independent complete answers agreed on rather than an average
# over answers none of which looked like it.
#
# That distinction is not academic here. The first attempt to establish these
# had only aggregates, and reported addQueryTest at 3.33, addHandlerTestImport
# at 0.67 and addMainImport at 0.33 - none of which is a count any answer can
# have. The per-sample rows (prov-2026-eb283c56) are what made it possible to
# tell a stable count from an average of unstable ones.
#
# The three the model is inconsistent about, and worth watching:
#   addHandlerTestImport  [0 1 1 1 0]
#   addQueryTest          [5 5 5 5 0]
#   createTable           [0 1 1 1 1]
# The other eight were identical across all five.
expect:
  actions:
    # One import per file that needs one.
    addDBImport: 1
    addDBTestImport: 1
    addHandlerImport: 1
    addHandlerTestImport: 1
    addMainImport: 1
    # Five endpoints, and a query, a handler test and a query test for each.
    createEndpoint: 5
    createQuery: 5
    addHandlerTest: 5
    addQueryTest: 5
    # Two fields on the model, one table in the schema.
    addModelField: 2
    createTable: 1
