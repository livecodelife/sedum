# The Go arm of the language comparison.
#
# Its record asks for the same functionality as todo-rails-defined's, constraint
# for constraint, so the stack is what differs. A third "parity" case existed
# briefly to control for records that disagreed about deployment; stripping both
# records to functionality removed the disagreement, and two cases now do what
# three were needed for.
id: todo-chi-defined

application:
  name: todo
  # Tier 1, same as the Rails arm. Complexity describes the application, and it
  # is the same application - five endpoints, two fields, no auth, no relations.
  # The Go arm spreads over two packages where Rails uses one, but that is a
  # property of the generator package rather than of what is being asked for,
  # and rating it higher would put a package difference on the application axis.
  complexity: 1

language: go
framework: chi
tightness: defined
arm: sedum

records: todo-api/records
generators: todo-api/generators/defined

models:
  - id: qwen2.5-coder-14b-instruct
    engine: llama.cpp
    quant: q4_k_m

# One unfillable anchor remains: init.sql plants "extensions" and no action
# targets it, so the completeness pass (prov-2026-6d87dc11) fires once per
# sample and the model correctly declines. That is a standing second model call
# this case pays and the Rails one does not - worth knowing before reading a
# timing comparison between them.
#
# It used to be four. The others belonged to docker-compose.yml and .gitignore,
# which left the record's scope when it was cut to functionality.

# Deliberately empty. Expectations are what a complete answer contains, and
# nothing has produced one here yet - writing counts from reading the package
# would make the first run agree with them by construction.
expect:
  actions: {}
