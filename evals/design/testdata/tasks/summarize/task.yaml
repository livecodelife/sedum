id: summarize
package: growlog
target:
- summary.go
context:
- entry.go
hidden:
- summary_test.go
behaviour: |
  Package growlog (the Entry type already exists in entry.go) summarizes grow log entries. Write summary.go. It provides the types Filter, ModelStats and Summary, the methods LiteralShare and FailureRate on ModelStats, and the function Summarize.

  Filter selects entries; its zero fields match everything. Its fields are Since time.Time, Record string and Model string. An entry passes when Record is empty or equals the entry's record, Model is empty or equals the entry's model, and Since is zero or the entry's TS (an RFC3339 time) parses and is not before Since; an entry whose TS does not parse fails a non-zero Since.

  ModelStats totals one model: Model string (json model), Grows (grows), Failed (failed), Calls (calls), Retries (retries), Repairs (repairs), Completeness (completeness), PromptTokens (prompt_tokens), CompletionTokens (completion_tokens), Invocations (invocations) and Literal (literal), all ints except Model. Retries are the entries' Rejected answers; Repairs are their Repairs. An entry whose Mode is "skip" is not a grow: it counts toward the token and call sums but not toward Grows or Failed. A grow whose Outcome is "failed" counts toward Failed. LiteralShare is Literal divided by Invocations as a float64, or 0 with no invocations. FailureRate is Failed divided by Grows, or 0 with no grows.

  Summary has Entries int (entries; how many entries passed the filter), Malformed int (malformed; left for the caller to set), Models []ModelStats (models) and Total ModelStats (total).

  Summarize(entries []Entry, f Filter) Summary counts every entry that passes f once into the stats of its model (grouped by the entry's Model, which may be empty) and into Total. Models is sorted by model name and is never nil, even when empty.
signatures: "Package growlog (the Entry type already exists in entry.go) summarizes grow log entries. Write summary.go. It provides the types Filter, ModelStats and Summary, the methods LiteralShare and FailureRate on ModelStats, and the function Summarize.\n\nFilter selects entries; its zero fields match everything. Its fields are Since time.Time, Record string and Model string. An entry passes when Record is empty or equals the entry's record, Model is empty or equals the entry's model, and Since is zero or the entry's TS (an RFC3339 time) parses and is not before Since; an entry whose TS does not parse fails a non-zero Since.\n\nModelStats totals one model: Model string (json model), Grows (grows), Failed (failed), Calls (calls), Retries (retries), Repairs (repairs), Completeness (completeness), PromptTokens (prompt_tokens), CompletionTokens (completion_tokens), Invocations (invocations) and Literal (literal), all ints except Model. Retries are the entries' Rejected answers; Repairs are their Repairs. An entry whose Mode is \"skip\" is not a grow: it counts toward the token and call sums but not toward Grows or Failed. A grow whose Outcome is \"failed\" counts toward Failed. LiteralShare is Literal divided by Invocations as a float64, or 0 with no invocations. FailureRate is Failed divided by Grows, or 0 with no grows.\n\nSummary has Entries int (entries; how many entries passed the filter), Malformed int (malformed; left for the caller to set), Models []ModelStats (models) and Total ModelStats (total).\n\nSummarize(entries []Entry, f Filter) Summary counts every entry that passes f once into the stats of its model (grouped by the entry's Model, which may be empty) and into Total. Models is sorted by model name and is never nil, even when empty.\n\nThe declarations to provide, with bodies elided:\n\ntype Filter struct {\n\tSince  time.Time\n\tRecord string\n\tModel  string\n}\n\nfunc (f Filter) match(e Entry) bool\n\ntype ModelStats struct {\n\tModel            string `json:\"model\"`\n\tGrows            int    `json:\"grows\"`\n\tFailed           int    `json:\"failed\"`\n\tCalls            int    `json:\"calls\"`\n\tRetries          int    `json:\"retries\"`\n\tRepairs          int    `json:\"repairs\"`\n\tCompleteness     int    `json:\"completeness\"`\n\tPromptTokens     int    `json:\"prompt_tokens\"`\n\tCompletionTokens int    `json:\"completion_tokens\"`\n\tInvocations      int    `json:\"invocations\"`\n\tLiteral          int    `json:\"literal\"`\n}\n\nfunc (m ModelStats) LiteralShare() float64\n\nfunc (m ModelStats) FailureRate() float64\n\ntype Summary struct {\n\tEntries   int          `json:\"entries\"`\n\tMalformed int          `json:\"malformed\"`\n\tModels    []ModelStats `json:\"models\"`\n\tTotal     ModelStats   `json:\"total\"`\n}\n\nfunc (m *ModelStats) add(e Entry)\n\nfunc Summarize(entries []Entry, f Filter) Summary\n"
code: "Write the following code into summary.go, exactly as it is, with no changes:\n\npackage growlog\n\nimport (\n\t\"sort\"\n\t\"time\"\n)\n\n// Filter selects which entries Summarize counts. Zero fields match everything.\ntype Filter struct {\n\tSince  time.Time\n\tRecord string\n\tModel  string\n}\n\n// match reports whether e passes the filter. An entry whose ts does not parse\n// fails a non-zero Since.\nfunc (f Filter) match(e Entry) bool {\n\tif f.Record != \"\" && e.Record != f.Record {\n\t\treturn false\n\t}\n\tif f.Model != \"\" && e.Model != f.Model {\n\t\treturn false\n\t}\n\tif !f.Since.IsZero() {\n\t\tts, err := time.Parse(time.RFC3339, e.TS)\n\t\tif err != nil || ts.Before(f.Since) {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn true\n}\n\n// ModelStats is the totals for one model. Retries are the answers the model\n// had refused (Entry.Rejected); Repairs are verification send-backs.\ntype ModelStats struct {\n\tModel            string `json:\"model\"`\n\tGrows            int    `json:\"grows\"`\n\tFailed           int    `json:\"failed\"`\n\tCalls            int    `json:\"calls\"`\n\tRetries          int    `json:\"retries\"`\n\tRepairs          int    `json:\"repairs\"`\n\tCompleteness     int    `json:\"completeness\"`\n\tPromptTokens     int    `json:\"prompt_tokens\"`\n\tCompletionTokens int    `json:\"completion_tokens\"`\n\tInvocations      int    `json:\"invocations\"`\n\tLiteral          int    `json:\"literal\"`\n}\n\n// LiteralShare is the fraction of invocations that carried model-written code,\n// or 0 when there were none.\nfunc (m ModelStats) LiteralShare() float64 {\n\tif m.Invocations == 0 {\n\t\treturn 0\n\t}\n\treturn float64(m.Literal) / float64(m.Invocations)\n}\n\n// FailureRate is the fraction of grows that failed, or 0 when there were none.\nfunc (m ModelStats) FailureRate() float64 {\n\tif m.Grows == 0 {\n\t\treturn 0\n\t}\n\treturn float64(m.Failed) / float64(m.Grows)\n}\n\n// Summary is Summarize's result: per-model stats sorted by model name, and the\n// total over all of them.\ntype Summary struct {\n\tEntries   int          `json:\"entries\"`\n\tMalformed int          `json:\"malformed\"`\n\tModels    []ModelStats `json:\"models\"`\n\tTotal     ModelStats   `json:\"total\"`\n}\n\n// add counts e into m. A skip line is not a grow.\nfunc (m *ModelStats) add(e Entry) {\n\tif e.Mode != \"skip\" {\n\t\tm.Grows++\n\t\tif e.Outcome == \"failed\" {\n\t\t\tm.Failed++\n\t\t}\n\t}\n\tm.Calls += e.Calls\n\tm.Retries += e.Rejected\n\tm.Repairs += e.Repairs\n\tm.Completeness += e.Completeness\n\tm.PromptTokens += e.PromptTokens\n\tm.CompletionTokens += e.CompletionTokens\n\tm.Invocations += e.Invocations\n\tm.Literal += e.Literal\n}\n\n// Summarize totals the entries that pass f, per model and overall.\nfunc Summarize(entries []Entry, f Filter) Summary {\n\tby := map[string]*ModelStats{}\n\tvar s Summary\n\tfor _, e := range entries {\n\t\tif !f.match(e) {\n\t\t\tcontinue\n\t\t}\n\t\ts.Entries++\n\t\tm := by[e.Model]\n\t\tif m == nil {\n\t\t\tm = &ModelStats{Model: e.Model}\n\t\t\tby[e.Model] = m\n\t\t}\n\t\tm.add(e)\n\t\ts.Total.add(e)\n\t}\n\tfor _, m := range by {\n\t\ts.Models = append(s.Models, *m)\n\t}\n\tsort.Slice(s.Models, func(i, j int) bool { return s.Models[i].Model < s.Models[j].Model })\n\tif s.Models == nil {\n\t\ts.Models = []ModelStats{}\n\t}\n\treturn s\n}\n"
