id: append
package: growlog
target:
- entry.go
context: []
hidden:
- entry_test.go
behaviour: |
  Package growlog keeps a persistent grow log: an append-only JSON Lines file with one line per record per `sedum grow`. Write entry.go. It provides the constant Version (1), the types Regions and Entry, and the function Append.

  Regions counts what one grow did to a record's regions, with the integer fields Injected, Replaced, Pruned and Unchanged (JSON keys injected, replaced, pruned, unchanged).

  Entry is one log line. Its fields, in this order with these JSON keys: V int (v), TS string (ts), Sedum string (sedum), Record string (record), Mode string (mode), Model string (model), Calls int (calls), Rejected int (rejected), Completeness int (completeness), Repairs int (repairs), PromptTokens int (prompt_tokens), CompletionTokens int (completion_tokens), Invocations int (invocations), Literal int (literal), Declarative int (declarative), Regions Regions (regions), Files int (files), MS int64 (ms), Outcome string (outcome) and Error string (error, omitted from the JSON when empty).

  Append(path string, e Entry) error adds e as one JSON line to the file at path, creating the file and its parent directories. It sets V to Version when V is zero. It keeps only the first line of the error text, trimmed of surrounding space and at most 300 bytes, never cutting a UTF-8 character in half. It writes the whole line (with its newline) in a single write to a file opened for appending, so concurrent writers never interleave their lines. Every error it returns says what it was doing and wraps the cause.
signatures: "Package growlog keeps a persistent grow log: an append-only JSON Lines file with one line per record per `sedum grow`. Write entry.go. It provides the constant Version (1), the types Regions and Entry, and the function Append.\n\nRegions counts what one grow did to a record's regions, with the integer fields Injected, Replaced, Pruned and Unchanged (JSON keys injected, replaced, pruned, unchanged).\n\nEntry is one log line. Its fields, in this order with these JSON keys: V int (v), TS string (ts), Sedum string (sedum), Record string (record), Mode string (mode), Model string (model), Calls int (calls), Rejected int (rejected), Completeness int (completeness), Repairs int (repairs), PromptTokens int (prompt_tokens), CompletionTokens int (completion_tokens), Invocations int (invocations), Literal int (literal), Declarative int (declarative), Regions Regions (regions), Files int (files), MS int64 (ms), Outcome string (outcome) and Error string (error, omitted from the JSON when empty).\n\nAppend(path string, e Entry) error adds e as one JSON line to the file at path, creating the file and its parent directories. It sets V to Version when V is zero. It keeps only the first line of the error text, trimmed of surrounding space and at most 300 bytes, never cutting a UTF-8 character in half. It writes the whole line (with its newline) in a single write to a file opened for appending, so concurrent writers never interleave their lines. Every error it returns says what it was doing and wraps the cause.\n\nThe declarations to provide, with bodies elided:\n\nconst Version = 1\n\nconst maxError = 300\n\ntype Regions struct {\n\tInjected  int `json:\"injected\"`\n\tReplaced  int `json:\"replaced\"`\n\tPruned    int `json:\"pruned\"`\n\tUnchanged int `json:\"unchanged\"`\n}\n\ntype Entry struct {\n\tV                int     `json:\"v\"`\n\tTS               string  `json:\"ts\"`\n\tSedum            string  `json:\"sedum\"`\n\tRecord           string  `json:\"record\"`\n\tMode             string  `json:\"mode\"`\n\tModel            string  `json:\"model\"`\n\tCalls            int     `json:\"calls\"`\n\tRejected         int     `json:\"rejected\"`\n\tCompleteness     int     `json:\"completeness\"`\n\tRepairs          int     `json:\"repairs\"`\n\tPromptTokens     int     `json:\"prompt_tokens\"`\n\tCompletionTokens int     `json:\"completion_tokens\"`\n\tInvocations      int     `json:\"invocations\"`\n\tLiteral          int     `json:\"literal\"`\n\tDeclarative      int     `json:\"declarative\"`\n\tRegions          Regions `json:\"regions\"`\n\tFiles            int     `json:\"files\"`\n\tMS               int64   `json:\"ms\"`\n\tOutcome          string  `json:\"outcome\"`\n\tError            string  `json:\"error,omitempty\"`\n}\n\nfunc clipError(s string) string\n\nfunc Append(path string, e Entry) error\n"
code: "Write the following code into entry.go, exactly as it is, with no changes:\n\npackage growlog\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n\t\"os\"\n\t\"path/filepath\"\n\t\"strings\"\n\t\"unicode/utf8\"\n)\n\n// Version is the schema version written in every line of the grow log.\nconst Version = 1\n\n// maxError bounds the error text kept in one line.\nconst maxError = 300\n\n// Regions counts what one grow did to a record's regions.\ntype Regions struct {\n\tInjected  int `json:\"injected\"`\n\tReplaced  int `json:\"replaced\"`\n\tPruned    int `json:\"pruned\"`\n\tUnchanged int `json:\"unchanged\"`\n}\n\n// Entry is one line of the grow log: what one grow did for one record. It\n// holds counts and timings only, never prompt or response text, kwargs, file\n// contents or keys.\ntype Entry struct {\n\tV                int     `json:\"v\"`\n\tTS               string  `json:\"ts\"`\n\tSedum            string  `json:\"sedum\"`\n\tRecord           string  `json:\"record\"`\n\tMode             string  `json:\"mode\"`\n\tModel            string  `json:\"model\"`\n\tCalls            int     `json:\"calls\"`\n\tRejected         int     `json:\"rejected\"`\n\tCompleteness     int     `json:\"completeness\"`\n\tRepairs          int     `json:\"repairs\"`\n\tPromptTokens     int     `json:\"prompt_tokens\"`\n\tCompletionTokens int     `json:\"completion_tokens\"`\n\tInvocations      int     `json:\"invocations\"`\n\tLiteral          int     `json:\"literal\"`\n\tDeclarative      int     `json:\"declarative\"`\n\tRegions          Regions `json:\"regions\"`\n\tFiles            int     `json:\"files\"`\n\tMS               int64   `json:\"ms\"`\n\tOutcome          string  `json:\"outcome\"`\n\tError            string  `json:\"error,omitempty\"`\n}\n\n// clipError keeps the first line of s, trimmed, at most maxError bytes and\n// never cutting a UTF-8 sequence.\nfunc clipError(s string) string {\n\ts, _, _ = strings.Cut(s, \"\\n\")\n\ts = strings.TrimSpace(s)\n\tif len(s) <= maxError {\n\t\treturn s\n\t}\n\ts = s[:maxError]\n\tfor !utf8.ValidString(s) {\n\t\ts = s[:len(s)-1]\n\t}\n\treturn s\n}\n\n// Append adds e as one line to the log at path, creating the file and its\n// directory. V is set to Version when zero and Error is clipped. The line is\n// written with a single write to an O_APPEND file, so concurrent writers never\n// interleave their lines.\nfunc Append(path string, e Entry) error {\n\tif e.V == 0 {\n\t\te.V = Version\n\t}\n\te.Error = clipError(e.Error)\n\tline, err := json.Marshal(e)\n\tif err != nil {\n\t\treturn fmt.Errorf(\"encode grow log entry: %w\", err)\n\t}\n\tif err := os.MkdirAll(filepath.Dir(path), 0o755); err != nil {\n\t\treturn fmt.Errorf(\"create grow log directory for %s: %w\", path, err)\n\t}\n\tf, err := os.OpenFile(path, os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o644)\n\tif err != nil {\n\t\treturn fmt.Errorf(\"open grow log %s: %w\", path, err)\n\t}\n\tif _, err := f.Write(append(line, '\\n')); err != nil {\n\t\tf.Close()\n\t\treturn fmt.Errorf(\"write grow log %s: %w\", path, err)\n\t}\n\treturn f.Close()\n}\n"
