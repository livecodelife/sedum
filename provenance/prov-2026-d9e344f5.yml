id: prov-2026-d9e344f5
title: The Go service template carries a health endpoint, and the harness does not depend on it
status: implemented
created_at: "2026-08-18"
author: calebcowen@gmail.com
intent: |
  `main.go` registers `GET /healthz`, returning 200 once the database has
  answered. The boot probe is not pointed at it.

  ## Why the template gains one

  [[prov-2026-d318e3dd]] holds that a generator package is what an engineering
  team would author who wanted a repeatable template for new services. A
  containerised Go service gets a health endpoint from that team, once, in the
  template - it is what a load balancer polls and what an orchestrator restarts
  on. The Rails side has `/up` because the framework's own scaffold writes one;
  Go has no framework to supply it, and the standard supplied nothing.

  It is file-template content and not an action, so the catalog is unchanged and
  no selection measurement moves. The model neither sees it nor chooses it.

  ## Why the probe still does not use it

  This is the trap the previous two imprints were written from, and it would be
  easy to walk back into. `main.go` is in the chi records' affected_scope, so
  the baseline arm writes that file - and a probe pointed at `/healthz` would
  pass for the arm whose package plants it and fail for the arm that had no way
  to know the name. That is precisely the coupling
  [[prov-2026-79e94e7c]] removed.

  So the probe keeps polling the base URL, which asks nothing of either arm, and
  the health endpoint exists for the reason a real one does: something outside
  the eval would use it.

  ## Why 200-once-the-database-answers

  A health endpoint that returns 200 while the service cannot reach its database
  is a liveness check wearing a readiness check's name. `waitForDatabase`
  already fatals when the database never arrives, so by the time the router is
  serving, a plain 200 is honest - and a handler that re-pinged per request
  would put a database round trip on the hot path of the thing polled most
  often.
constraints:
  - >-
    The health endpoint is file-template content, never an action. Adding it to
    the catalog would change what the model selects from and move a measurement
    that has nothing to do with health.
  - >-
    The boot probe does not poll it. main.go is authorized, so the baseline arm
    writes that file, and a probe naming a route only one arm plants is the
    coupling two records have already been written to remove.
  - >-
    It returns 200 without a per-request database round trip. The service has
    already refused to start without one, and the endpoint polled most often is
    the wrong place to put a query.
