intent: The Region type is one region after expansion, with the kwargs it was rendered from, as a recording holds it.
constraints:
  - The type lives in internal/recording/recording.go, package recording, and adds no imports
  - Region is an exported struct with the fields Path, Action, Variant, Tier and Pkg of type string, ID of type map[string]any, Kwargs of type map[string]any, KwargsHash of type string and Body of type string
  - The JSON keys are path, action, variant, tier, pkg, id, kwargs, kwargs_hash and body, none omitted when empty
  - ID holds the identity kwargs of the region and Kwargs holds every resolved kwarg it was rendered from
  - KwargsHash and Body hold the hashes written on the region's marker
  - Tier holds owned or seeded and Pkg holds the pkg hash on the marker
