intent: The RegionRef struct names one region in a report, with the reason it is stale.
constraints:
  - The type lives in internal/pipeline/classify.go, package pipeline, and adds no imports
  - RegionRef is an exported struct with the string fields Path, Action, Variant and Reason
  - 'Path, Action and Variant name the region: its file path, its marker''s action and its marker''s variant'
  - Reason is the empty string except on a stale v2 region
  - Reason is no recording when the region's recording file does not exist
  - Reason is recording unreadable when the recording cannot be read for another reason or holds no such record
  - Reason is recording has no entry for this region when the recording holds no entry for the region
  - Reason is recording does not match the marker when the recording's entry disagrees with the marker
