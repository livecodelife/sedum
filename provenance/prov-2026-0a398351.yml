id: prov-2026-0a398351
title: sedum markers migrate rewrites v1 markers to v2 with no model
type: blueprint
status: open
version: 1
reason: ""
created_at: "2026-10-26"
author: calebcowen@gmail.com
intent: An existing tree of v1 markers should be rewritten to v2 and given recordings by a command that calls no model and never changes a region's text.
constraints:
  - sedum markers migrate rewrites each v1 marker it can to a v2 marker
  - sedum markers migrate writes the recordings of the records the markers name
  - sedum markers migrate calls no model
  - A region's text is never changed by migration
  - A migrated marker keeps the gen and pkg of the marker it replaces
  - A region that cannot be migrated is refused and reported, and keeps its v1 marker
  - A v1 region whose marker names no known record is left as it is and reported
  - sedum markers migrate --dry-run writes nothing
  - grow --check reports the same current and stale classes after migration as before it
  - Re-rendering a migrated region from its recording reproduces its body
  - Migrating a second time changes nothing
  - The markers command is registered on the root command
  - A scope path no generator package claims, such as a document, a script, a configuration file, a data file or a file with no extension, cannot carry markers, so migration leaves it out, counts it and reports the count, and never fails because of it
  - A file's regions are judged against the generator package, among those that claim its extension, that declares their actions
  - Which scope paths a migration reads is decided by the loaded generator packages, so a package for any language contributes its files and only the paths no loaded package claims are skipped
affected_scope:
  - internal/pipeline/migrate.go
  - internal/cli/markers.go
  - internal/cli/root.go
  - internal/pipeline/migrate_test.go
  - internal/cli/markers_test.go
  - internal/pipeline/migrate_unclaimed_test.go
  - internal/cli/markers_unclaimed_test.go
forbidden_scope: []
related: []
