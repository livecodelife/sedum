id: prov-2026-d2f1bdf2
title: 'sedum-binder-final-2b-le12k-e5 becomes the default shipped model'
status: open
version: 7
reason: 'release_test.go: the model URL test follows the release asset''s name'
created_at: "2026-10-06"
author: calebcowen@gmail.com
intent: |-
  The checkpoint sedum-binder-final-2b-le12k-e5, a Q8_0 gguf of 2012012768
  bytes, replaces the current model as the zero-flag default shipped beside the
  sedum binary. The bundled filename stays sedum-default-model.gguf, as the
  comment in bundled.go already says a re-tuned default should, so lookup code,
  goreleaser and install.sh need no change. What changes is the asset the
  release URL names, and the sha256 that hack/fetch-release-assets.sh pins for
  it: 5185a0b25d5a13262fa6dfcdb1b2091b7bb64f130d65cdb5322c99c992dd052e.
  This supersedes the default named by [[prov-2026-668746b1]] but not its
  bundling mechanism.

  The maintainer, not this work, uploads the file to the model-assets release,
  under its own name, Qwen3.5-2B.Q8_0.gguf, beside the previous default, which
  stays in place so the release that shipped it remains reproducible. The release
  asset URL names that file. If the file served there is not the one pinned, the
  pinned checksum does not match and a release build fails its checksum check:
  that is the intended failure, a build must never ship an unverified model. The
  order is upload first, then tag.

  A per-run --model or --local-model still overrides the default and is covered
  by a spec. The evals under evals/ published results for the old default;
  none of them are claimed for this checkpoint, and the new one is not
  measured here.
constraints:
  - --model and --local-model still take precedence over the bundled default and a spec proves it, with both a bundled model present and absent.
  - README and docs wording about the default model names the new checkpoint and carries no claim about its eval results.
  - Results under evals/results are not edited, and no published figure is attributed to the new default.
  - MODEL_SHA in hack/fetch-release-assets.sh is exactly 5185a0b25d5a13262fa6dfcdb1b2091b7bb64f130d65cdb5322c99c992dd052e, the sha256 of Qwen3.5-2B.Q8_0.gguf from the sedum-binder-final-2b-le12k-e5 directory.
  - MODEL_URL in hack/fetch-release-assets.sh names the asset Qwen3.5-2B.Q8_0.gguf on the model-assets release, and the file is staged and bundled as sedum-default-model.gguf.
  - The previous default asset stays on the model-assets release, so the release that shipped it can be rebuilt.
  - Sedum work does not publish, upload, or tag anything. The maintainer uploads the asset to the model-assets release, and a release build fails its checksum until the URL serves the pinned file; this must be stated wherever the pin or the URL is changed.
affected_scope:
  - hack/fetch-release-assets.sh
  - README.md
forbidden_scope:
