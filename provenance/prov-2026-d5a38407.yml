id: prov-2026-d5a38407
title: 'Version 0.9.2: markers migrate replaces files by rename, so locked files migrate and a failed run changes nothing'
type: blueprint
status: open
version: 1
reason: ""
created_at: "2026-10-26"
author: calebcowen@gmail.com
intent: '0.9.1 -> 0.9.2: patch. sedum markers migrate wrote each file in place, so a file locked against writing stopped the run partway and left some files already rewritten; it now stages a replacement for every file it rewrites, writes the recordings, then renames each replacement over its original, so locked files migrate and keep their mode, and a failure while staging changes nothing. See CHANGELOG.md.'
