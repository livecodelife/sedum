intent: |-
  Implements prov-2026-95d9ae7e: further tests for file selection in internal/adopt/select.go (Select(cfg SelectConfig, paths []string) ([]Candidate, []Skip, error); Candidate, Skip, Reason and SelectConfig{Root string; Set *genpkg.Set; Records *record.Set; Tests bool} as in prov-2026-37216199). New file internal/adopt/select_more_test.go, package adopt, tests only. It reuses `newSelectFixture(t *testing.T) (root string, set *genpkg.Set, records *record.Set)` from select_test.go, which writes a py package (extension .py, test_paths ["test_*.py"], unmanaged ["setup.py"], file template `{name}.py`) and a single imprint "imp-1" authorizing "*.py"; do not redefine it. Each test is its OWN setFunction invocation: TestSelectWalksDirectories (files sub/b.py, sub/a.py and sub/.hidden/c.py: Select with the paths "sub" and "sub" yields the Candidates for sub/a.py then sub/b.py, once each, and nothing from sub/.hidden because a dotted directory met while walking is not entered; Candidate.Path values are slash-separated and relative to root); TestSelectRejectsEscapingPath (a path "../x.py" returns an error); TestSelectTestsFlag (test_a.py is a Candidate when cfg.Tests is true); TestSelectNoImprintAndAmbiguous (a second imprint "imp-2" authorizing "*.py" makes a.py ReasonAmbiguousImprint with both ids in Detail; a records set with no imprint makes it ReasonNoImprint).
  Fixture rules that matter: ignore the `records` the fixture returns in these four tests and build the records inline, because a single `*` does not cross a slash and the fixture's "*.py" would not authorize sub/a.py. TestSelectWalksDirectories, TestSelectTestsFlag and TestSelectRejectsEscapingPath use `&record.Set{Records: []*record.Record{{ID: "imp-1", Type: "imprint", Patterns: []string{"**/*.py"}}}}`. TestSelectNoImprintAndAmbiguous creates root/a.py and uses, for the ambiguous case, `&record.Set{Records: []*record.Record{{ID: "imp-1", Type: "imprint", Patterns: []string{"**/*.py"}}, {ID: "imp-2", Type: "imprint", Patterns: []string{"**/*.py"}}}}` (expect Skip with ReasonAmbiguousImprint and Detail containing both "imp-1" and "imp-2") and for the no-imprint case `&record.Set{}` (expect ReasonNoImprint). The paths passed to Select are file or directory names relative to root, e.g. "a.py" or "sub".
