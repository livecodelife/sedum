intent: 'Implements prov-2026-95d9ae7e: further tests for file selection in internal/adopt/select.go (Select(cfg SelectConfig, paths []string) ([]Candidate, []Skip, error); Candidate, Skip, Reason and SelectConfig{Root string; Set *genpkg.Set; Records *record.Set; Tests bool} as in prov-2026-37216199). New file internal/adopt/select_more_test.go, package adopt, tests only. It reuses `newSelectFixture(t *testing.T) (root string, set *genpkg.Set, records *record.Set)` from select_test.go, which writes a py package (extension .py, test_paths ["test_*.py"], unmanaged ["setup.py"], file template `{name}.py`) and a single imprint "imp-1" authorizing "*.py"; do not redefine it. Each test is its OWN setFunction invocation: TestSelectWalksDirectories (files sub/b.py, sub/a.py and .hidden/c.py: selecting "sub" and ".hidden" and "sub" again yields a.py then b.py, once each, and nothing from .hidden/ by walking it); TestSelectRejectsEscapingPath (a path "../x.py" returns an error); TestSelectTestsFlag (test_a.py is a Candidate when cfg.Tests is true); TestSelectNoImprintAndAmbiguous (a second imprint "imp-2" authorizing "*.py" makes a.py ReasonAmbiguousImprint with both ids in Detail; a records set with no imprint makes it ReasonNoImprint).'
