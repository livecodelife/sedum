associated_specs:
  # The schema half and the behaviour half. The recording spec asserts the
  # properties a committed artifact has to keep - clean diffs, the reserved
  # phase level, pre-expansion invocations - because those are the decisions a
  # later migration would cost the most. The pipeline spec asserts replay
  # itself: identical output, terminal validation, package identity, and the
  # duplicate-path check now living at Phase 4's entry.
