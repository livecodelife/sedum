intent: The attrsV2 type is the struct a v2 marker's attribute object is encoded from.
constraints:
  - The type lives in internal/inject/marker.go, package inject, and adds no imports
  - attrsV2 is an unexported struct type with the fields V of type int, Tier of type Tier, Record, Gen, Pkg and Writer of type string, ID of type map[string]any, Kwargs of type string and Body of type string
  - The JSON keys of the fields are v, tier, record, gen, pkg, writer, id, kwargs and body, in the order of the fields
  - The keys v and tier are always written
  - The keys record, gen, pkg, writer, id, kwargs and body are omitted when empty
  - attrsV2 has no field for carried keys, which Marker.encodeAttrs appends after it
