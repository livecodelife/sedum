sealed_at_sha: 7d2e9501265fe3d41299fab0db931999a36e8316
associated_specs:
  # The decode change is a unit-level claim - an entry carrying an extra key is
  # accepted, a mistyped key still rejects - so the package's own tests are the
  # proof, and they need no endpoint.
  - path: internal/selection/selection_test.go
    run_command: go test -count=1 ./$(dirname {{path}})
  - path: evals/results_test.go
    run_command: go test -count=1 ./$(dirname {{path}})
