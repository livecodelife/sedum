content:
  id: prov-2026-ed6e0b88
  title: The operate method applies one built-in operation to a value
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: The operate method of Engine, in internal/transform/ops.go, applies one built-in operation, named by a transform reference, to a value and returns the resulting text.
  constraints:
    - operate is a method on a pointer to Engine, named operate, in package transform.
    - 'operate receives two positional arguments: a Ref r, which is the reference with its Name and Arg strings, then a value v of the empty interface type.'
    - 'operate returns two results: the resulting string, then an error.'
    - When r.Name is plural and v is a Value whose Plural field is not empty, operate returns that Plural field and a nil error.
    - When r.Name is singular and v is a Value whose Singular field is not empty, operate returns that Singular field and a nil error.
    - When r.Name is join, operate returns the result of the package function joinList called with r.Arg (a string) and v (the empty interface), which returns a string and an error, before v is flattened to a scalar.
    - For every other name, operate first calls the package function scalar with v, which takes the empty interface and returns a string and an error, and returns the error with an empty string if it fails.
    - pascal returns the Engine method joinWords called with the text, the string pascal and false; joinWords returns a string.
    - camel returns the Engine method joinWords called with the text, the string camel and true.
    - snake returns the text converted by ToSnake from the strcase package.
    - kebab returns the text converted by ToKebab from the strcase package.
    - upper returns the text converted to upper case as a whole by ToUpper from the strings package.
    - lower returns the text converted to lower case as a whole by ToLower from the strings package.
    - plural returns the plural method of the engine's inflector called with the text, which returns a string.
    - singular returns the singular method of the engine's inflector called with the text, which returns a string.
    - prefix returns r.Arg followed by the text.
    - suffix returns the text followed by r.Arg.
    - quote returns the result of the package function quote called with the text, which returns a string and an error.
    - trimprefix returns the package function trimPrefixLiteral called with the text then r.Arg, and a nil error.
    - unwrap returns both results of the package function unwrapPair called with the text then r.Arg, which returns a string and an error.
    - For any other name, operate returns an empty string and the error from the package function checkOperation called with r, which takes a Ref and returns an error.
    - operate imports ToSnake and ToKebab's package github.com/iancoleman/strcase as a value, and the strings package as a value; the file's other imports belong to its other functions.
  affected_scope:
    - internal/transform/ops.go
  implements: prov-2026-d9cb29e4
