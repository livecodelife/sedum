content:
  id: prov-2026-88c83fa3
  title: 'adopt: more declarative adopter tests'
  type: imprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: |-
    Implements prov-2026-95d9ae7e: further tests for the declarative adopter in internal/adopt/declarative.go (NewDeclarative(pkg *genpkg.Package) (*Declarative, error); (*Declarative).Split(path string, src []byte) ([]Span, error); behaviour as in prov-2026-856f85eb). New file internal/adopt/declarative_more_test.go, package adopt, no non-test code. Each test is its OWN setFunction invocation and builds its genpkg.Package literal inline (Adopt{UnitStart: `^(?P<kind>def|class) (?P<name>\w+)`, Actions: {"def": "setFunction", "class": "setType"}, ...} and Actions setFunction and setType, each declaring kwargs file, name and code). Tests: TestDeclarativeDedentEnd; TestDeclarativeRegexpEndWithMatch; TestDeclarativeRegexpEndWithoutMatchRunsToEOF; TestDeclarativeAttachAbove (an `@dec` line directly above joins the unit through attach_above, a blank line between does not); TestDeclarativeUnknownKindStaysResidual; TestDeclarativeKwargsAreOnlyTheDeclaredOnes (an action declaring only name and code gets no file); TestNewDeclarativeRejectsCommandAndMissingAdopt.
    Fixture rules that matter: every Adopt literal sets UnitEnd explicitly (`"dedent"` unless the test is about another mode; an empty UnitEnd is a regexp that matches every line, which ends a unit at its first line) and gives the named groups kind and name in UnitStart; the python-style sources indent a unit's body with four spaces. TestNewDeclarativeRejectsEmptyUnitEnd (a Package with Adopt{UnitStart: `^(?P<kind>def) (?P<name>\w+)`, Actions: {"def": "setFunction"}} and no UnitEnd: NewDeclarative returns an error containing "unit_end is required") is one more test, written as its own setFunction. TestNewDeclarativeRejectsCommandAndMissingAdopt uses exactly two cases: &genpkg.Package{Name: "x", Adopt: &genpkg.Adopt{Command: []string{"splitter"}}} and &genpkg.Package{Name: "x"}; both must return an error.
  affected_scope:
    - internal/adopt/declarative_more_test.go
    - internal/adopt/declarative_more_test.go
  implements: prov-2026-95d9ae7e
  implements_version: 2
