content:
  id: prov-2026-9621daed
  title: Grow skips, re-renders or re-selects each record by its hashes
  type: blueprint
  created_at: "2026-10-15"
  author: calebcowen@gmail.com
  intent: |-
    Grow decides what to do with each record from the markers on the regions it owns and, for v2 regions, from the record's recording, before any model call. A second grow over unchanged records makes no model calls and edits no files.

    ## Per record, before Phase 4

    After Phase 3, grow reads the regions each record owns in the managed files it authorizes (owned by id or alias) and decides:

    | Record's owned regions                                                         | Action     | Model call |
    | none yet                                                                        | select     | yes        |
    | any owned region's gen differs, or is empty                                     | re-select  | yes        |
    | a v2 region's recording is missing, unreadable, lacks its entry or disagrees    | re-select  | yes        |
    | --force                                                                         | re-select  | yes        |
    | every gen and recording matches, every pkg matches, every body hash matches     | skip       | no         |
    | every gen and recording matches, some pkg differs                               | re-render  | no         |
    | every gen and recording matches, some region's text differs from its body hash  | edited     | no         |

    A v2 region is current when its recording holds an entry for it whose kwargs hash matches the marker's and whose kwargs hash to that value. A missing or unreadable recording costs a re-select and never fails a run.

    A skipped record is not expanded or applied, so its files are not rewritten. A re-rendered record re-renders only its pkg-stale regions and replaces them in place; it prunes nothing, because nothing was re-selected. A v2 region is re-rendered from the kwargs of its recording entry, and a v1 region from the kwargs on its own marker. A pkg-stale region whose action no longer exists, or whose re-rendered path is not the file it sits in, cannot be re-rendered and sends its record to re-select instead. A re-render that would overwrite a region whose text was edited by hand is refused and fails the run; --force overwrites it.

    Seeded regions never decide anything and are never rewritten, but grow reports any seeded region whose record's gen has moved.

    ## --check

    Runs Phases 0-3 without writing, classifies every record, and reports per record: current, re-render, stale, edited, or unknown (no regions). It makes no model call and writes nothing. v1 regions are reported unverifiable and foreign regions are reported; neither fails the check.

    ## --force

    Re-selects every record regardless of hashes, lets an empty selection prune, and overwrites hand-edited regions.

    ## --record

    --record <dir> names the recordings directory and forces nothing. --record with a path ending in .json writes one recording of the whole run and re-selects every record.
  constraints:
    - Classification reads the markers, and the recording of each record that owns v2 regions; Sedum keeps no manifest or lockfile.
    - A record classified skip makes no model call and its files are not written, not even with identical bytes.
    - The done-check is tested by a second grow that counts zero model calls and leaves every file's bytes and modification time unchanged.
    - A record classified re-render makes no model call, rewrites only its pkg-stale regions in place, and prunes nothing.
    - An empty gen is stale, never current.
    - A record that owns only seeded regions is classified by them as having no owned regions (select), and its stale seeded regions are reported.
    - --check makes no model call.
    - --check writes nothing, Phase 3 files included.
    - --check exits non-zero exactly when some record is stale, needs re-rendering or is edited.
    - --check is rejected with --execute, --dry-run and --force.
    - --check accepts --record with a directory and reads the recordings from that directory.
    - --check without --record reads the recordings from the .sedum/recordings directory under --output.
    - --check is rejected with --record whose value ends in .json.
    - --dry-run reports each record's classification alongside what it would write.
    - Replay (--execute) never classifies or skips.
    - pipeline.Config has the string field Recordings, the directory recordings are read from, and the empty string means the .sedum/recordings directory under Output.
    - pipeline.Config has the bool field Reselect, which runGrow sets only when --record's value ends in .json.
    - runGrow sets Config.Recordings to the --record value when it is set and does not end in .json, and to the empty string otherwise.
    - classify receives, in order, the record set, the resolved files, the owners map, the output directory string, the unwritten map, the reselect bool, the skip slice of strings and the recordings directory string, and returns a slice of Classification and an error.
    - Run passes Config.Recordings as classify's last argument.
    - classify.go imports, stated once here for the file, the standard library packages errors, io/fs and path/filepath and the packages github.com/livecodelife/sedum/internal/expand, internal/inject, internal/record, internal/recording and internal/resolve, all as values.
    - A v2 owned-tier region whose gen is current is checked against its record's recording.
    - The recording is read once per record with recording.ReadRecord, which receives a directory string and a record id and returns a recording.Recording and an error.
    - A v2 region is stale with the Reason no recording when ReadRecord's error satisfies errors.Is with fs.ErrNotExist.
    - A v2 region is stale with the Reason recording unreadable when ReadRecord returns any other error.
    - A v2 region is stale with the Reason recording has no entry for this region when no entry of the recording's Regions has the recording.RegionKey of the region.
    - recording.RegionKey receives the path, action and variant strings and an id map and returns a string, and classify calls it with the region's path, the marker's action and variant and the marker's Kwargs.
    - A v2 region is stale with the Reason recording does not match the marker when its entry's KwargsHash differs from the marker's KwargsHash.
    - A v2 region is stale with the Reason recording does not match the marker when inject.KwargsHash, which receives a map[string]any and returns a string and an error, returns an error for the entry's Kwargs.
    - A v2 region is stale with the Reason recording does not match the marker when inject.KwargsHash of the entry's Kwargs differs from the entry's KwargsHash.
    - RegionRef has the string field Reason, set to the reason above for a stale v2 region and empty otherwise.
    - A v1 region takes no part in the recording check.
    - Classification has the fields Edited, Unverifiable and Foreign, each a slice of RegionRef.
    - Edited holds the current regions whose BodyState is BodyEdited.
    - Unverifiable holds the current owned-tier regions whose BodyState is BodyUnverifiable.
    - Foreign holds the regions in the record's files whose marker is Foreign.
    - A foreign region is never owned by any record and takes no part in a decision.
    - A record whose regions are all current and at least one of which is edited, and which would be skipped or re-rendered, is classified ModeEdited.
    - ModeEdited is declared after ModeRerender, and Mode.String returns edited for it.
    - Classification.Failing returns true for ModeEdited.
    - Classification.Refused returns true when the Mode is ModeEdited and the Rerender slice is not empty.
    - A record that is stale, forced or new is never ModeEdited.
    - rerenderOrSkip receives a pointer to the Classification, the record pointer, the record's resolved files, the slice of current inject.OwnedRegion and a slice of recording.Region, the Regions of the record's recording, empty when it has none, and returns a Mode.
    - A v2 region needing a re-render is re-rendered from the Kwargs of the entry with its recording.RegionKey.
    - A v2 region needing a re-render that has no such entry sends its record to re-select.
    - A v1 region needing a re-render is re-rendered from the kwargs on its own marker, with no model call and no recording needed.
    - A pkg-stale region whose action no longer exists, or whose re-rendered path is not the file it sits in, sends its record to re-select.
    - grow --check, implemented in internal/cli/grow.go by printClassifications, prints for a record in ModeEdited the word edited padded to ten characters, a space and the record id.
    - 'grow --check prints under it, for each edited region, thirteen spaces, the path, two spaces, the region''s label and the text two spaces and (hand-edited: body hash differs).'
    - The label of a region is what label, defined in internal/cli/grow.go, which receives an action and a variant string and returns a string, returns.
    - grow --check prints a stale region's line with the text two spaces, an opening parenthesis, its Reason and a closing parenthesis after the label, when the Reason is not empty.
    - grow --check prints, after the record lines, the word unverifiable padded to ten characters, a space and the record id for each record with unverifiable regions.
    - grow --check prints each unverifiable region under its record as thirteen spaces, the path, two spaces and the label.
    - grow --check prints for each foreign region the word foreign, a space, the path, two spaces, the label and the text two spaces and (marker version not known; left alone).
    - grow --check's final line is N current, N stale, N to re-render, N edited, N unknown, in that order, and a record in ModeEdited counts only as edited.
    - 'grow --check''s failure error reads check failed: some records are stale, edited, need re-rendering, or have left orphan regions; run sedum grow (with --prune-orphans for orphans).'
    - 'grow --check --json''s failure error reads check failed: some records are stale, edited, need re-rendering, or have left orphan regions.'
    - runGrow writes the recordings, with pipeline.WriteRecordings, which receives a pointer to Result and a directory string and returns an error, exactly when the run is not a dry run, a check, a stamp or a replay, and either has no --stop-after or has --record set to a directory.
    - runGrow writes the recordings after the report is printed.
    - The recordings directory runGrow writes to is the --record value when it is set and does not end in .json, and filepath.Join of the output directory, .sedum and recordings otherwise.
    - --record with a directory forces no re-select.
    - --record with a path ending in .json makes grow re-select every record, writes one recording of the whole run to that file with writeRecording, and says every record was re-selected.
    - When any Classification is Refused, runGrow returns an error after printing the report and writing the recordings.
    - The first line of that error is refusing to re-render over hand edits; --force overwrites them.
    - Each following line of that error is two spaces, the path, two spaces and the label of one refused region.
    - A refused run writes the recordings of its other records.
    - --force overwrites an edited region, because it re-selects every record.
    - 'The --record flag''s help text is: Write one recording per record into this directory, default .sedum/recordings under --output; a path ending in .json instead writes one recording of the whole run to that file and re-selects every record.'
    - The --check flag's help text says it reports a region whose text no longer matches its body hash as edited and fails on it, and that v1 regions are reported unverifiable without failing.
    - The --check and --force help text says re-render replays the kwargs of a v1 marker, or of the recording entry of a v2 region, so a changed kwarg default or --var value needs --force.
    - The --force flag's help text says it overwrites a region a re-render refused because its text was edited by hand.
    - The PRD and README describe the table above, --check's output and exit status, --force, --record, and the kwarg-default and --var limit.
