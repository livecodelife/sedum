  title: 'go: internal/inject/canon.go, BodyHash'
  type: imprint
  created_at: "2026-10-26"
  author: calebcowen@gmail.com
  intent: 'The BodyHash function returns the sha256: hash of a region''s body text with line endings normalized.'
  constraints:
    - 'The function lives in internal/inject/canon.go, package inject, and adds no imports: crypto/sha256, encoding/hex and strings come from the file''s import list'
    - The function is exported, named BodyHash, receives one positional string argument and returns one string
    - Every carriage return followed directly by a line feed is read as a line feed
    - A carriage return not followed by a line feed is left as it is
    - No other byte is changed, so indentation, trailing spaces and trailing blank lines take part in the hash
    - 'The function returns sha256: followed by the 64 lower-case hex digits of the SHA-256 of the normalized text as UTF-8 bytes'
    - The empty string hashes to sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    - The function never returns an error
  affected_scope:
    - internal/inject/canon.go
    - internal/inject/canon_test.go
