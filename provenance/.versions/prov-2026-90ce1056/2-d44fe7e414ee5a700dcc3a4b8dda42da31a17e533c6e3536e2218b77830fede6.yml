content:
  id: prov-2026-90ce1056
  title: The parameterized variable marks which built-in operations take a literal argument
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: The parameterized variable, in internal/transform/transform.go, records which built-in operations take a literal argument.
  constraints:
    - parameterized is an unexported package-level variable of type map from string to bool.
    - parameterized maps prefix to true.
    - parameterized maps suffix to true.
    - parameterized maps join to true.
    - parameterized maps trimprefix to true.
    - parameterized maps unwrap to true.
    - The exported function Parameterized, which takes an operation name as a string and returns a bool, reads this map and is not governed by this record.
  affected_scope:
    - internal/transform/transform.go
  implements: prov-2026-d9cb29e4
  implements_version: 1
  associated_specs:
    - path: internal/transform/trim_test.go
    - path: internal/transform/transform_test.go
  tags:
    - transform
