content:
  id: prov-2026-266ce4ce
  title: 'Version 0.7.0: opt-in JSON Schema structured output for sedum grow'
  type: blueprint
  created_at: "2026-09-30"
  author: calebcowen@gmail.com
  intent: |
    0.6.0 -> 0.7.0: minor, additive. --response-schema is new
    ([[prov-2026-91c54941]]): sedum grow can now compile the record's catalog
    into a JSON Schema and send it as structured output to OpenAI-compatible
    endpoints, default off. No existing invocation's behavior changes - the
    request sedum grow sends is byte-for-byte identical to today's when the
    flag is not given.
