content:
  id: prov-2026-a3771fbf
  title: A v2 marker names a region and carries hashes of its kwargs and its text
  type: blueprint
  created_at: "2026-10-26"
  author: calebcowen@gmail.com
  intent: A region's marker should carry what identifies the region and what detects drift, and a reader should be able to tell hand-edited text from generated text by the body hash on the marker.
  constraints:
    - Every region Sedum injects is written with a v2 marker
    - A v2 marker's attribute object has the key v with the number 2
    - A v2 marker carries the identity kwargs of its region as an id object
    - A v2 marker carries a hash of every resolved kwarg the region was rendered from as a string kwargs
    - A v2 marker carries a hash of its region's text between the marker lines as a string body
    - A v2 marker never carries the v1 kwargs object
    - A marker with no v key is read as a v1 marker
    - A marker whose v is not 2 is read as a foreign marker
    - An injection never matches a foreign region
    - An injection never replaces a foreign region
    - A foreign region is never pruned
    - Attribute keys Sedum does not model are carried through a rewrite
    - A v1 marker whose kwargs is not an object is a read error
    - A v2 marker whose kwargs is not a string is a read error
    - FindRegions reports, for each region, the hash of the text actually present between its marker lines
    - OwnedRegion.BodyState says whether a region's text still hashes to the body hash on its marker
  affected_scope:
    - internal/inject/marker.go
    - internal/inject/inject.go
    - internal/inject/scan.go
    - internal/inject/markerv2_apply_test.go
    - internal/inject/markerv2_regions_test.go
    - internal/inject/markerv2_scan_test.go
    - internal/inject/markerv2_test.go
  associated_specs:
    - path: internal/inject/markerv2_test.go
    - path: internal/inject/markerv2_scan_test.go
    - path: internal/inject/markerv2_apply_test.go
    - path: internal/inject/markerv2_regions_test.go
  tags:
    - marker-v2
