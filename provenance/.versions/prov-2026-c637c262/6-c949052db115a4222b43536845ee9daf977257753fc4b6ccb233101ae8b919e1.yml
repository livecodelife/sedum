content:
  id: prov-2026-c637c262
  title: Replay can restamp gen and reconcile a complete recording
  type: blueprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: |-
    Two features of `sedum grow --execute`, and what a replay writes.

    ## 1. --restamp-gen
    A recording carries the gen of the record version it was selected from. `grow --execute <recording> --records <dir> --restamp-gen` stamps each named record's current gen on its regions instead of the recorded one. It is an explicit assertion, like `--stamp`: the person says the recorded selection still satisfies the edited record. Every recorded invocation is still validated against the current packages, and every path against the current record's scope.

    ## 2. Complete recordings reconcile
    A recording written by a run that re-selected every record, without --only, has the top-level key `complete` with the value true. Replaying a complete recording prunes the owned regions of the records it names that it no longer selects, in files the recording covers, in the same all-or-nothing write. Replaying a partial recording prunes nothing and reports each such region as unselected.

    ## 3. --check with --execute
    `grow --execute <recording> --check` is a dry replay that writes nothing and exits non-zero when replaying would change anything.

    ## 4. Replay writes recordings
    A replay that is not a dry run or a check writes the per-record recordings of the records it replayed into the recordings directory, with the regions the replay wrote.
  constraints:
    - --restamp-gen needs --records and is an error without it.
    - --restamp-gen stamps each named record's current gen on its regions in place of the recorded gen.
    - A record the recording names that is missing or deprecated is not restamped; it is reported and its regions are written with the recorded gen.
    - 'Replay prints one line for each restamped record: restamped <id>: gen <old8> -> <new8>.'
    - A recording written by a run that re-selected every record without --only has the top-level key complete with the value true, and other recordings omit it.
    - Replaying a complete recording prunes the owned regions of the records it names that it no longer selects, in files the recording covers.
    - Replaying a partial recording prunes nothing and reports each region it no longer selects as unselected.
    - The sedum.grow/1 report names a region a partial recording no longer selects as change unselected.
    - grow --execute <recording> --check writes nothing and exits non-zero when replaying would change anything.
    - After a replay that is not a dry run or a check, runReplay in internal/cli/grow.go writes the recordings of the replayed records with pipeline.WriteReplayRecordings, which receives the replayed recording.Recording, a pointer to Result and a directory string and returns an error.
    - runReplay passes the .sedum/recordings directory under the output directory to WriteReplayRecordings.
    - A record restamped by --restamp-gen has the restamped gen in its recording.
  affected_scope:
    - internal/recording/recording.go
    - internal/pipeline/replay.go
    - internal/pipeline/restamp.go
    - internal/pipeline/restamp_test.go
    - internal/cli/grow.go
