content:
  id: prov-2026-9a612f7d
  title: 'go: internal/pipeline/migrate.go, MigrateReport'
  type: imprint
  created_at: "2026-10-26"
  author: calebcowen@gmail.com
  intent: The MigrateReport type holds what a marker migration did.
  constraints:
    - The type lives in internal/pipeline/migrate.go, package pipeline, and adds no imports
    - Migrated holds the regions whose marker was rewritten, Refused the regions whose kwargs cannot be hashed or whose action is not a key of their package's Actions map, and Left the v1 regions left as they are
    - 'MigrateReport is an exported struct with exactly six fields: Migrated, Refused and Left, each a slice of MigrateNote, Files and Recordings, each a slice of string, and Skipped, an int'
    - Files holds the paths rewritten, relative to the output directory and slash-separated, and Recordings holds the record ids whose recordings were written
    - Skipped holds the number of scope paths left out of the migration because no generator package claims them, and is 0 when none were left out
  affected_scope:
    - internal/pipeline/migrate.go
    - internal/pipeline/migrate_test.go
    - internal/pipeline/migrate_unclaimed_test.go
  implements: prov-2026-0a398351
