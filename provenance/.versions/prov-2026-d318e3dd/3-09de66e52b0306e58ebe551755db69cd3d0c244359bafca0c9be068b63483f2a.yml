reason: |-
  addFixtureAttribute's kwargs gain descriptions in the described package set.
  The defined set is untouched.

  ## A gap introduced by the record that added the action

  [[prov-2026-2fb763a0]] added addFixtureAttribute to both package sets
  identically, with the reasoning written as YAML comments. Comments do not
  reach the catalog. Every other action in the described set describes every
  kwarg; this one described none, so the set stopped being what it claims to be.

  [[prov-2026-ac15ed2b]] built that set as the defined set with descriptions
  added and nothing else changed, and TestTheDescribedSetDiffersOnlyByDescriptions
  exists to keep the two from drifting. That test compares the loaded packages
  and passes here, because an absent description is not a difference it can see
  - the arms genuinely do differ only by descriptions, and now differ by one
  fewer than they should.

  So the A/B was quietly measuring a described package with an undescribed
  action in it. That is not a wrong number yet - no run has drawn against it -
  but it is the kind of gap that produces one.

  ## What the descriptions say

  The style the set already uses: state the form, name the wrong form, and
  explain the mechanism where the mechanism is what bites. `value` gets the most
  care, because it is the kwarg most like the one this session watched fail -
  a literal the model supplies and the template emits verbatim.
