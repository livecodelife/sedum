content:
  id: prov-2026-bf01cd6b
  title: sedum regions and a JSON grow report feed provenance evidence
  type: blueprint
  created_at: "2026-10-15"
  author: calebcowen@gmail.com
  intent: |-
    Sedum reads markers and reports them as JSON a non-Go caller can consume, so the provenance library never has to parse a marker. The surface is formats and commands, never linking.

    ## sedum regions

    `sedum regions --generators <dir> [--output <dir>] [--records <dir>] [--record <id>]... [--json]` is read-only: no model, no records required, nothing written. It walks the output tree as the orphan scan does - skipping hidden, generators and records directories, vendored directories and the project's excludes - and lists every region whose marker names a record. With --json it prints one object with the format `sedum.regions/1` and, for each region sorted by file and then position: record, file, action, variant, tier, identity, gen and pkg. gen and pkg are "" when the marker lacks them. With --records, a marker naming an alias is reported under the surviving id. The identity of a v1 region is the action's selecting kwargs read from its kwargs; the identity of a v2 region is the id object on its marker, read without its recording.

    ## A JSON grow report

    `sedum grow --json` prints the run's report as one object with the format `sedum.grow/1`: dry_run, records, orphans, stamped and check_failed. Each record has its mode, which is one of skip, select, re-select, re-render, edited or none, a changed flag, and its regions, each with file, action, variant and a change, which is one of inserted, replaced, pruned, unchanged, held, unselected, seeded or edited. `changed` is true exactly when one of the record's regions was inserted, pruned, or rewritten with different bytes. --json composes with --check, --dry-run and --stamp, reporting what each would do.
  constraints:
    - sedum regions writes nothing, calls no model, and needs no records directory; it reads only files under --output.
    - Both JSON documents carry a format string with a version, and add fields only additively; the shapes are documented in the PRD and README.
    - gen and pkg are reported verbatim from markers, "" when absent; Sedum never computes or fills them in this command.
    - A region counts as changed only when its bytes changed; identical rewrites are unchanged.
    - Without --json the output is text.
    - conformance/formats/ documents both formats with an example of each, and Sedum's tests check real output against the documented keys, so a TypeScript consumer can rely on them.
    - sedum regions does not report a marker inside a vendored or excluded directory.
    - sedum regions reports as a v2 region's identity the id object on its marker.
    - sedum regions reads a v2 region's identity without the recording.
    - conformance/formats documents the mode edited in its grow example.
    - conformance/formats documents the change edited in its grow example.
    - The identity of a v1 region is the action's selecting kwargs read from its marker, or every kwarg of the marker when the package no longer declares the action
    - sedum regions --record selects a record's regions by id or alias
    - grow --json reports an edited record with the mode edited and lists its edited regions with the change edited.
