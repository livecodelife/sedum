content:
  id: prov-2026-ceafd24a
  title: 'go: internal/cli/grow.go, checkCombinations'
  type: imprint
  created_at: "2026-10-26"
  author: calebcowen@gmail.com
  intent: The checkCombinations function rejects flag combinations grow cannot honour.
  constraints:
    - The function lives in internal/cli/grow.go, package cli, and adds no imports
    - --check is rejected with --dry-run, --force and --stop-after, and with --record whose value ends in .json
    - The rejection's error text is --check cannot be combined with followed by the flag, a colon, a space and the text --check only reports, from markers, with no model call and nothing written
    - --check with --record and a directory reads the recordings from that directory
    - checkCombinations receives a GrowConfig and returns an error, nil when the combination is allowed
  affected_scope:
    - internal/cli/grow.go
    - internal/cli/record_v2_test.go
  implements: prov-2026-9621daed
  implements_version: 11
  associated_specs:
