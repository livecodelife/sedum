  author: calebcowen@gmail.com
  intent: The Region struct is one marked block found in a file.
  constraints:
    - The type lives in internal/inject/marker.go, package inject, and adds no imports
    - Region is an exported struct with the fields Marker of type Marker, Start and End of type int, and BodyHash of type string
    - Start is the byte offset of the first byte of the opening marker line
    - End is the byte offset one past the newline that ends the closing marker line
    - BodyHash is the body hash of the text actually present between the marker lines
