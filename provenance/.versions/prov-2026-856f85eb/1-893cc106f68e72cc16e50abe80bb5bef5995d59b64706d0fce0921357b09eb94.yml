content:
  id: prov-2026-856f85eb
  title: 'adopt: the declarative adopter and adopter selection'
  type: imprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: |-
    Implements prov-2026-95d9ae7e: the declarative adopter and the choice between adopter forms. New files internal/adopt/declarative.go and internal/adopt/forpackage.go (package adopt; Span, Kind, Adopter, CommandAdopter exist in span.go and command.go; genpkg.Adopt, genpkg.Package and genpkg.Action are in internal/genpkg: `Adopt{Command []string; UnitStart, UnitEnd, Header string; AttachAbove []string; Actions map[string]string}`, `Package.Adopt *Adopt`, `Package.Actions map[string]*Action`, `Action.Kwargs map[string]Kwarg`).

    declarative.go:
    - `type Declarative struct` (unexported fields) implementing Adopter, built by `func NewDeclarative(pkg *genpkg.Package) (*Declarative, error)`. It errors when pkg.Adopt is nil or uses `command`, and when a regexp does not compile (the same checks genpkg already makes, repeated because this package must not trust its caller). It compiles `UnitStart`, `Header` (if set), `AttachAbove` (each) and `UnitEnd` (when not `dedent` or `blank`).
    - `Split(path string, src []byte) ([]Span, error)` works on lines (split keeping each line's newline; the last line may have none):
      1. Header: when Header is set and its regexp matches at byte offset 0 of src, the matched text is a KindHeader span; otherwise there is no header span.
      2. Units: a unit starts at a line, after the header, that the UnitStart regexp matches (the regexp is applied to the line without its newline; the named groups `kind` and `name` give the action key and the unit's name). The unit's action is `Adopt.Actions[kind]`; a kind with no entry makes the line start no unit (it stays residual).
      3. A unit also takes the lines directly above its start line (no blank line in between) that match any AttachAbove regexp, as many consecutive ones as match.
      4. A unit's end: `dedent`: the unit continues over following lines that are blank or begin with a space or tab, and ends before the first non-blank line that begins at column 0; trailing blank lines are not part of the unit. `blank`: the unit ends before the first blank line (a line that is empty or whitespace only). Any other value is a regexp: the unit ends after (and includes) the first line, starting at the start line itself, that matches it; with no match the unit runs to the end of the file.
      5. A unit span has Kind KindUnit, Text = its lines exactly as in the file, Action from the map, and Kwargs containing only the kwargs the action declares among `file` (the path argument), `name` (the named group) and `code` (the unit's Text without its final newline).
      6. Everything else, between spans and after the last, is KindResidual, with consecutive leftover lines merged into one span. The spans, in order, always concatenate to src exactly. Empty input returns an empty (non-nil) slice with no error.
    forpackage.go:
    - `func ForPackage(pkg *genpkg.Package, allowCommand bool) (Adopter, error)`: nil Adopt is an error `package <name> declares no adopter`; a `command` adopter returns a CommandAdopter{Argv: pkg.Adopt.Command} when allowCommand, otherwise the error `package <name> declares a command adopter (<command line>); rerun with --allow-command-adopters to run it`; a declarative one returns NewDeclarative(pkg).
    Tests (declarative_test.go, forpackage_test.go): build genpkg.Package values directly (struct literals with Adopt and Actions); a Python-style module with a docstring header, `import` residual lines, decorated functions, a class with an indented body and trailing blank lines must produce the expected spans and pass CheckSpans; each unit_end mode (dedent, blank, regexp with and without a match); attach_above with a blank line breaking the attachment; an unknown kind stays residual; kwargs contain only the declared ones; empty input; ForPackage's three outcomes and its error texts.
  affected_scope:
    - internal/adopt/declarative.go
    - internal/adopt/forpackage.go
    - internal/adopt/forpackage_test.go
    - internal/adopt/declarative_test.go
  implements: prov-2026-95d9ae7e
