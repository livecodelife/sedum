  id: prov-2026-8bdc6f13
  title: 'go: internal/pipeline/pipeline.go, priorFromMarkers'
  type: imprint
  created_at: "2026-10-26"
  author: calebcowen@gmail.com
  intent: The priorFromMarkers function rebuilds a record's earlier selections from the markers of the regions it owns.
  constraints:
    - The function lives in internal/pipeline/pipeline.go, package pipeline, and adds no imports
    - The function is unexported and receives positionally a record id string, a slice of inject.OwnedRegion and the owners map[string]inject.Owner, and returns a slice of recording.Invocation
    - It includes only exposed actions.
    - It includes only the kwargs the action declares.
    - priorFromMarkers over a v2 region with no recording yields only the identity kwargs of that region that its action declares.
  affected_scope:
    - internal/pipeline/pipeline.go
    - internal/pipeline/selectall_v2_test.go
