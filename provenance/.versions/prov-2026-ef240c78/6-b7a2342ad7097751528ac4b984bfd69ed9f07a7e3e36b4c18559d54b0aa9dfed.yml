content:
  id: prov-2026-ef240c78
  title: 'cli: grow-log registered and called from grow (hand-written)'
  type: imprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: The grow log is wired into sedum grow and the root command.
  constraints:
    - internal/cli/root.go registers the command newGrowLogCommand returns with the other subcommands in NewRootCommand
    - runGrow reads the clock just before it calls pipeline.Run
    - runGrow calls writeGrowLog with the error writer, the config, the result, the error and the start time right after pipeline.Run and before the error check
    - The log's location and switches are the environment variables SEDUM_GROW_LOG and SEDUM_GROW_LOG_SKIPS, not flags
    - The test TestGrowLogCommandRegistered in internal/cli/growlog_wiring_test.go finds a grow-log command on the root command
  affected_scope:
    - internal/cli/growlog_wiring_test.go
    - internal/cli/grow.go
    - internal/cli/root.go
  implements: prov-2026-7a13f569
  implements_version: 2
  associated_specs:
    - path: internal/cli/growlog_wiring_test.go
