content:
  id: prov-2026-ef240c78
  title: 'cli: grow-log registered and called from grow (hand-written)'
  type: imprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: The wiring of the grow log into sedum grow and the root command. internal/cli/root.go registers the command newGrowLogCommand returns with the other subcommands in NewRootCommand. internal/cli/grow.go runGrow reads the clock just before it calls pipeline.Run and, right after that call and before the error check, calls writeGrowLog with the error writer, the config, the result, the error and the start time. The log's location and switches are the environment variables SEDUM_GROW_LOG and SEDUM_GROW_LOG_SKIPS, not flags, so the grow flag surface is unaffected. The test TestGrowLogCommandRegistered in internal/cli/growlog_wiring_test.go finds a grow-log command on the root command.
  affected_scope:
    - internal/cli/growlog_wiring_test.go
    - internal/cli/grow.go
    - internal/cli/root.go
  implements: prov-2026-7a13f569
