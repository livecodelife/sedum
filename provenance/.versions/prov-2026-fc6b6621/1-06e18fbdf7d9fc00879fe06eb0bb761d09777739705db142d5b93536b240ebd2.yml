content:
  id: prov-2026-fc6b6621
  title: The binary carries the go generator package
  type: imprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: |
    Implements prov-2026-1da47b75, behaviour 1's built-in package. The binary carries the go package as internal/builtin/packages/go.zip (generated by hack/sync-builtin.sh from generators/go; go:embed cannot take the tree itself because the generators directory is a separate module and its "*" directories are not embeddable names). New file internal/builtin/builtin.go (package builtin) declares `//go:embed packages/*.zip` into an embed.FS and exports: `Names() []string` (the sorted package names, each a zip's base name without .zip); `Files(name string) (map[string][]byte, error)` returning every file of that package keyed by its slash-separated path relative to the package root, and for an unknown name an error `no built-in package "x"; built-in packages: go` (names comma-joined); `Paths(files map[string][]byte) []string` returning the keys sorted. Archive entries whose path is absolute, contains "..", or ends in "/" (directories) are an error, never returned. Tests in internal/builtin/builtin_test.go (package builtin): Names is exactly ["go"]; Files("go") holds "sedum.yaml" and "actions/actions.yaml" and no key starts with "/" or contains ".."; an unknown name errors and names "go"; Paths is sorted; and a drift test that walks ../../generators/go (skipping the test, with t.Skip, when that directory does not exist) and requires the same set of paths with identical bytes as Files("go"), failing with a message that says to run hack/sync-builtin.sh. Grown via sedum-haiku (setVar for the embed, setFunction, tests).
  affected_scope:
    - internal/builtin/builtin.go
    - internal/builtin/builtin_test.go
  implements: prov-2026-1da47b75
  implements_version: 2
  associated_specs:
    - path: internal/builtin/builtin_test.go
