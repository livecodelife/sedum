content:
  id: prov-2026-72775ae5
  title: The ownership marker is a public format
  type: blueprint
  created_at: "2026-08-14"
  author: calebcowen@gmail.com
  intent: The ownership marker is a format other tools read and write. An attribute key Sedum does not model survives every rewrite of its region, so a tool built above Sedum can keep its own state on a region without a schema change. A writer key names the tool that last wrote a region, so a tier demotion is attributable. The marker's tier governs a region after its first write, and an action's declaration supplies the value at first write only.
  constraints:
    - 'Unrecognised attribute keys are preserved in both directions: retained on read and re-emitted on write, including through the replacement path that rewrites an existing region.'
    - A key Sedum does not model survives every rerun untouched.
    - 'Preservation is transparent: Sedum does not read, act on, validate or reorder an unrecognised key, and carries it.'
    - 'A key Sedum does model is never taken from the carried extras: tier, record, kwargs and writer come from the invocation on write and from the declared fields on read, and extras cannot shadow them.'
    - The writer key is one free-form string naming the tool that last wrote the region.
    - An absent writer key means sedum.
    - A marker is never rejected for carrying more than the reading version expects.
    - A marker is never rejected for carrying less than the reading version expects.
    - An unreadable attribute object is an error, because that is corruption rather than version skew.
    - Neither the writer key nor any carried extra takes part in IdentityOf.
    - applyOne carries the Extra keys of the region it replaces onto the marker it writes.
    - The marker's tier governs a region after its first write.
  affected_scope:
    - internal/inject/marker.go
    - internal/inject/inject.go
    - internal/inject/*_test.go
  implements: prov-2026-d554bfc3
