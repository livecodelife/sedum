content:
  id: prov-2026-66bea9f3
  title: Markers carry gen and pkg hashes as first-class attributes
  type: blueprint
  created_at: "2026-10-15"
  author: calebcowen@gmail.com
  intent: |-
    Every region Sedum writes records the two inputs that decide whether it is current, so grow can skip, re-render or re-select each record from markers and recordings with no manifest or lockfile:

      # sedum:createControllerMethod:index {"v":2,"tier":"owned","record":"prov-…","gen":"sha256:…","pkg":"sha256:…","id":{…},"kwargs":"sha256:…","body":"sha256:…"}

    - gen: the gen_hash of the record that wrote the region, at write time. SHA-256 over DESIGN.md's canonical encoding of exactly the fields Sedum reads: intent, constraints, affected_scope, forbidden_scope.
    - pkg: a hash of the action definition and its templates at render time. A pkg mismatch alone means re-render with no model call, from the kwargs in the region's recording entry for a v2 marker and from the marker's own kwargs for a v1 marker.

    ## gen_hash sits behind a small seam

    The canonical gen_hash belongs to the shared record library prov-lib is building in ~/workspace/provenance. Sedum has a tiny internal package (internal/genhash) whose one function takes the four fields as plain values and returns "sha256:<hex>". Its interim body implements DESIGN.md's encoding directly; when the library lands, the body delegates to it through a go.mod replace directive and the interim code is deleted.

    ## pkg is Sedum's own hash

    pkg covers everything that changes what a template renders for fixed kwargs: the resolved action declaration (kwargs schema with defaults, discriminator, variants, injects_into, anchors, identity), the content of each of its templates, and the package's transforms and op_exceptions. The package-wide part is deliberately conservative: an unrelated transform edit costs a re-render, never a model call, while missing a real input would leave a stale region looking current. It is computed once at package load and carried on the Action.
  constraints:
    - gen and pkg are declared attributes, not Extra keys.
    - Both gen and pkg are omitted from a marker when empty.
    - An absent gen or pkg means unknown and must read as stale to later consumers, never as current.
    - Replay without records, where there is no record to hash, writes no gen.
    - A marker carrying gen or pkg as an unknown key, written by a foreign tool, has it promoted to the declared field on parse and never also re-emitted from Extra.
    - 'Both values use the form sha256: followed by 64 lowercase hex digits.'
    - 'The interim gen_hash follows DESIGN.md exactly: sorted keys, UTF-8 NFC, trimmed and collapsed whitespace, list order kept.'
    - The gen_hash switches to prov-lib's implementation without changing its callers.
    - A composite's regions carry the pkg hash of the child action named on the marker, since that is what re-rendering replays.
    - pkg is deterministic across loads, machines and map iteration order.
    - The encoding of pkg is documented in conformance/ so a harness can compute it without linking Sedum.
  affected_scope:
    - internal/inject/marker.go
    - internal/inject/inject.go
    - internal/inject/*_test.go
    - internal/genhash/*.go
    - internal/genpkg/schema.go
