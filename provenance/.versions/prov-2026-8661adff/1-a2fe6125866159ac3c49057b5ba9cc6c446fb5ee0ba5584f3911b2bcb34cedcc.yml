content:
  id: prov-2026-8661adff
  title: 'Version 0.10.1: sedum check recognises the REVISE001 refusal of provenance 3.0.0'
  type: blueprint
  created_at: "2026-10-29"
  author: calebcowen@gmail.com
  intent: '0.10.0 -> 0.10.1: patch. `sedum check` recognises the implemented-record refusal under rule id REVISE001, which provenance 3.0.0 uses, as well as STATE001, so regenerations and marker migrations on implemented records are waived again. It also skips, and reports, a pre-existing file its file template cannot reconcile and treats the class of the record that owns it as unknown, so marker migrations of repositories with hand-written files in a record''s scope are waived. See CHANGELOG.md.'
