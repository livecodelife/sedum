content:
  id: prov-2026-fc05416c
  title: Grow's marker scans skip the generators, records, vendored and excluded directories
  type: imprint
  created_at: "2026-10-15"
  author: calebcowen@gmail.com
  intent: |-
    Grow's marker scans are for application code only. The orphan scan behind grow and the walk behind `sedum regions` never read generator packages (the --generators directory) or the records directory, wherever they sit under the output tree. They also never enter vendored or build-output directories: node_modules, .next, vendor, dist and target, at any depth below the output directory. The output directory itself is never skipped.

    A project can skip more directories with an `exclude:` list of strings in <output>/.sedum/config.yml and with a SEDUM_EXCLUDE environment variable holding a comma-separated list of entries. An entry without a slash names a directory of that name at any depth. An entry with a slash is a slash-separated path under the output directory and names exactly that directory. Entries are directories, never globs. Invalid entries and a malformed config are rejected before anything is read or written. No --exclude flag exists, because the flag sets of grow and regions are exact contract tests.

    The per-record scans behind classification and --check are unchanged: a file a record names is read wherever it sits.
  constraints:
    - Skipping compares cleaned absolute paths, so ./generators and an absolute path name the same directory.
    - Nothing is skipped when the directory is outside the output tree.
    - The directories named node_modules, .next, vendor, dist and target are never entered by the orphan scan or by sedum regions, at any depth below the output directory.
    - The output directory itself is never skipped, whatever its name or location, so an output directory that is or sits inside a directory with a built-in skipped name is still read.
    - The config file <output>/.sedum/config.yml may hold a key exclude whose value is a list of strings.
    - An absent config file or an absent exclude key adds no excluded directories.
    - An exclude entry without a slash skips every directory of that name at any depth below the output directory.
    - An exclude entry with a slash is a slash-separated path relative to the output directory and skips exactly that directory.
    - A trailing slash on an exclude entry is ignored.
    - Whitespace around an exclude entry is ignored.
    - 'Exclude entries are not globs: a wildcard character in an entry has no special meaning, so the entry "gen*" does not skip a directory named "generated".'
    - The SEDUM_EXCLUDE environment variable is a comma-separated list of exclude entries, read for both sedum grow and sedum regions.
    - The entries of SEDUM_EXCLUDE add to the entries of the config file exclude list and do not replace them.
    - An unset or empty SEDUM_EXCLUDE adds no excluded directories.
    - Blank items in SEDUM_EXCLUDE, such as an empty string between two commas, are ignored without error.
    - An absolute path as an exclude entry, in the config or in SEDUM_EXCLUDE, is an error that names the entry.
    - An exclude entry containing a .. path element, in the config or in SEDUM_EXCLUDE, is an error that names the entry.
    - An empty string as an entry in the config exclude list is an error.
    - Exclude entries are validated at the very start of sedum grow and sedum regions, before any generator package, record or marker is read.
    - Exclude entries are validated before any file is written, so a sedum grow rejected for an invalid entry leaves the output tree unchanged.
    - A config file that is not valid YAML, or whose exclude value is not a list of strings, fails the command with an error that names .sedum/config.yml.
    - A marked file inside a skipped directory is not reported by the orphan scan or by sedum regions.
    - The per-record scans behind classification and --check read a file a record names wherever it sits, including inside a vendored or excluded directory.
    - sedum grow --check honours the exclude entries from the config and from SEDUM_EXCLUDE.
    - No --exclude flag is added to sedum grow or sedum regions; their flag sets are unchanged.
  affected_scope:
    - internal/pipeline/orphans.go
    - internal/pipeline/classify.go
    - internal/pipeline/pipeline.go
    - internal/pipeline/*_test.go
    - internal/cli/*_test.go
  implements: prov-2026-5403d162
  implements_version: 1
  associated_specs:
    - path: internal/pipeline/orphans_test.go
    - path: internal/pipeline/vendored_test.go
    - path: internal/cli/exclude_env_test.go
