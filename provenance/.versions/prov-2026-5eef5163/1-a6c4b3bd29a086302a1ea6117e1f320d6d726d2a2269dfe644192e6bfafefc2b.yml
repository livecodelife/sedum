content:
  id: prov-2026-5eef5163
  title: 'go: internal/cli/grow.go, runReplay'
  type: imprint
  created_at: "2026-10-26"
  author: calebcowen@gmail.com
  intent: The runReplay function executes a recording and writes the recordings of the records it replayed.
  constraints:
    - The function lives in internal/cli/grow.go, package cli, and adds no imports
    - 'Replay prints one line for each restamped record, exactly "restamped <id>: gen <old8> -> <new8>", whose last character is the last character of the new gen''s first eight characters'
    - runReplay calls pipeline.WriteReplayRecordings, which receives the replayed recording.Recording, a pointer to Result and the recordings directory string and returns an error, after printing the replay report, when the replay is not a dry run, not a check and not stopped at a phase boundary
    - runReplay receives the output writer and the error writer as io.Writer, a GrowConfig, the stopAfter int, the stop-point name string and a pointer to runlog.Log, and returns an error
    - A replay stopped at a phase boundary writes no recording
  affected_scope:
    - internal/cli/grow.go
    - internal/cli/record_v2_test.go
  implements: prov-2026-c637c262
  implements_version: 9
