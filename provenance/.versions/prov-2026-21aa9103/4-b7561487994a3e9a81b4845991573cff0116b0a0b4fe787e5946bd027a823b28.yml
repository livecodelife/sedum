content:
  id: prov-2026-21aa9103
  title: 'growlog: the entry type and Append'
  type: imprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: |-
    The grow log entry and its Append (prov-2026-7a13f569): one JSON line per record per grow, appended with a single O_APPEND write. This file defines NO Read: reading is another imprint.

    New file internal/growlog/entry.go (package growlog); standard library only. TRANSCRIBE, do not design: write exactly the code below. Imports (encoding/json, fmt, os, path/filepath, strings, unicode/utf8): one addImport each. Declarations: one invocation per declaration (type -> setType, const -> setConst, func -> setFunction, method -> setMethod with the receiver type name), code = the whole declaration including its doc comment, exactly as written, tabs for indentation, no changes of any kind.

    // Version is the schema version written in every line of the grow log.
    const Version = 1

    // maxError bounds the error text kept in one line.
    const maxError = 300

    // Regions counts what one grow did to a record's regions.
    type Regions struct {
    	Injected  int `json:"injected"`
    	Replaced  int `json:"replaced"`
    	Pruned    int `json:"pruned"`
    	Unchanged int `json:"unchanged"`
    }

    // Entry is one line of the grow log: what one grow did for one record. It
    // holds counts and timings only, never prompt or response text, kwargs, file
    // contents or keys.
    type Entry struct {
    	V                int     `json:"v"`
    	TS               string  `json:"ts"`
    	Sedum            string  `json:"sedum"`
    	Record           string  `json:"record"`
    	Mode             string  `json:"mode"`
    	Model            string  `json:"model"`
    	Calls            int     `json:"calls"`
    	Rejected         int     `json:"rejected"`
    	Completeness     int     `json:"completeness"`
    	Repairs          int     `json:"repairs"`
    	PromptTokens     int     `json:"prompt_tokens"`
    	CompletionTokens int     `json:"completion_tokens"`
    	Invocations      int     `json:"invocations"`
    	Literal          int     `json:"literal"`
    	Declarative      int     `json:"declarative"`
    	Regions          Regions `json:"regions"`
    	Files            int     `json:"files"`
    	MS               int64   `json:"ms"`
    	Outcome          string  `json:"outcome"`
    	Error            string  `json:"error,omitempty"`
    }

    // clipError keeps the first line of s, trimmed, at most maxError bytes and
    // never cutting a UTF-8 sequence.
    func clipError(s string) string {
    	s, _, _ = strings.Cut(s, "\n")
    	s = strings.TrimSpace(s)
    	if len(s) <= maxError {
    		return s
    	}
    	s = s[:maxError]
    	for !utf8.ValidString(s) {
    		s = s[:len(s)-1]
    	}
    	return s
    }

    // Append adds e as one line to the log at path, creating the file and its
    // directory. V is set to Version when zero and Error is clipped. The line is
    // written with a single write to an O_APPEND file, so concurrent writers never
    // interleave their lines.
    func Append(path string, e Entry) error {
    	if e.V == 0 {
    		e.V = Version
    	}
    	e.Error = clipError(e.Error)
    	line, err := json.Marshal(e)
    	if err != nil {
    		return fmt.Errorf("encode grow log entry: %w", err)
    	}
    	if err := os.MkdirAll(filepath.Dir(path), 0o755); err != nil {
    		return fmt.Errorf("create grow log directory for %s: %w", path, err)
    	}
    	f, err := os.OpenFile(path, os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o644)
    	if err != nil {
    		return fmt.Errorf("open grow log %s: %w", path, err)
    	}
    	if _, err := f.Write(append(line, '\n')); err != nil {
    		f.Close()
    		return fmt.Errorf("write grow log %s: %w", path, err)
    	}
    	return f.Close()
    }

    Tests: the NEW file internal/growlog/entry_test.go (the imprint's spec; it exists as a one-line placeholder). Transcribe exactly this test file; imports (encoding/json, os, path/filepath, strings, testing, unicode/utf8): one addImport each; each function -> setFunction with its name. Use the fixture text exactly (tabs, ASCII quotes).

    func TestAppendWritesOneLinePerEntry(t *testing.T) {
    	path := filepath.Join(t.TempDir(), "sub", "grow.jsonl")
    	for _, id := range []string{"rec-1", "rec-2"} {
    		if err := Append(path, Entry{Record: id, Model: "m", Outcome: "ok"}); err != nil {
    			t.Fatal(err)
    		}
    	}
    	data, err := os.ReadFile(path)
    	if err != nil {
    		t.Fatal(err)
    	}
    	lines := strings.Split(strings.TrimSuffix(string(data), "\n"), "\n")
    	if len(lines) != 2 {
    		t.Fatalf("got %d lines, want 2: %q", len(lines), data)
    	}
    	var e Entry
    	if err := json.Unmarshal([]byte(lines[0]), &e); err != nil {
    		t.Fatal(err)
    	}
    	if e.V != Version || e.Record != "rec-1" {
    		t.Fatalf("first entry = %+v", e)
    	}
    	if strings.Contains(lines[0], `"error"`) {
    		t.Fatalf("an empty error must be omitted: %s", lines[0])
    	}
    }

    func TestAppendClipsError(t *testing.T) {
    	cases := []struct {
    		name, in string
    		check    func(string) bool
    	}{
    		{"first line only", "first\nsecond", func(s string) bool { return s == "first" }},
    		{"bounded", strings.Repeat("x", 400), func(s string) bool { return len(s) == 300 }},
    		{"whole runes", strings.Repeat("é", 200), func(s string) bool { return len(s) <= 300 && utf8.ValidString(s) }},
    	}
    	for _, tc := range cases {
    		t.Run(tc.name, func(t *testing.T) {
    			path := filepath.Join(t.TempDir(), "grow.jsonl")
    			if err := Append(path, Entry{Outcome: "failed", Error: tc.in}); err != nil {
    				t.Fatal(err)
    			}
    			data, err := os.ReadFile(path)
    			if err != nil {
    				t.Fatal(err)
    			}
    			var e Entry
    			if err := json.Unmarshal(data, &e); err != nil {
    				t.Fatal(err)
    			}
    			if !tc.check(e.Error) {
    				t.Fatalf("clipped error = %q", e.Error)
    			}
    		})
    	}
    }
