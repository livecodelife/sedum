content:
  id: prov-2026-176ff80b
  title: The Operations variable lists the closed set of built-in operation names
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: The Operations variable, in internal/transform/transform.go, is the single declaration of the built-in operation names every package can reference.
  constraints:
    - Operations is an exported package-level variable of type slice of string.
    - Operations holds, in this order, the names pascal, camel, snake, kebab, upper, lower, plural, singular, prefix, suffix, join, quote, trimprefix and unwrap.
    - Operations holds each name once and holds no pipeline names.
    - Package loading and reference checking read Operations as the only declaration of the built-in vocabulary.
    - The declaration adds no imports.
  affected_scope:
    - internal/transform/transform.go
  implements: prov-2026-d9cb29e4
  implements_version: 1
  associated_specs:
    - path: internal/transform/trim_test.go
    - path: internal/transform/transform_test.go
  tags:
    - transform
