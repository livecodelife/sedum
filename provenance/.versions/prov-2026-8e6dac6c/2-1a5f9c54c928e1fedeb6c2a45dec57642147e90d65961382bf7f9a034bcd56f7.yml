parent_hash: sha256:cb50d3ee4bfe024a2f483e797ce69993c66328056165d0bd4b0cff4e690f6760
reason: |-
  M1 walks files/ collecting two parallel slices - the template patterns and
  their contents - then sorts the patterns alone, so that findings do not depend
  on directory iteration order. The contents keep their walk order. Everything
  downstream pairs them by index.

  The two orders are not the same. WalkDir is depth-first over lexically sorted
  directory entries; the sort is a flat comparison of slash-joined relative
  paths. They agree for the fixture packages, which is why this has been
  invisible, and they disagree as soon as a file and a directory share a prefix,
  because '.' sorts before '/' but WalkDir descends into the directory first:

    files/app.rb      sorts first, is walked second
    files/app/x.rb    sorts second, is walked first

  Demonstrated: with an undefined transform in files/app.rb and plain text in
  files/app/x.rb, load reports the undefined pipeline against files/app/x.rb -
  a file that does not contain it, while the file that does is reported clean.

  Today this misattributes two load-time checks: the template syntax and
  transform reference checks in checkTemplates. It is a diagnostic-quality bug
  rather than a correctness one, and M1's own standard is that a validator
  reporting the wrong file is not the deliverable.

  It is being fixed now because M3 makes it worse. Phase 3 renders the file
  template a path matched, so it needs to look up contents by pattern; building
  that lookup on the existing index pairing would turn a wrong filename in a
  diagnostic into wrong boilerplate in a generated file - the .rb template
  rendered into a path that matched a different one.

  The fix removes the pairing rather than aligning the two orders. Contents are
  keyed by pattern in a map, which is what both the existing checks and Phase 3
  actually want, and there is no second ordering left to keep in agreement.
reason_kind: fix
