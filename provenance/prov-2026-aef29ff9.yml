id: prov-2026-aef29ff9
title: The understated-requirement warning is the load-time twin of checkDerived
status: draft
created_at: "2026-08-17"
author: calebcowen@gmail.com
implements: prov-2026-f03916ba
intent: |
  The blueprint named one check that had to learn about defaults: Phase 5's
  checkDerived, which rejects an unbound kwarg the selected template will
  render. There are two. The other is at load, and it is the one that actually
  fired.

  Pointing `sedum validate` at the eval package with the kwarg made optional
  produced:

    [kwarg_requirement_understated] action addColumn declares kwarg default
    optional, but its only template renders it unconditionally; Sedum requires
    it either way, and declaring it required is what the catalog shows the model

  The package did not load at all, so nothing downstream - including the
  checkDerived change the blueprint did anticipate - was ever reached.

  ## Why both exist, and why both were right before this

  They are the same argument at two distances. A simple action has one template,
  so a value that template renders unconditionally is needed by every invocation
  of the action; declaring it optional understates the schema, and the catalog
  then shows the model an option that is not really one. The load check says
  that to the author. checkDerived says the same thing to the model, per
  invocation, because a discriminated action cannot say it in the schema at all
  (prov-2026-369544c1).

  Neither was wrong. Both were complete descriptions of a world where the only
  way a kwarg gets a value is the model binding one.

  ## What changes

  A declared default is a third source of a value, and it is exactly the thing
  both checks were protecting against the absence of. "Optional and rendered
  unconditionally" is no longer an understatement when the package itself
  supplies the value - it is the whole point, and the catalog now shows the
  model something true: this may be omitted, and here is what omitting it
  means.

  So the load check gains the same exemption Phase 5's did. It is stated as an
  exemption on the existing rule rather than as a new rule, because the finding
  it reports is unchanged for every package that declares no default.

  ## The general lesson, which is the reason this is written down

  A constraint expressed in two places has to be relaxed in two places, and the
  blueprint found one of them by reading Phase 5 rather than by asking how many
  checks encode the requirement. The one it missed was the earlier and stricter
  of the two - a load error where the other is a per-invocation rejection - so
  the feature was unreachable in a way no Phase 5 test could have caught.
constraints:
  - >-
    A kwarg that declares a default does not report kwarg_requirement_understated,
    however unconditionally its template renders it.
  - >-
    A kwarg with no default is unaffected. The finding, its rule slug and its
    wording are unchanged for every package that existed before defaults did.
