id: prov-2026-899109e9
title: Built-in operations can trim a leading literal and unwrap an outer delimiter pair
type: blueprint
status: open
version: 1
reason: ""
created_at: "2026-10-22"
author: calebcowen@gmail.com
intent: |-
  A value a model binds often arrives already wearing punctuation the template supplies itself: a description that begins with the comment leader the template writes before it, or a parameter list that carries its own parentheses where the template adds them. Rendering that value as is duplicates the punctuation and breaks the generated file, and no later check sees it because the value and the template are each valid on their own.

  Two new built-in operations, both string to string and both taking a literal argument written after a colon like prefix and suffix, repair this inside the template. trimprefix removes a leading literal together with the blanks that follow it, so {{why|trimprefix://}} turns "// Lets it" into "Lets it". unwrap removes one outer delimiter pair, so {{params|unwrap:()}} turns "()" into an empty string and "(a: string)" into "a: string". Neither changes a value that does not have the shape it removes.
constraints:
  - trimprefix and unwrap are added to the closed Operations list, so packages referencing them load and the catalog shows them like every other built-in.
  - trimprefix and unwrap are added to the set of parameterized operations, so a reference to either with no argument, with an empty argument, or with an argument containing the two characters {{ is rejected by the same argument check as prefix, suffix and join.
  - Both operations take one scalar string and return a string. A list is refused as for every operation except join, and an int or bool is handled as its text.
  - Both operations take their argument as a literal, and neither consults an op_exceptions table.
  - The operate method dispatches the names trimprefix and unwrap after the scalar value has been extracted, alongside prefix and suffix, passing the reference's argument.
  - trimprefix with argument X removes X from the start of the value when the value begins with X, together with every space and tab that directly follows it, and returns the remainder.
  - 'trimprefix removes only the first occurrence at the very start: with X as two slashes, the value "// // twice" becomes "// twice".'
  - trimprefix returns the value unchanged when it does not begin with X, including when X occurs only later in the value.
  - trimprefix removes only spaces and tabs after X, never newlines, and keeps blanks that occur before X untouched (a value with leading blanks does not begin with X).
  - trimprefix of a value that is exactly X, or is X followed only by blanks, is the empty string, and trimprefix of the empty string is the empty string.
  - 'unwrap requires its argument to be exactly two characters, counted as Unicode characters rather than bytes: the first is the opening delimiter X and the second the closing delimiter Y.'
  - unwrap with an argument that is not exactly two characters fails with an error that names the operation unwrap, states that its argument must be exactly two characters (an opening and a closing delimiter), and quotes the argument it received. The failure happens whenever the operation is applied, whatever the value is.
  - unwrap removes the first and last character of the value when the value starts with X, ends with Y, and that opening X is the one the final Y closes.
  - 'The opening X counts as closed by the final Y when scanning left to right, adding one for each X and subtracting one for each Y, the running count first returns to zero at the last character and not before. So "(a)(b)" is unchanged, "((a))" becomes "(a)", "(a: () => void)" becomes "a: () => void", "()" becomes the empty string, and "(a: string)" becomes "a: string".'
  - unwrap returns the value unchanged when it does not start with X, does not end with Y, or is shorter than two characters ("(a", "a)", "(" and the empty string are unchanged).
  - 'When X and Y are the same character there is no nesting to count: a value of at least two characters that starts and ends with that character loses its first and last character.'
  - 'unwrap removes at most one pair per application and does not trim blanks inside the pair: unwrap with argument {} over "{ a, b }" gives " a, b ".'
  - Applying either operation behaves identically in a pipeline step, in a template expression such as {{why|trimprefix://}}, and in a package's declared pipeline, because all of them reach the same operate method.
  - Every existing operation, template and pipeline behaves exactly as it did.
  - The PRD's transform section lists trimprefix:X and unwrap:XY with their behaviour in the built-in operation list, and the README's list of built-in operations names them.
