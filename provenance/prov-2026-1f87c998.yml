intent: The Append and Read functions append to and read a record's evidence file, and Latest picks the latest entry for a version.
constraints:
  - The functions live in internal/evidence/store.go, package evidence, and this file's imports are bufio, bytes, encoding/json, errors, fmt, os, path/filepath, strings and time, all from the standard library, imported as values
  - The Entry type is an exported struct with the fields Record (string), Version (int), CodeHash (string), At (string) and Runner (string)
  - In JSON the Entry fields are named record, version, code_hash, at and runner, written in that order
  - Runner is an exported string constant with the value sedum evidence
  - Path is an exported function that receives the output directory and a record id, both strings, and returns a string
  - Path returns the output directory joined with .sedum, evidence and the record id followed by .jsonl
  - Timestamp is an exported function that receives a time.Time and returns a string
  - Timestamp returns the time converted to UTC in RFC 3339 form with no fractional seconds
  - Read is an exported function that receives the output directory and a record id, both strings, and returns a slice of Entry and an error
  - Read returns no entries and no error when the record's evidence file does not exist
  - Read returns the entries in the order their lines appear in the file
  - Read skips a line that is empty or holds only white space
  - Read returns an error that names the file and the line number when a line is not a JSON object, or when its record is empty, its version is below 1 or its code_hash is empty
  - Read returns an error that names the file when the file exists but cannot be opened or read
  - Read does not create, change or remove any file or directory
  - Latest is an exported function that receives a slice of Entry and a version int and returns an Entry and a bool
  - Latest returns the last entry in the slice whose Version equals the version, and true
  - Latest returns the zero Entry and false when no entry has that version
  - Append is an exported function that receives the output directory (string) and an Entry and returns an error
  - Append returns an error and writes nothing when the entry's Record is empty, contains a forward slash or the operating system's path separator, or is the text ..
  - Append returns an error and writes nothing when the entry's Version is below 1 or its CodeHash is empty
  - Append creates the .sedum/evidence directory under the output directory, with its parents, when it is missing
  - Append opens the record's evidence file for appending, creating it when missing, and never truncates it
  - Append writes the entry as one JSON object on one line, without HTML escaping, followed by a newline, in a single write
  - Append first writes a newline when the existing file is not empty and does not end with one, so that the new entry starts on its own line
  - Append never rewrites, removes or reorders what the file already holds
  - Append returns an error that names the file when it cannot write
  - Read returns an error that names the file and the line number when an entry's record is not the record id that was requested
