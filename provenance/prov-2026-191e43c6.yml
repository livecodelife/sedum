id: prov-2026-191e43c6
title: The runner finds and runs the provenance binary
type: imprint
status: draft
version: 1
reason: ""
created_at: "2026-10-27"
author: calebcowen@gmail.com
intent: The runner resolves the provenance binary, builds its arguments and environment, runs it and reports how it ended.
constraints:
  - The provenance binary is the --provenance path when given
  - Without --provenance, the provenance binary is the path in the PROVENANCE environment variable when it is set and not empty
  - Without --provenance and PROVENANCE, the provenance binary is the first executable named `provenance` on PATH
  - A binary whose path, after resolving symlinks, lies under the git top level of the base directory (the directory that holds the config) is refused
  - A refused binary makes the command exit 2
  - With --range, the command runs `provenance check --commit <sha> --format sarif` once for each listed commit
  - With --staged, the command runs `provenance check --staged --format sarif`
  - With --staged and --message-file, the command adds `--message-file <path>` to the provenance invocation
  - When --config is given, the command passes `--config <path>` to every provenance invocation
  - Provenance runs with the base directory as its working directory
  - With --staged, GIT_DIR is passed through unchanged
  - With --staged, GIT_WORK_TREE is passed through unchanged
  - With --staged, GIT_INDEX_FILE is passed through unchanged, so that the index being committed is read
  - With --staged, every other GIT_* environment variable is cleared
  - With --range, every GIT_* environment variable is cleared
  - The provenance subprocess gets the same environment as the git commands
  - The exit code is 2 when provenance is not found
  - The exit code is 2 when provenance cannot start
  - The exit code is 2 when provenance exits with a status other than 0 or 1
  - The exit code is 2 when provenance prints nothing
  - Provenance exiting 1 after printing parseable SARIF is normal and is not exit 2
  - ResolveBinary takes the --provenance value, the PROVENANCE value and the git top level directory as strings and returns the binary path as a string and an error
  - ResolveBinary treats an empty string as not given
  - CheckArgs takes a commit sha string, a bool for staged, the message file path and the config path as strings and returns the argument slice for the provenance command
  - CheckArgs puts `check` first and always ends with `--format sarif`
  - RunProvenance takes the binary path, the argument slice, the working directory and the environment as a slice of strings and returns the standard output as bytes and an error
  - RunProvenance returns the standard output bytes together with a nil error when provenance exits 0 or 1 and prints something
  - RunProvenance returns an error for empty output and for an exit status above 1
  - Environment takes a bool for staged and the current environment as a slice of strings and returns the environment slice for git and provenance
  - Every error of the runner is built with ProvenanceError from output.go, which takes a message string and returns an error
  - This file imports bytes, os, os/exec, path/filepath and strings from the Go standard library as values
