id: prov-2026-b585fbbc
title: A second resource over the same Go package, to tell a rule from a copied string
status: open
created_at: "2026-08-17"
author: calebcowen@gmail.com
intent: |
  A second case, `grocery-chi-defined`, runs a different resource through the
  same Go package set: groceries, with `name` and `quantity`.

  ## The question it exists to answer

  [[prov-2026-bd2a6c3f]] gave the Go standard's source fragments descriptions
  naming their language, and the run after it bound them correctly in five
  samples of five:

    insert_values  'in.Title, in.Completed'
    scan_targets   '&todo.ID, &todo.Title, &todo.Completed, ...'

  Those are the exact strings the descriptions use as examples, and the record
  they were generated from asks for a resource with exactly those fields. The
  run therefore cannot distinguish two hypotheses:

    the model read the rule and applied it
    the model copied the example

  That is a confound I built by writing the examples from the case's own
  resource. It matters because the actions are meant to be general: a package is
  a team's conventions, and a standard that only works for the resource its
  descriptions were written against is not one.

  ## Why a resource that shares nothing

  `groceries` with `name` and `quantity` overlaps `todos` with `title` and
  `completed` in no field name and no type. Copying is therefore not merely
  wrong, it is *visibly* wrong:

    in.Title      against a struct with no Title      - does not compile
    &todo.ID      where the receiver is grocery       - does not compile
    'title, completed' as SQL against this table      - fails at query time

  The failure is loud either way, and prov-2026-93829987 now carries the
  compiler's own words back into the report, so the answer arrives without a
  hand reconstruction.

  A field that happened to be shared would be the dangerous case - partial
  copying that compiles and is subtly wrong - and it is deliberately not what
  this case sets up. This case asks the blunt question first.

  ## Its own case, not a second record in the existing one

  A second record under todo-api/records would be generated by the todo case as
  well, since that case names the directory rather than a record, and one
  measurement covering two resources would report a rate over a mixture. Its own
  case costs a second run and keeps each number about one thing.

  The generators line points at todo-api/generators/defined deliberately: one
  package set, two records, which is the whole comparison. The records live
  under grocery-api/ so that neither case picks up the other's.

  ## What the expectations are for

  The action counts are authored from the package rather than observed, because
  no run has established them - the same discipline the wire actions were added
  under.

  The binding expectations are the point. `insert_values` expecting "in.Name,
  in.Quantity" and `scan_targets` expecting the grocery receiver are what make
  the eval itself score the question, rather than leaving it to be read off a
  behaviour failure. A model that copies scores zero on those kwargs while
  selecting every action perfectly, which is exactly the shape this harness
  exists to surface.
constraints:
  - >-
    The case runs the same generator package set as todo-chi-defined. A copy of
    the package would answer a different question, since the thing under test is
    whether that package generalizes.
  - >-
    The resource shares no field name and no type with todos, so a copied
    binding cannot accidentally be right.
  - >-
    Records live outside todo-api/records, because that case names a directory
    and would otherwise generate this record too.
  - >-
    Binding expectations name the values a correct answer carries, so the
    question is scored rather than inferred. They are authored from the record
    and the templates, never from a run - the discipline prov-2026-2b121b62 set.
  - >-
    Behaviour is measured through a target of its own, asserting the same CRUD
    contract against /groceries.
