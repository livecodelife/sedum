id: prov-2026-d5c592b3
title: The exit error carries a process exit code to Execute
type: imprint
status: implemented
version: 1
reason: ""
created_at: "2026-10-27"
author: calebcowen@gmail.com
intent: The exit mechanism lets a command choose the process exit code and message through an error that Execute honours.
constraints:
  - ExitError is an exported struct with an int field Code and a string field Message
  - The Error method of ExitError has a value receiver, takes no argument and returns its Message
  - An ExitError value and a pointer to one are both errors
  - Commands return ExitError values, not pointers
  - CodeOf takes an error and returns the exit code as an int and a bool
  - CodeOf finds an ExitError with errors.As on a value target
  - CodeOf returns true and the Code of the ExitError when the error is, or wraps, an ExitError
  - CodeOf returns false for any other error and for nil
  - CodeOf is the only place that reads the fields of an ExitError for the decision of Execute
  - This file imports errors from the Go standard library as a value
affected_scope:
  - internal/cli/exit.go
  - internal/cli/exit_test.go
