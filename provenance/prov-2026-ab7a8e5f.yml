intent: |-
  The Go logic of internal/verify/verify_windows.go (go package, package verify): the Windows implementations of the platform hooks runCommand calls. The file name makes Go build it for GOOS=windows only.

  Imports, each its own addImport, exactly: context, os/exec, strconv, syscall.

  Declarations, in this order, each exactly one set* call whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything.

    - setFunction name shellCommand, code exactly:
        // shellCommand returns the unstarted command that runs one shell command line:
        // through sh -c when an sh is on PATH, as Git for Windows provides, otherwise
        // through cmd /C with the line passed to the process unquoted.
        func shellCommand(ctx context.Context, command string) *exec.Cmd {
        	if sh, err := exec.LookPath("sh"); err == nil {
        		return exec.Command(sh, "-c", command)
        	}
        	cmd := exec.Command("cmd")
        	cmd.SysProcAttr = &syscall.SysProcAttr{CmdLine: "cmd.exe /C " + command}
        	return cmd
        }

    - setFunction name configureProcess, code exactly:
        // configureProcess prepares cmd before it starts. Windows needs no process
        // group, and it must not replace SysProcAttr, which shellCommand may have set.
        func configureProcess(cmd *exec.Cmd) {}

    - setFunction name killTree, code exactly:
        // killTree terminates the started command and every process it started.
        func killTree(cmd *exec.Cmd) {
        	_ = exec.Command("taskkill", "/T", "/F", "/PID", strconv.Itoa(cmd.Process.Pid)).Run()
        	_ = cmd.Process.Kill()
        }
constraints:
  - On Windows, shellCommand(ctx context.Context, command string) returns an unstarted *exec.Cmd that runs the command through 'sh -c <command>' when exec.LookPath finds an executable named sh
  - On Windows, shellCommand returns a command that runs through 'cmd.exe /C <command>' when exec.LookPath finds no sh, with the command line given verbatim through SysProcAttr.CmdLine so cmd receives the text unquoted
  - On Windows, shellCommand does not set the working directory and does not start the process
  - On Windows, configureProcess(cmd *exec.Cmd) sets no process group and leaves cmd.SysProcAttr unchanged
  - On Windows, killTree(cmd *exec.Cmd) terminates the started process and every process it started by running 'taskkill /T /F /PID <pid>' for cmd.Process.Pid
  - On Windows, killTree ignores taskkill's error and then also kills cmd.Process directly
  - The file references no Unix-only symbol and builds with GOOS=windows, GOARCH=amd64 and CGO_ENABLED=0
