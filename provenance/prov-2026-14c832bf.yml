id: prov-2026-14c832bf
title: An action's target may be a kwarg, and the constraint against choosing paths is scoped to pattern targets
status: draft
created_at: "2026-08-14"
author: calebcowen@gmail.com
intent: |
  [[prov-2026-1bbb8e2e]] put each action's injects_into pattern in the catalog and
  wrote four constraints around it. Three of them are untouched here. The third
  reads:

    The model still binds arguments and never chooses a path. The pattern is
    shown so that its bindings can land on an authorized file, not so that it
    can name one.

  As written it is absolute, and it forbids a shape that already works. This
  record restates it as the rule it was actually built from - a *pattern-targeted*
  action's kwargs are bound, never inverted from a path - and licenses an action
  to declare its target to be a kwarg instead.

  The whole of prov-2026-1bbb8e2e's finding survives. Showing the pattern is
  necessary, and it is necessary for exactly the actions it was found on.

  ## The duplication that motivates it

  injects_into is declared on the action, so an action whose template is
  target-independent still needs one definition per target file group. addImport
  becomes addModelImport, addControllerImport, addSerializerImport - same kwargs,
  same template body, differing only in a path pattern.

  The authoring duplication is the visible cost. The real cost is catalog
  quality. Phase 4 hands the model a set of near-identical entries with identical
  kwarg schemas whose only discriminator is a name encoding a fact the model has
  to infer. That is the worst possible shape for selection accuracy, which is the
  thing the closed vocabulary exists to protect, and it scales multiplicatively:
  file-agnostic actions times file groups.

  The root cause is that injects_into conflates two things - *which file this
  action targets*, and *what naming convention identifies that file*. For a
  structure-creating action the target is implied by the action's identity;
  createControllerMethod only ever means a controller, and the pattern is exactly
  right. For a file-agnostic action the file is genuinely a parameter, and
  encoding it in the action definition forces one action per binding of that
  parameter. The convention is also already stated once, in files/, and the
  action restates it.

  ## The model's mistake was this proposal

  prov-2026-1bbb8e2e was written from an observed failure: qwen2.5-coder-14b,
  shown a kwarg named controller and an authorized file
  app/controllers/users_controller.rb, bound controller to the whole path.

  Worth sitting with, because it is the argument for scoping rather than
  overriding: the model tried to name the file it had been handed. The two
  records are two answers to one observation - teach the model to invert the
  pattern by forward matching, or stop requiring the inversion. The first is
  strictly necessary where the path genuinely is the package's. It is
  unnecessary work where it is not.

  ## It needs no code, and that was verified rather than reasoned

  injects_into is a pattern rendered against bound kwargs, and load-time
  validation only inspects it when it is literal - a pattern containing {{ is
  deferred to Phase 6 by construction. So this is already legal:

    addImport:
      kwargs:
        file:   { type: string, required: true }
        symbol: { type: string, required: true }
      injects_into: "{{file}}"
      anchor: imports

  A chi2 fixture was built and run: addImport with a bare-kwarg target, three
  file-template groups where handlers and models plant an imports marker and
  store deliberately does not, one record authorizing one path in each, and a
  stub OpenAI-compatible endpoint supplying the selections.

  | What was tested | Result |
  |---|---|
  | sedum validate on a bare-kwarg injects_into | 0 errors, 0 warnings |
  | One addImport across two file groups | Both injected correctly |
  | Two addImport calls into one file | Two distinct regions, no collision |
  | Three consecutive runs | 2 injected, then 2 replaced, then 2 replaced - no drift |
  | Target a path the record did not authorize | Phase 5 unauthorized_path, re-promptable |
  | Target a file whose template plants no imports | Phase 7 hard error |
  | Valid invocation before a failing one | Nothing written. Phase 7 is atomic |

  Two things that could have been safety holes are not. The path pattern was
  never the safety boundary - affected_scope is, and Phase 5's unauthorized_path
  rule is unchanged. And the missing-anchor case refuses the whole record rather
  than leaving a partial write.

  Many-per-file invocation also already works. addImport has no discriminator, so
  every invocation would collide on sedum:addImport under label-only identity;
  inject.IdentityOf already handles it, because required kwargs select and
  optional kwargs parameterize. Making file required puts it in the identity key,
  which is correct. The consequence is that changing an invocation's target
  orphans the region in the old file rather than moving it - already true of any
  required kwarg feeding a path pattern, so not introduced here.

  ## What is lost, and the better replacement

  The pattern implicitly restricted applicability: addBeforeFilter could not be
  aimed at a migration, because the path would not render to one. A free target
  removes that guard, and it is replaced by **anchor applicability** rather than
  reinstated.

  An action's anchor already declares the region kind it needs. The check is that
  the file template which matched the target path must plant the marker the
  action is anchored to. Everything it requires exists: resolve.Resolution.Template
  names the matched template, genpkg.MarkersIn(commentPrefix, content) extracts
  the markers a template plants, and Action.MarkerAnchor() gives the marker an
  action is anchored to.

  Today plantedMarkers does this package-wide at load, as a warning
  ([[prov-2026-a9e59197]]) - the best available check when the target is a
  pattern. With the target known per invocation it narrows to a per-file error at
  Phase 5:

    addImport injects into db/migrate/001_create_users.rb, whose file template
    db/migrate/*.rb plants no "imports" marker

  This is strictly better than what the path pattern gave. It states the actual
  precondition rather than approximating it by directory; it catches the case
  where a path matches the pattern but the file has no such region; and it is the
  check Phase 7 would have failed on anyway, moved from a hard error mid-write to
  a re-promptable Phase 5 diagnostic. That move is the entire implementation cost
  of this record.

  It also reframes an action's applicability contract as anchor vocabulary rather
  than path shape, which is a more honest description of what these actions are.
  They operate on a region kind, not on a directory.

  ## The catalog carries an anchor where a pattern says nothing

  With injects_into: "{{file}}" the entry shows ["{{file}}"], which carries none
  of the information prov-2026-1bbb8e2e added it to carry.

  The useful fact for a free-target action is the anchor it requires - and the
  anchor alone is not enough, because the model has no way to know which files
  carry it. So the file list Phase 4 already sends gains the markers each created
  file plants, and the action's entry gains its anchor.

  That is the same move prov-2026-1bbb8e2e made, one layer over. There, the model
  matched a *pattern* against the authorized paths and bound what was left. Here
  it matches an *anchor* against the markers those paths plant and names the file
  that has one. Forward and mechanical in both cases, and in neither does Sedum
  contribute target knowledge - the markers are the package author's strings,
  passed through, exactly as the pattern and the kwarg names already are.

  The planted-marker set is the same computation [[prov-2026-6d87dc11]] needs for
  unfilled anchors and the same one this record's Phase 5 check needs. One
  mechanism, three consumers.

  ## The catalog has a second consumer, and it decides the shape

  The obvious move is to emit the anchor *in place of* the degenerate pattern,
  since ["{{file}}"] is noise to the model. That is wrong, and it took a second
  consumer to see why.

  sedum actions --json is a supported surface. Under [[prov-2026-59535684]] the
  generator package and the commands are what a tool built on Sedum gets, and a
  caller doing its own selection reads that catalog to decide which action can
  represent a change. To such a caller the degenerate pattern is not noise: a
  present-but-bare injects_into is how it tells *this action's target is a
  parameter* apart from *this action has no target pattern*. Dropping it deletes
  the only signal that distinguishes them.

  So the two are split. **The JSON keeps injects_into and gains anchor; the
  prompt suppresses the bare pattern when it renders a free-target entry.** The
  catalog is the contract and the prompt is a view of it, which is the honest
  relationship and was already true - the prompt has always been a rendering
  rather than a serialization.

  This is the first change to make it explicit, and it sets the rule for later
  ones: additions to the catalog are additive to the JSON, and what any single
  consumer is shown is that consumer's rendering. A prompt-side omission is not
  a schema change and must never be implemented as one.

  It also matters more than a formatting choice, because a free target degrades
  exactly the classification a caller performs. Rendering injects_into against
  recorded kwargs is how a caller decides whether a generative action can
  represent a change; a bare {{file}} renders to whatever it is handed, so a
  free-target action appears able to represent every change to every file. The
  anchor is what restores the discrimination, and it restores it by the same rule
  Phase 5 checks: the action is applicable to a file whose template plants its
  marker. One rule, enforced inside Sedum and available outside it.

  ## The three sub-questions, settled

  **Both forms coexist, with no opt-in in sedum.yaml.** The proposed guard would
  be a package-level switch protecting an author from an action that author
  writes themselves; an author who wants a purely convention-driven layout simply
  declares no free-target action. This is unlike the opt-in on a future edit
  layer, which protects against a *tool's* behavior the author did not author.
  A switch with no adversary is configuration for its own sake.

  **The anchor is emitted for free-target actions, not for all of them.** For a
  pattern-targeted action the file is already determined, so its anchor tells the
  model nothing it can act on, and the catalog's job is to carry what the model
  needs rather than what Sedum knows.

  **Anchor applicability is an error at Phase 5, not a warning.** It cannot
  tighten anything: Phase 7 already hard-errors on that exact case, so a Phase 5
  error is strictly a softening - the same failure, earlier, and re-promptable.
  The blank-file worry is real but is about the diagnostic rather than the
  severity. A file whose template plants no markers at all and a file whose
  template plants markers but not this one have different fixes, so the message
  distinguishes them - the same distinction the unmanaged load-time check draws
  between *declared unmanaged* and *never created*.
constraints:
  - >-
    Carried from prov-2026-1bbb8e2e, unchanged: the injects_into pattern is
    passed through literally, transform pipes and all. Nothing interprets,
    expands, or explains it, so no target knowledge enters the prompt.
  - >-
    Carried from prov-2026-1bbb8e2e, unchanged: a composite carries one pattern
    per child, in execution order, because one selection touching two files is
    the fact the entry has to convey.
  - >-
    Carried from prov-2026-1bbb8e2e, unchanged: matching is forward - pattern
    against the authorized file list. Nothing in the catalog or the prompt may
    imply that a kwarg can be recovered from a rendered path, because the
    transforms are not invertible.
  - >-
    Rescoped. For a pattern-targeted action the model binds arguments and never
    chooses a path: the pattern is shown so that its bindings can land on an
    authorized file, not so that it can name one. An action that declares its
    target to be a kwarg has no pattern to invert and no inversion to prohibit,
    and is outside this rule rather than an exception to it.
  - >-
    affected_scope is the safety boundary and the path pattern never was. A free
    target changes nothing about Phase 5's unauthorized_path rule, which still
    requires a rendered path to be one this record authorized and this run
    manages.
  - >-
    Applicability is replaced, not dropped. An action whose anchor is a marker
    may only target a file whose matched template plants that marker, checked per
    invocation at Phase 5 as a re-promptable error. It must not be discovered at
    Phase 7, which is where it lands today.
  - >-
    The Phase 5 diagnostic distinguishes a file whose template plants no markers
    at all from one that plants markers but not the required one. The two have
    different fixes, and a _default template or an empty-file fallback makes the
    first case legitimate.
  - >-
    Every catalog entry carries its action's anchor, and the Phase 4 file list
    carries the markers each created file plants. Both are additive to
    sedum actions --json, which is a supported surface with consumers other than
    the prompt.
  - >-
    The JSON keeps injects_into for a free-target action. A present-but-bare
    pattern is how a caller distinguishes a parameterized target from no target
    pattern, and it is what makes anchor-based classification necessary rather
    than merely available.
  - >-
    Suppressing the bare pattern is a prompt-rendering decision, never a schema
    one. The catalog is the contract and each consumer's view is a rendering of
    it; an omission for the model's benefit must not remove a field from the
    JSON.
  - >-
    Both target forms coexist with no opt-in. A package that declares no
    free-target action is unchanged, and no sedum.yaml key gates the feature.
  - >-
    Planted markers are read from what Phase 3 actually rendered, through the one
    computation prov-2026-6d87dc11 and this record's Phase 5 check both use.
    Nothing is inferred from a package's declarations about what a file ought to
    contain.
  - >-
    Additive to actions.yaml. No durable artifact changes shape - markers,
    recordings, and existing packages are untouched, so nothing needs migrating.
