id: prov-2026-d554bfc3
title: 'Sedum: configuration-driven boilerplate generation from provenance records'
status: open
created_at: "2026-08-07"
author: calebcowen@gmail.com
intent: |
  Build Sedum, a Go CLI that generates boilerplate code from provenance records
  using generator packages that teams author themselves.

  A provenance record declares intent, constraints, and the files a change is
  authorized to touch. A generator package declares a team's conventions: the
  shape of each file type, which code-injection actions exist, what arguments
  they take, what templates they render, and where in a file the results belong.
  Sedum reads both, uses a language model to translate intent into a list of
  action invocations, and executes those invocations deterministically.

  The load-bearing property is that Sedum's core contains no language-specific
  knowledge. It reads a directory, matches a path against a pattern, applies
  string operations, renders a template, and places text at an anchor. It does
  not know what a controller is, what a header file is, or how Go capitalizes
  initialisms. Teams express all of that in configuration; a team switching from
  Rails to Java writes a new generator package rather than waiting on Sedum.

  Success: a team authors a generator package for their stack, points Sedum at a
  provenance directory and that package, and receives the files the records
  authorized, shaped by their file templates, containing the boilerplate their
  action templates describe. They run it again and get the same result.

  Where Sedum ends. Sedum is one of three tools, and the boundary is recorded in
  TOOL_BOUNDARIES.md. LineSpec owns behavioral contracts, provenance records in
  both domains, record drafting and discovery, and test execution. Sedum owns
  deterministic generation from records and generator packages - this brief, M0
  through M7, and nothing more. A third tool, unnamed, owns the convergence loop:
  the two-beat lifecycle, topological ordering across regions, the focused edit
  layer, the paired test-then-logic update loop, failure traceback, the repair
  modes, and the escalation ladder.

  The line is not determinism, which would cut wrong - Phase 4 is a model call,
  and a zero-model Sedum would gut M6 for no benefit. The line is bounded
  selection over a closed declared vocabulary versus open synthesis validated by
  execution. Sedum's model emits {action, kwargs} drawn from a catalog; every
  failure mode is machine-checkable before anything runs, and a retry costs one
  model call. A convergence loop's model writes freeform content that can only be
  validated by running something. One binary containing both would take the
  weaker guarantee as its own, and the no-target-knowledge principle above would
  not survive it: a loop that boots a service and runs its suite is irreducibly
  target-aware.

  This does not narrow what is built here. It names what is not, and it makes the
  artifacts Sedum leaves on disk into a supported surface rather than internal
  detail, because the tool above Sedum is a separate program that reads them.

  Source of truth for scope and behavior is PRD.md at the repo root. This brief
  is the parent of one blueprint per milestone (M0 scaffold, M1-M7 from the PRD),
  plus the design decisions recorded alongside them.
constraints:
  - >-
    Configuration carries all target knowledge. No language, framework, or
    filetype name may appear in Sedum's core. Adding a target means authoring a
    generator package, never modifying Sedum.
  - >-
    The model does exactly one job: select actions from a closed, declared
    vocabulary and bind their arguments. It does not write code, choose file
    paths, or make structural decisions.
  - >-
    Everything after the model's response is deterministic. File creation,
    template rendering, transform resolution, composite expansion, path
    resolution, and injection are pure functions of validated model output and
    the generator package.
  - >-
    Sedum touches only what a provenance record authorizes. No file is created
    that affected_scope did not name; no convention rule infers companion files
    into existence.
  - >-
    Failures are loud and specific. A missing anchor, an undefined transform, or
    an unauthorized path halts the run with a diagnostic naming the action, the
    file, and the rule violated.
  - >-
    No language parsers and no AST work anywhere in the system. Injection points
    exist because a file template planted a marker, not because Sedum parsed
    structure out of a file.
  - >-
    Prefer well-known third-party packages over hand-rolled equivalents.
    Baseline stack, applied consistently across every blueprint under this
    brief - spf13/cobra (CLI), gopkg.in/yaml.v3 (config and record parsing,
    strict/KnownFields decoding), text/template (rendering), log/slog (run log),
    iancoleman/strcase (case conversion and word splitting),
    sashabaranov/go-openai (model client, OpenAI-compatible so local endpoints
    work). Any addition to this list is an imprint-level decision with a stated
    reason.
  - >-
    Non-goals held firm: business logic synthesis, structured-document editing
    (pom.xml, package.json, CMakeLists.txt), cross-action value flow, structure
    inference from unmarked source, and behavioral verification of generated
    code. Structure inference is the precise form of the old "scanning existing
    codebases" non-goal, which read literally forbade the marker scan Phase 3
    and the integration surface both depend on. Reading what Sedum wrote is not
    inference; deriving regions or conventions from source Sedum did not shape
    is.
  - >-
    Sedum is a component with no runtime API. The supported surface for any tool
    built on top of it is artifacts on disk - ownership markers, the generator
    package, the recording - plus sedum grow --execute. Nothing links against
    Sedum, and no phase offers a callback, hook, or plugin point: a caller sits
    above Sedum and Sedum never calls back, because every phase after model
    invocation is deterministic precisely because nothing foreign runs inside it.
  - >-
    Sedum stays independently runnable. Committing a recording as a standard
    service scaffold and replaying it must never require a harness, a container,
    or a model server.
  - >-
    Durable artifacts are versioned by shape, not by a version token. The
    ownership marker's attribute object and the recording's phases grouping both
    exist so that a field added later is an addition rather than a migration
    across repositories that already carry them. Unrecognised marker attributes
    are preserved in both directions, which is what lets another tool keep
    per-region state without a schema change.
  - >-
    Milestone order is deliberate. M4 (deterministic rendering and injection)
    must be provably correct before M6 introduces a model, so that any later
    failure is unambiguously a selection failure rather than a rendering one.
