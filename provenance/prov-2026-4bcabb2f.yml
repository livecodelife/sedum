id: prov-2026-4bcabb2f
title: No response_format is sent, because constraining it collapsed selection
status: implemented
created_at: "2026-08-14"
author: calebcowen@gmail.com
intent: |
  Sedum sends no response_format field. The response contract lives in the
  prompt, in the decoder's tolerance, and in Phase 5. This reverses the position
  this record was opened with, and the measurement that reversed it is the
  reason to keep the record rather than delete it.

  The original plan was to ask for the strictest structured-output mode
  available. That ran into two things in order.

  First, there is no value every OpenAI-compatible server accepts.
  {"type": "json_object"} is what the API documents and what hosted OpenAI
  takes; LM Studio - the reference local server for exactly the open-weight
  range this design exists to serve - refuses it outright with
  'response_format.type' must be 'json_schema' or 'text'. That alone only
  argued for negotiating between the two.

  Second, and decisively: constraining the response made the model stop
  selecting. Against qwen2.5-coder-14b with the invocation envelope as a
  json_schema, the same prompt that produced three correct invocations
  unconstrained produced {"invocations": []} every time. It was not the strict
  flag - strict true and false behaved identically - and it was not the kwargs
  object being open, since loosening it to additionalProperties: true changed
  nothing. Adding minItems: 1 restored the full answer immediately, which
  identifies the mechanism: grammar-constrained decoding takes the shortest
  legal completion available at the array's first token, and an empty array is
  legal.

  minItems: 1 is not available as a fix. A record whose intent needs no action
  is legitimate, and a schema that forbids saying so would trade a model
  returning nothing for a model forced to invent something - which is far worse,
  because Phase 5 cannot catch a plausible wrong answer and can catch an empty
  one trivially.

  So the constraint is dropped. What is lost is insurance Sedum never relied on:
  the decoder already tolerates a code fence and both envelope shapes, Phase 5
  validates every response identically whether or not a server shaped it, and
  the retry loop already exists for output that arrives wrong. What is gained is
  that every OpenAI-compatible server behaves the same way, and that the model
  answers the question it was asked.

  Worth naming for whoever revisits this: the failure was invisible from the
  response alone. {"invocations": []} is a valid answer, the run reported
  success, and it created the file and injected nothing. Only comparing against
  an unconstrained call showed it. Any future attempt to reintroduce constrained
  decoding has to be measured against selection quality on a record that should
  produce invocations, not against whether the output parses.
constraints:
  - >-
    No response_format is sent. The response contract is stated in the prompt
    and enforced by Phase 5, which is where it can be enforced specifically
    enough to re-prompt with.
  - >-
    Any reintroduction of constrained decoding must be measured against
    selection quality on a record that should produce invocations. Whether the
    output parses is not the test - an empty array parses.
  - >-
    A schema forcing at least one invocation is not an option. A record whose
    intent needs no action is legitimate, and forcing the model to invent one
    trades a failure Phase 5 catches for one it cannot.
  - >-
    This is a transport concern. It must not reach the prompt's content, the
    catalog, or the validation rules, and no generator package or provenance
    record may influence it.
affected_scope:
  - internal/selection/**
forbidden_scope: []
