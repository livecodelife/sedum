intent: The Marker struct is one region's opening marker as read and as written.
constraints:
  - The type lives in internal/inject/marker.go, package inject
  - The file imports, stated once here for every declaration in the file, the standard library packages bytes, encoding/json, fmt, sort and strings, and github.com/livecodelife/sedum/internal/genpkg, all as values
  - Marker is an exported struct with the fields Action, Variant, Record, Gen, Pkg and Writer of type string, Tier of type Tier, Kwargs of type map[string]any, Extra of type map[string]json.RawMessage, Version of type int, Foreign of type bool, and KwargsHash and Body of type string
  - Version is 0 for a v1 marker and 2 for a v2 marker
  - Foreign is true for a marker whose v is not 2 and not absent
  - On a v1 marker Kwargs holds every kwarg the region was rendered from
  - On a v2 marker Kwargs holds only the identity kwargs, the id object
  - KwargsHash holds the kwargs hash of a v2 marker and is empty on any other marker
  - Body holds the body hash of a v2 marker and is empty on any other marker
  - Extra holds every attribute key the marker format does not model, as read
