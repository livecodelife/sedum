id: prov-2026-c080c878
title: The trimPrefixLiteral function removes a leading literal and the blanks after it
type: imprint
status: open
version: 1
reason: ""
created_at: "2026-10-22"
author: calebcowen@gmail.com
intent: The trimPrefixLiteral function, in internal/transform/ops.go, removes a leading literal and the spaces and tabs that directly follow it from a string.
constraints:
  - The function is a package-level function named trimPrefixLiteral in package transform, not a method.
  - 'The function receives two positional string arguments: first the value, then the literal prefix.'
  - The function returns a single string and no error.
  - When the value begins with the literal prefix, the function returns the value with that prefix removed and with every space and tab that directly follows the prefix removed as well.
  - 'Only the first occurrence at the very start is removed: with the prefix as two slashes, the value "// // twice" returns "// twice".'
  - When the value does not begin with the literal prefix, the function returns the value unchanged.
  - A value that is exactly the prefix, or the prefix followed only by spaces and tabs, returns the empty string. The empty value returns the empty string.
  - Only the space character and the tab character count as blanks to remove; a newline after the prefix is kept.
  - The function reads no other state and does not modify its arguments.
  - 'The function adds no imports: the strings package it uses is already imported by the file as a value.'
