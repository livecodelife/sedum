intent: The selectAll function runs Phase 4 and Phase 5 once per record, choosing each re-selected record's prior selection.
constraints:
  - The function lives in internal/pipeline/pipeline.go, package pipeline, and adds no imports
  - A re-selected record's prior selection is the one --prior-recording supplies when it names the record.
  - Otherwise the prior selection is the invocations in the phases of the record's recording, when that recording is readable and its phases hold at least one invocation.
  - Otherwise the prior selection is what priorFromMarkers builds from the record's owned regions.
  - selectAll reads the recording of a record from the recordings directory of the run with recording.ReadRecord
  - Prior selections taken from a recording's phases include only exposed actions.
  - Prior selections taken from a recording's phases include only the kwargs the action declares.
  - An explicit --prior-recording still wins.
  - selectAll receives a context.Context, a Config, a pointer to record.Set, the resolved files, the variables map[string]string, the slice of Classification, the owners map[string]inject.Owner and a pointer to runlog.Log, and returns a slice of Selection and an error
  - A prior selection taken from a recording's phases that exceeds MaxPriorBytes is left out of the prompt rather than failing the run
  - A prior selection rebuilt from markers that exceeds MaxPriorBytes is left out of the prompt rather than failing the run
  - A prior selection supplied by --prior-recording that exceeds MaxPriorBytes is an error
