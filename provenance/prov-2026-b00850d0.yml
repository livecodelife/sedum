intent: The OwnedRegion.BodyState method says whether a region's text still hashes to the body hash on its marker.
constraints:
  - The method lives in internal/inject/scan.go, package inject, has an OwnedRegion value receiver, takes no argument and returns a BodyState, defined in this file, and adds no imports
  - OwnedRegion is the struct of this file with the fields Path, Package and Region
  - Region is the struct defined in marker.go with the fields Marker, Start, End and BodyHash
  - The method returns BodyUnverifiable when the region's marker is Foreign
  - The method returns BodyUnverifiable when the marker's Version is not 2
  - The method returns BodyUnverifiable when the marker's Body is empty
  - Otherwise the method returns BodyIntact when the Region's BodyHash equals the marker's Body
  - Otherwise the method returns BodyEdited when the Region's BodyHash differs from the marker's Body
  - The method reads nothing but the OwnedRegion it is called on
  - The method never returns an error
