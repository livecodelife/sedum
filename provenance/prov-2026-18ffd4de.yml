intent: The writeCanonicalString function appends a string to a buffer as a JSON string with minimal escaping.
constraints:
  - 'The function lives in internal/inject/canon.go, package inject, and adds no imports: bytes and strconv come from the file''s import list'
  - The function is unexported and receives positionally a pointer to bytes.Buffer and a string, and returns nothing
  - The string is written between double quotes
  - A double quote is written as a backslash and a double quote
  - A backslash is written as two backslashes
  - Backspace, form feed, line feed, carriage return and tab are written as the two-character escapes \b, \f, \n, \r and \t
  - Any other character below U+0020 is written as \u00 followed by two lower-case hex digits
  - Every other character, including <, >, &, U+007F, U+2028 and U+2029, is written as itself in UTF-8
  - The string is not Unicode-normalized
