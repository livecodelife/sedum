id: prov-2026-f4185cd9
title: The unwrapPair function removes one outer delimiter pair
type: imprint
status: open
version: 1
reason: ""
created_at: "2026-10-22"
author: calebcowen@gmail.com
intent: The unwrapPair function, in internal/transform/ops.go, removes the outer delimiter pair of a string when the opening delimiter is the one the final closing delimiter closes, and rejects a pair argument that is not two characters.
constraints:
  - The function is a package-level function named unwrapPair in package transform, not a method.
  - 'The function receives two positional string arguments: first the value, then the pair, a string holding the opening delimiter followed by the closing delimiter.'
  - 'The function returns two results: the resulting string, then an error.'
  - When the pair does not hold exactly two characters, counted as Unicode characters and not bytes, the function returns the empty string and a non-nil error, whatever the value is.
  - That error names the operation unwrap, says its argument must be exactly two characters, an opening and a closing delimiter, and quotes the pair it received.
  - With a valid pair and a value shorter than two characters, the function returns the value unchanged and a nil error.
  - With a valid pair, the function returns the value unchanged and a nil error when the value does not start with the opening delimiter or does not end with the closing delimiter.
  - When the pair's two characters differ, the function scans the value from its first character, adding one for each opening delimiter and subtracting one for each closing delimiter, and the outer pair is removed only when the count first returns to zero at the last character of the value, not earlier.
  - 'So "(a)(b)" is returned unchanged because the count returns to zero before the last character, while "((a))" returns "(a)", "(a: () => void)" returns "a: () => void", and "()" returns the empty string.'
  - 'When the pair''s two characters are the same character there is no nesting: a value of at least two characters that starts and ends with it has its first and last character removed.'
  - On removal the function returns the value without its first and last character, with the inside left exactly as it was (blanks inside the pair are kept), and a nil error. At most one pair is removed.
  - 'The function adds no imports: the fmt package it uses for building the error is already imported by the file as a value.'
