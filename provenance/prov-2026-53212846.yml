id: prov-2026-53212846
title: The orchestration runs the check over a range or the staged change
type: imprint
status: draft
version: 1
reason: ""
created_at: "2026-10-27"
author: calebcowen@gmail.com
intent: The orchestration runs provenance for each commit, decides which findings the proofs waive, and writes the merged output.
constraints:
  - With --staged and no --message-file, the message that is judged is the message of HEAD
  - With --range, each commit is judged with its own commit message
  - 'The justification of a regeneration waiver, the proof named `regeneration`, is "regeneration: " followed by the 7-character short sha of the commit'
  - 'The justification of a marker migration waiver, the proof named `migration`, is "marker migration: " followed by the 7-character short sha of the commit'
  - 'For --staged the justifications are "regeneration: staged" and "marker migration: staged"'
  - Options is a value with string fields Range, MessageFile, Config, Output, Generators, Records, Format, Provenance and TopLevel, a bool field Staged and a PathConfig field Paths
  - Outcome is a value with int fields Unwaived, Waived and Skipped
  - Check takes an Options value and an io.Writer for standard output and returns an Outcome and an error
  - Check resolves the binary with ResolveBinary from runner.go, which takes the --provenance value, the PROVENANCE environment value and the Options TopLevel as strings and returns the path as a string and an error
  - Check builds the git and provenance environment with Environment from runner.go, which takes the Staged bool and the current environment as a slice of strings and returns a slice of strings
  - For --range, Check lists the commits with Commits from paths.go, which takes the base directory (the directory that holds the config), the range string and the environment and returns a slice of sha strings and an error
  - For each commit, Check builds the arguments with CheckArgs from runner.go and runs provenance with RunProvenance from runner.go, which takes the binary, the arguments, the working directory and the environment and returns the output bytes and an error
  - Check parses each output with ParseLog from sarif.go, which takes the output bytes and returns a Log and an error, and reads its results with the Results method of Log
  - Check turns each Result into a Finding with FindingOf from finding.go, which takes a Result and returns a Finding
  - Check reads the commit message with CommitMessage from paths.go, which takes the base directory, a revision string, the Staged bool, the message file path and the environment and returns the message string and an error
  - Check parses the tags of the message with ParseTags from finding.go, which takes the message string and returns a slice of Tag values
  - Check finds the base with Base from paths.go, which takes the base directory, a revision string, the Staged bool and the environment and returns the base revision string, a bool that is false when there is no base, and an error
  - Check skips the proofs for a commit that has no base
  - Check skips the proofs for a commit that has no tag
  - Check skips the proofs for a commit that has no finding
  - The commit side of a merge commit is the merge's own tree and its base side is the first parent's tree
  - Check lists the changed paths with ChangedPaths from paths.go, which takes the base directory, a revision string, the Staged bool and the environment and returns a slice of paths relative to the base directory and an error
  - Check classifies the changed paths with Classify from paths.go, which takes the paths and the PathConfig and returns a Classified value
  - Check exports the commit tree with ExportTree from classes.go, which takes the base directory, a revision string, the Staged bool and the environment and returns the directory string, a cleanup function and an error, and calls the cleanup function before it returns
  - For --staged Check passes an empty revision string to ExportTree to export the index
  - Check exports the base tree with ExportTree for the base revision with the Staged bool false
  - Check builds the base reader with BaseReader from paths.go, which takes the base directory, the base revision and the environment and returns a TreeReader that reads paths relative to the base directory
  - Check builds the commit reader with DirReader from paths.go, which takes a directory string and returns a TreeReader, from the counterpart of the base directory in the exported tree and not from the exported root
  - Check computes the class map of each exported tree with Classes from classes.go, which takes the tree directory, the generators directory and the records directory as strings and returns a class map, a slice of skipped scope path strings and an error
  - The counterpart of the base directory in an exported tree is the exported root joined with the path of Options.Output relative to the git top level
  - Check joins a relative Generators or Records of the Options to the counterpart before passing it to Classes
  - Check re-bases an absolute Generators or Records into the exported tree when it lies under the base directory, and otherwise uses it as given
  - When Classes returns an error, Check uses a nil class map for that tree
  - Check computes the commit class map for every commit that has a base, a tag and a finding
  - Check computes the base class map additionally only when some tag of the commit has a version
  - Check calls Regeneration from regen.go, which takes the Classified value, the base reader, the commit reader and the commit class map and returns a bool
  - Check reads the record file of each tag's record, at the path formed by the RecordsDir of the PathConfig, which is the config's dir relative to the base directory, a slash, the id and `.yml`, through the commit reader, and not by the Options.Records value
  - Check decodes the file bytes with Decode from github.com/livecodelife/provenance/record, which takes the bytes and returns a pointer to a Record and an error
  - The Version field of that Record is an int
  - The sedum module's requirements already include the provenance module
  - Check builds a map from record id string to Version int
  - A record that cannot be read or decoded is absent from the version map
  - Check calls Migration from migrate.go, which takes the Classified value, the base reader, the commit reader, the base class map, the commit class map, the Tag and the version map and returns a bool and an owner set as a map from record id string to bool
  - For each unwaived finding and each tag, Check asks Allowed from finding.go, which takes the proof name, the Finding and the tag's record id and returns a bool
  - The proof name given to Allowed is `regeneration` or `migration`
  - Check counts each distinct skipped scope path once over exactly those Classes calls
  - Check passes to Merge from sarif.go only the Log values and, for each log, the justification strings aligned with the order of its Results, empty for an unwaived result
  - Check writes the output with WriteSARIF or WriteHuman from output.go, according to the Format of the Options
  - Check returns the count of unwaived findings in the Outcome
  - This file imports io, os and strings from the Go standard library as values
  - This file imports github.com/livecodelife/provenance/record as a value
