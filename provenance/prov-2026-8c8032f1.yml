id: prov-2026-8c8032f1
title: sedum evidence reports and refreshes the freshness of each record's code
type: blueprint
status: open
version: 3
reason: refresh the spec hash after the superseded test was removed
created_at: "2026-10-27"
author: calebcowen@gmail.com
intent: The code of each record should be checked for freshness against the evidence kept for it, by a command that reports the verdicts and appends new evidence on request, with no model and no network.
constraints:
  - sedum evidence is registered on the root command
  - 'sedum evidence reports, for each record, one verdict about its code: fresh, stale, none, unknown or no regions'
  - sedum evidence keeps each record's code freshness evidence in a file of its own under the output directory
  - The evidence directory is not ignored by the project's .gitignore, although the rest of the .sedum directory is, so that evidence files can be committed
  - A record's verdict is judged from the latest evidence entry for the record's current version and the code hash of its regions now
  - The verdict is fresh when that entry's code hash equals the current code hash
  - The verdict is stale when that entry's code hash differs from the current code hash
  - The verdict is none when no entry exists for the record's current version, so an entry made for an earlier version is not evidence for the current one
  - The verdict is unknown when an owned region of the record has no gen hash or no pkg hash
  - The verdict is no regions when the record has no owned region, because there is nothing to track
  - When more than one verdict could apply, no regions wins over unknown, unknown over none, and none over fresh or stale
  - The code hash of a record is the provenance library's evidence code hash of its owned regions (HASHING.md section 7)
  - Regions are read from the markers under the output directory the way sedum regions reads them
  - A marker naming an alias is counted under the surviving record
  - The version of a record is read from its record file in the records directory
  - A deprecated record is not reported, and its regions are ignored
  - A record file that cannot be decoded is an error that names the record
  - Regions that name a record with no record file are skipped, not an error
  - A skipped record has no line in the report
  - A skipped record has no entry appended by --refresh
  - In text mode one line for each skipped record is printed before the report
  - The line for a skipped record starts with the word skipped
  - The word skipped is followed by the record id as the marker gives it
  - The line for a skipped record names the files that hold its regions
  - The lines for skipped records are in ascending order of the record id
  - The files in a line are in ascending order
  - Each file is named once in a line
  - The line for a skipped record is written to standard output
  - A usage or read error prints no line for a skipped record
  - With --json no line names a skipped record
  - Skipped regions do not change the exit code
  - With --record no line names a record other than the selected one
  - A record named with --record that has no record file is an error with exit code 2
  - A deprecated record named with --record is an error with exit code 2
  - Without --refresh sedum evidence only reads
  - Without --refresh sedum evidence writes nothing
  - sedum evidence calls no model and uses no network
  - --refresh appends one entry to the evidence file of each selected record whose verdict is stale or none and whose code hash is known
  - --refresh appends nothing for a record whose verdict is fresh, unknown or no regions
  - --refresh writes no file other than the evidence files it appends to
  - After --refresh the report shows the verdicts the records have once the entries are appended
  - Each evidence entry says which record version it covers, which code hash it saw, and when and by what it was written
  - 'Evidence files are append-only: an existing entry is never rewritten, removed or reordered'
  - With no --record the report has one line per record
  - --record narrows the report to one record
  - With --json the report is printed as a JSON document
  - The process exit code is 0 when no selected record is stale or unknown, 1 when one is, and 2 for a usage or read error
  - Nothing is appended and the report is not printed when a usage or read error is found
  - The .gitignore negation line for the evidence directory is a hand edit of .gitignore made with this command, outside any generator
