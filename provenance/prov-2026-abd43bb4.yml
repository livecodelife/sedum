id: prov-2026-abd43bb4
title: The response envelope is an object, and lenient decoding has a limit
status: superseded
created_at: "2026-08-14"
author: calebcowen@gmail.com
intent: |
  The PRD says the model returns "a JSON array of {action, kwargs} objects".
  Sedum asks for an object wrapping that array - {"invocations": [...]} - and
  accepts a bare array as well. This records why the wire shape differs from the
  sentence, and where the tolerance stops.

  The reason is that an object is the shape every structured-output mechanism
  in this ecosystem is built around: json_schema and json_object alike require
  the document's root to be an object, so an array root is the one shape that
  can never be constrained or validated by a server. Sedum does not in fact ask
  a server to constrain anything - [[prov-2026-4bcabb2f]] records why - but the
  envelope is what a caller would reach for the moment it wanted to, and
  choosing the shape that forecloses that would be a gratuitous cost.

  There is a plainer reason too. An object leaves room to add a key later
  without changing what an array of invocations means, and a model that has been
  asked for a named field returns a named field more reliably than one asked for
  a bare document.

  A bare array is still accepted, for a reason worth stating: the PRD names it,
  and a model given a catalog and told to return invocations frequently returns
  the array on its own. Rejecting a response that is exactly what the document
  describes would spend a retry on a difference of one nesting level that costs
  nothing to absorb.

  The tolerance is in the decoder and nowhere else. Two envelope shapes and a
  fenced code block are unwrapped before decoding, because a fence is a
  formatting habit rather than a claim about content. After that, every
  invocation faces exactly the checks every other one does. There is no shape
  the decoder repairs, no field it infers, and no key it drops.

  That last part is the constraint the brief already states: anything the model
  returns outside the declared schema is rejected, never interpreted. An
  invocation carrying a key beyond action and kwargs is a violation naming the
  key - notably the "reason" or "explanation" field models like to add. It would
  be easy to ignore it, and ignoring it is the wrong shape of tolerance: an
  unknown key is the one signal that the model has understood the task
  differently than the catalog describes it, and the retry loop exists to say so
  in one cheap call.
constraints:
  - >-
    The request asks for {"invocations": [...]} so that json_object response
    formatting can constrain it. The decoder also accepts a bare array, since
    that is the shape the PRD describes and models frequently emit.
  - >-
    Unwrapping is limited to a surrounding code fence and the two envelope
    shapes. Anything else is a re-promptable violation quoting what was received,
    never a shape the decoder repairs.
  - >-
    An invocation carrying a key other than action and kwargs is rejected,
    naming the key. Ignoring an unrecognised key would discard the clearest
    signal that the model has misread the task.
  - >-
    Leniency lives in decoding only. Once an invocation is decoded, no check is
    relaxed for the shape it arrived in - a bare array and an enveloped one are
    validated identically.
