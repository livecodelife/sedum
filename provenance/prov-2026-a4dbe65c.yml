id: prov-2026-a4dbe65c
title: 'The baseline arm: what the same model and the same record produce without Sedum'
status: implemented
version: 2
reason: |-
  A baseline sample's files are stored in its entry, contents and all. Anchor
  fill and idempotency stop being stored for an arm that cannot have them.

  ## Found by the first run

  todo-rails-baseline at coarse, five samples on the 14B: all five valid, all
  five writing every authorized path, all parsing as Ruby, and none working -
  identical checks_failed at five of twenty assertions, the same fifteen failing
  in every sample.

  Asking why produced the defect. The entry carries counts, syntax and
  behaviour, and nothing that says what the model actually wrote. The samples
  ran in temporary directories the harness removes, so by the time the number
  was read the source that produced it was gone. The cause was worked out from a
  separate hand-run probe on a different model row, and "a different row probably
  did the same thing" is exactly the inference a stored answer exists to make
  unnecessary.

  [[prov-2026-2256e6fa]] settled this for the other arm and its reasoning
  transfers without modification: storing what a sample bound makes an entry
  re-scorable, "instead of re-drawing two arms at eighty minutes a pair every
  time a question is sharpened". The sedum arm's answer is the invocation list.
  The baseline arm's answer is the source, and [[prov-2026-a4dbe65c]] shipped
  the arm without storing it.

  ## What the missing data cost, concretely

  The fifteen failing assertions all follow from one line. The baseline wrote
  `params.require(:todo).permit(:title, :completed)` and the harness posts a
  bare JSON body, so every request carrying one 400s or 422s. Whether all five
  stored samples did that is not answerable from the entry - only from a probe
  that was run separately, against mlx rather than llama.cpp.

  That question is worth answering rather than assuming, because it decides
  whether the run measured the model or measured a convention the record leaves
  open. It is left open here deliberately: this record makes the next run
  answerable and does not re-litigate the first.

  ## Fill and idempotency stop being written

  A baseline has no package and no invocation list, so both are undefined for
  it. [[prov-2026-a4dbe65c]] made the report decline to print them and left
  NewEntry storing them zero-valued, which is the same mistake one layer down: a
  reader with the file rather than the report sees planted zero, filled zero and
  cannot tell that from a run where nothing was planted.

  Syntactic validity stays, because a file is a file whoever wrote it.
reason_kind: fix
created_at: "2026-08-18"
author: calebcowen@gmail.com
aliases:
