intent: "The wiring of the grow log into `sedum grow` (prov-2026-7a13f569), the hand-written part: it edits existing hand-written files, so it is not grown. (1) internal/cli/config.go: GrowConfig gains three fields beside LogPath: `GrowLogPath string`, `NoGrowLog bool`, `GrowLogSkips bool`. (2) internal/cli/root.go: the const block gains `defaultGrowLogPath = \".sedum/grow.jsonl\"` beside defaultLogPath, and the root command registers `newGrowLogCommand()` with the other subcommands. (3) internal/cli/grow.go: the flags `--grow-log <path>` (string, default defaultGrowLogPath, \"Persistent grow log location.\"), `--no-grow-log` (bool, \"Do not append to the grow log.\") and `--grow-log-skips` (bool, \"Also log records skipped as current.\"); in runGrow, `started := time.Now()` just before pipeline.Run and, right after it and before the err check, the single call `writeGrowLog(errOut, cfg, result, err, started)`. The functions newGrowLogCommand and writeGrowLog are grown by the imprints \"cli: the grow log wiring\" and \"cli: the sedum grow-log command\".\nTests: the NEW file internal/cli/growlog_flags_test.go (package cli; no imports beyond testing), the imprint's spec, grown from this exact text: \nfunc TestGrowLogFlags(t *testing.T) {\n\tassertFlags(t, \"grow\", []flagSpec{\n\t\t{\"grow-log\", \"\", \"string\", defaultGrowLogPath},\n\t\t{\"no-grow-log\", \"\", \"bool\", \"false\"},\n\t\t{\"grow-log-skips\", \"\", \"bool\", \"false\"},\n\t})\n}\nfunc TestGrowLogCommandRegistered(t *testing.T) {\n\tfindCommand(t, \"grow-log\")\n}"
