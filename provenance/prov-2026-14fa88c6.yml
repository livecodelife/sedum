id: prov-2026-14fa88c6
title: The chi fixture plants its imports anchor inside the import block
status: implemented
version: 1
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: |
  Finding F1 from migrate-dry's lifecycle testbed (2026-10-15): the chi
  reference fixture's handler template plants its imports anchor at file
  scope, outside any import block, so addImport's quoted path lands as a bare
  string at the top level and the generated Go does not compile. The eval
  fixtures under evals/testdata already plant it inside `import ( )`; this
  brings testdata/generators/chi in line, since it is the Go example a package
  author copies (prov-cli's cobra package was warned off it). Asked for by
  provisio-mgr in #provisio as a small imprint under prov-2026-cc73cf61.
constraints:
  - The anchor sits inside an `import ( )` block, which is valid Go with nothing in it, so a handler with no imports still compiles.
  - Nothing else in the fixture changes.
affected_scope:
  - testdata/generators/chi/**
  - internal/catalog/*_test.go
  - internal/selection/*_test.go
