id: prov-2026-c637c262
title: Replay can restamp gen and reconcile a complete recording
type: blueprint
status: open
version: 1
reason: ""
created_at: "2026-10-16"
author: calebcowen@gmail.com
intent: |
  Two gaps in `sedum grow --execute` found by migrate-dry's lifecycle testbed (step 14) and prov-cli's 88-region report (#provisio, 2026-10-16). Both are fixed with sedum's own checks and never by editing a hash.

  ## 1. --restamp-gen
  A recording carries the gen of the record version it was selected from (b9298192). After the record is edited, replaying that recording stamps the OLD gen, so `--check` keeps calling the region stale, and the only way out was a model regrow. `grow --execute <recording> --records <dir> --restamp-gen` stamps each named record's CURRENT gen instead of the recorded one. It is an explicit assertion, like `--stamp`: the person says the recorded selection still satisfies the edited record.
  - Needs --records; without it, an error (there is no current gen to take).
  - Guarded by checks that already run: every recorded invocation is validated against the current packages, and every path against the current record's affected_scope and forbidden_scope. A failing check is the same terminal error as today, so a restamp never papers over a selection that no longer fits.
  - A record the recording names that is missing or deprecated is not restamped; it is reported and its regions are written with the recorded gen as today.
  - Report: one line per record, `restamped <id>: gen <old8> -> <new8>`, also in the run log. Without the flag nothing changes.

  ## 2. Complete recordings reconcile
  Replay never prunes (375f5d4a): a recording may be partial. So after a kwargs edit that changes an identity kwarg (get -> post), replay writes the new region and leaves the old one beside it, owned by a live record, neither orphan nor stale.
  - `--record` re-selects every record, so a recording it writes WITHOUT --only is complete. The recording gets a top-level `"complete": true` (additive; omitted otherwise; older recordings and every foreign writer read as partial).
  - Replaying a complete recording reconciles the records it names, like grow: their owned regions the recording no longer selects are pruned in the same all-or-nothing write, in files the recording covers only. Records not named are untouched.
  - Replaying a partial recording prunes nothing and reports each such region as `unselected <path> <action> (record <id>)`, with a one-line count, so the leftover is visible.
  - Both behaviours respect --dry-run.

  ## 3. --check verifies both
  `grow --execute <recording> --check` is a dry replay that writes nothing and exits non-zero when replaying would change anything: a stale gen (with or without --restamp-gen, so a restamp is verified by running the same command with the flag) or an unselected/stray region of a record the recording covers. A clean exit means the tree already is what the recording produces. The existing `--check` without --execute is unchanged.

  ## Not in scope
  Evidence: a completed record whose code moved stays stale [code] until prov-cli's `evidence refresh`. Replay with an edited recording needs nothing new.

  ## Generate first
  internal/pipeline/restamp.go (restampGen, reconcile-by-recording helpers) and its tests are grown by sedum-haiku via the go package. The thin wiring in recording.go, replay.go, grow.go, config.go, flags_test.go and the README/PRD flag tables is handwritten, because these files are not region-owned.
