id: prov-2026-8602b702
title: 'sedum grow --prior-recording shows the model its own earlier selections on a retry'
status: open
version: 2
reason: Spec file edited under prov-2026-3f83335f; refresh its hash
created_at: "2026-10-06"
author: calebcowen@gmail.com
intent: |
  sedum grow gains --prior-recording <path>. The invocations from an earlier
  recording, for the records in this run, are added to the Phase 4 prompt so a
  retry driven from above Sedum sees what it chose last time. It builds on
  [[prov-2026-e4bab53b]]: the prior selections go in the same supplementary
  section, beside any --prompt text, with the same standing - advisory, after
  the record's intent and constraints, unable to widen authorization.

  The recording is context only. This does not replay: the model is still
  called, its output still goes through the same Phase 4 and Phase 5
  validation, and nothing in the prior recording is executed or trusted.
  Replay (--execute) is the mechanism for running a recording and stays
  separate; the two are not combined and --prior-recording is ignored under
  --execute.

  Only invocations whose record_id is in this run are included, so --only
  narrows the context as it narrows the run. The context is bounded at 8 KiB
  per record, with an error on overflow rather than truncation, for the reason
  record 1 gives. A missing, unreadable or malformed recording is an error
  before any phase runs, since a retry run that silently lacked its context
  would look like a normal run.

  Rerun idempotency through ownership markers is unchanged.

  Open question for the implementer: what grow does to files already written
  when a later run replaces them is not settled here. Check how injection
  treats an existing marker-owned region and state it, in the code and the
  README, rather than assuming prior output is overwritten cleanly.
constraints:
  - >-
    Builds on prov-2026-e4bab53b's supplementary prompt section. Prior
    selections share it and inherit its rule: advisory, never widening
    affected_scope or path authorization.
  - >-
    Only invocations for records selected in this run are included. A prior
    recording with none of them adds nothing and is not an error.
  - >-
    A missing, unreadable, non-JSON or empty-of-records prior recording is a
    clear error naming the path, raised before any phase runs. The recording
    has no schema version and sedum_version is not consulted for
    compatibility anywhere today, so no version check is added; the
    implementer states this in the error handling.
  - >-
    Ignored under --execute and listed in the ignored-flags notice.
  - >-
    The run does not replay anything and validation is not changed. The model
    is called and its output validated as before.
  - >-
    Context is bounded at 8192 bytes of serialized invocations per record. Over
    that is a clear error, not truncation.
  - >-
    Rerun idempotency via ownership markers is unchanged.
  - >-
    The prior recording's own supplementary prompt field is not fed back in.
