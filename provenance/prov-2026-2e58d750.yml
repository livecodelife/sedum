id: prov-2026-2e58d750
title: The conformance corpora cover marker v2 and the two hashes
type: blueprint
status: implemented
version: 1
reason: ""
created_at: "2026-10-26"
author: calebcowen@gmail.com
intent: A tool that does not link Sedum should be able to check that it reads and writes v2 markers and computes both hashes the way Sedum does.
constraints:
  - conformance/markers/v2cases.json holds the v2 marker cases
  - conformance/kwargshash/cases.json holds kwargs hash cases
  - conformance/kwargshash/cases.json holds body hash cases
  - conformance/README.md lists conformance/markers/v2cases.json and its case kinds
  - conformance/README.md lists conformance/kwargshash/cases.json and its case kinds, kwargs and body
  - conformance/README.md says the cases in v2cases.json carry no decision field
affected_scope:
  - conformance/markers/v2cases.json
  - conformance/kwargshash/cases.json
  - conformance/README.md
  - internal/inject/markerv2_conformance_test.go
  - internal/inject/kwargshash_conformance_test.go
forbidden_scope: []
related: []
sealed_at_sha: 786f18aa0fe71bc0f5c0880655b72e4ffabd32a1
associated_specs:
  - path: internal/inject/markerv2_conformance_test.go
    run_command: go test ./internal/inject/ -run '^TestMarkerV2Conformance$' -count=1
  - path: internal/inject/kwargshash_conformance_test.go
    run_command: go test ./internal/inject/ -run '^TestKwargsHash(Conformance|CorpusShowsWhatItIsFor)$' -count=1
