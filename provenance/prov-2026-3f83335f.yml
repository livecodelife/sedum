id: prov-2026-3f83335f
title: grow collapses orphan output to a one-line summary; --orphans lists them
type: blueprint
status: implemented
version: 4
reason: 'scope: the proof script and the lifecycle harness count per-region orphan lines, so they pass --orphans; 3c35801c''s spec (capture.sh) is refreshed in the same commit'
created_at: "2026-10-16"
author: calebcowen@gmail.com
intent: |-
  provisio-mgr (#provisio, 2026-10-16), from sedum-grow's run notes: `sedum grow` prints one `orphan` line per orphan region. On a repo that carries vendored corpora (internal/syntax/testdata/provenance-cli-*), that is thousands of lines that bury the real output. Collapse them to a summary, and keep the full list behind a flag.

  ## Behaviour
  - By default grow, and `grow --check`, print one block instead of the per-region lines: `N orphan region(s) in M file(s) from K gone or deprecated record(s); top directories: dir (n), dir (n), dir (n)`, up to the top 3 directories by region count (ties by path), followed by `  --orphans lists them`. Nothing is printed when there are none, as today.
  - `--prune-orphans` reports the same way: `pruned N orphan region(s) in M file(s) ...`; regions left alone because no current record authorizes the file are counted on their own line (`N left alone: no current record authorizes the file`), so the summary never hides that pruning skipped anything.
  - A new `--orphans` flag prints today's full list, unchanged, in addition to nothing else: summary replaced by the list.
  - --check still fails on any orphan, and `--json` is untouched (the sedum.grow/1 report keeps every orphan; machines want the whole list).
  - Directory attribution: the directory of the file, relative to the output root, whole path (not collapsed to the first segment), so `internal/syntax/testdata/provenance-cli-658d54b (412)` names the real culprit.

  ## exclude_paths
  Sedum has no exclude_paths (that is the provenance CLI's config), and the orphan walk already skips hidden directories and the generators and records directories (prov-2026-fc05416c). Adding a Sedum-side exclude is out of scope here; the summary's top directories tell a reader what to exclude or prune.

  ## Docs
  README gains a short section for outside users: keep escape-heavy literals (many backslashes, quotes, exotic characters like U+2028) out of intents because models mangle them (use raw strings or Go escapes, or check an exact-bytes corpus into a file); a generator package vendored inside a Go repo (generators/go) needs its own go.mod, or `go build ./...` compiles the templates. Plus the new `--orphans` flag in the CLI table.

  ## Generate first
  New file internal/cli/orphans.go is grown with sedum-haiku through the go package (printOrphans replaced, plus summary helpers), with its tests in internal/cli/orphans_test.go. The few lines that cannot be grown are handwritten and posted with a reason: grow.go (delete the old printOrphans, thread a `listOrphans bool` through report() and the --check call, register the flag) and config.go (the field). README is documentation.
