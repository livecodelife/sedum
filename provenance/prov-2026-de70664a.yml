id: prov-2026-de70664a
title: 'Version 0.14.0: gen_hash covers a record''s shape'
type: blueprint
status: implemented
version: 1
reason: ""
created_at: "2026-11-21"
author: lcl-graft-render@users.noreply.github.com
intent: sedum reads a record's optional shape and includes it in the record's gen_hash, so a marker's gen equals the gen_hash graft and every other tool computes. The shared provenance library defines the hash (provenance dbb6d0d); sedum's genhash.Input gains Shape and the record reader fills it from the decoded record. The version constant becomes 0.14.0 with a CHANGELOG entry; the tag is pushed by the maintainer, not here.
constraints:
  - A record with no shape, or an empty one, has exactly the gen it had in 0.13.0, so no marker moves. A golden test pins the 0.13.0 gen of every record in sedum's own provenance directory and eval fixtures.
  - A record with a shape has the library's gen_hash for its four fields and its shape, read through the same decode as every other field; shape is one of the keys the record projection keeps.
  - A malformed shape is the library's error at load.
