id: prov-2026-4c49ca46
title: Phase 3 reconciles an existing file with its template, or halts
status: open
created_at: "2026-08-19"
author: calebcowen@gmail.com
intent: |
  Phase 3 stops treating an existing file as a thing to verify and starts
  treating it as a thing to reconcile. A file that already exists is compared
  against its rendered template, and either every difference is something the
  template adds - in which case those additions are written into the file - or
  the run halts naming the file and the first line it could not reconcile.

  Two outcomes replace today's two. Not five, and not a mode flag: the same
  comparison answers the empty file, the file a person wrote, the file an
  earlier run generated, and the file whose template has since grown.

  ## What is wrong today

  Phase 3 is create-if-absent, and an existing file is checked for the markers
  its template declares. A file missing them is a hard error whose message
  offers two diagnoses - "something other than Sedum wrote it, or the template
  changed shape after it was generated" - and both of them describe situations
  Sedum could handle and instead refuses.

  Three of them were run against the real binary before this record was written:

    - A zero-byte authorized file halts. Both offered diagnoses are false, and
      an empty file has nothing to destroy, which is the whole reason Phase 3
      is create-if-absent in the first place.
    - A file generated by an earlier run halts as soon as its template gains an
      anchor. There is no way to bring already-generated files up to a template
      that grew, which makes a package author's anchor vocabulary effectively
      frozen after first use.
    - The routes file `rails new` writes halts, which is why
      [[prov-2026-ee1b3e46]] has the eval harness plant that marker by hand, in
      Ruby, in a target script. That record says out loud that it is standing in
      for something unbuilt and does not settle where it belongs.

  ## The mechanism

  A file decomposes exactly, because regions are delimited:

    skeleton = the file with every marked region removed

  A file with no markers is its own skeleton. An empty file has an empty one.
  For a file an earlier run generated, the skeleton is the template as it was
  rendered then.

  The skeleton is aligned against the newly rendered template on **structural**
  lines: a line is structural unless it is blank or a plain comment. A marker is
  structural, because it is the thing being planted. The only input this needs
  is comment_prefix, which the package already declares - so the comparison
  stays a string operation and no target knowledge enters Phase 3.

  If every difference is an insertion, each gap is written into the file as the
  whole template slice - comments, blanks and all. Anything else halts.

  ## Why the whole slice rather than the markers alone

  An earlier draft of this idea inserted only marker lines, on the reasoning
  that a comment is inert in every target language and anything else is code.
  That is the bound OPEN_QUESTIONS section 3 proposed, and it does not survive
  contact with what a template is.

  A file template is the boilerplate a package author wants every time. When
  their controller template carries a private section, the private keyword is
  not an obstacle standing next to the anchor - it is the thing they declared.
  A rule that plants the anchor and refuses the keyword produces a file where
  every private method later injected lands in the public part of the class,
  which is worse than either applying the template or refusing it.

  So the unit is the template, and the outcome is all of it or none of it.

  ## What was measured

  Every case below was run. The Rails inputs are authentic: a
  `rails _7.2.3_ new --api` scaffold, and controller bodies rendered from
  railties' own controller.rb.tt rather than reconstructed.

  | input | outcome |
  |---|---|
  | file carrying every marker | nothing to do |
  | zero-byte file | the whole template is written |
  | `rails new` config/routes.rb | blank + marker inserted; byte-identical to what ee1b3e46 plants by hand |
  | `rails generate controller Todos` | the whole template body inserted; byte-identical to the rendered template |
  | `rails generate controller Todos index show` | halt: replace at file line 2, replace at file line 5 |
  | `rails new` application_controller.rb | halt: replace at file line 1 |
  | generated file, template gained an anchor and a private keyword | both inserted, below the existing region |
  | generated file, template gained a bare anchor | inserted in place |
  | generated file whose boilerplate was hand-edited | halt: replace at skeleton line 1 |
  | a _default template, which is one marker and nothing else | halt |

  The bare `rails generate` case and the one with actions are the pair worth
  keeping. An empty generated controller adopts perfectly. One carrying
  hand-written `def index` does not, and should not: those methods are exactly
  what createControllerMethod injects into the actions region, and whether they
  ought to become owned regions is a question Sedum cannot answer and must not
  guess at.

  ## Two mechanisms that were tried and rejected

  Both are recorded because they are what a later implementer would reach for.

  **Three-way merge.** base as the template with markers stripped, ours as the
  file, theirs as the template. `git merge-file` conflicts on the routes file:
  the scaffold's trailing comments and the template's marker are edits to the
  same region of base, so diff3 must refuse, and the motivating case fails.

  **Fuzzy patch application.** `diff -U3 | patch -F1` applies - and puts the
  marker in the wrong place, before the scaffold's trailing comments rather than
  before the closing `end`. Fuzz works by dropping context lines from the ends
  of a hunk, which for a trailing anchor discards the very line that defines the
  site. It then anchored on the leading context instead. In Ruby the
  misplacement is inert because what it jumped over is comments; in a language
  where trailing content is not, it writes a broken file.

  The general finding: **fuzz is the knob that converts a refusal into a guess**,
  and this design has no use for one. No library is needed either. What is left
  is a diff over exact line comparison with one constraint on the edit script.

  ## Where adopt went

  OPEN_QUESTIONS section 3 named `adopt` as a command, and TOOL_BOUNDARIES
  section 8 has carried "where `adopt` lives" as an open question on the grounds
  that marker-writing is Sedum's competence while updating an existing
  repository is a caller's territory.

  The question dissolves. The automatable part is not a command at all - it is
  what Phase 3 does when a file is already there. What remains after a halt is a
  person or a tool above Sedum deciding how to reconcile a file Sedum declined
  to guess at, and that is a handoff rather than a command, so nothing has to
  own it.

  This also removes the reason ee1b3e46's harness plants a marker in Ruby, and
  the loudly-failing branch beside it for any other pre-existing authorized
  path.

  ## What it costs

  **Adoption can change behavior.** Adopting a bare `rails generate` controller
  adds a rescue_from handler the team did not write. That is what applying the
  whole template means and it is the package author's declared standard, but it
  is not something to do quietly: what was written into each file is reported.

  **Growth and shrinkage are indistinguishable.** An insertions-only edit script
  cannot tell "the template gained a line" from "someone deleted one", so this
  restores anything removed from a file's boilerplate, including a deleted
  anchor. That is accepted rather than worked around: the operation is bringing
  a file's skeleton back to its template, and it happens to enforce the
  foreign-writer rule against removing a planted marker. Telling the two apart
  would need a file-level record of the template at generation time, and nothing
  carries one - regions carry a record and kwargs, and there is no file-level
  marker to hang a digest on. Adding one for this is not worth it.

  **A comment-only template addition never propagates.** A template that gains
  `//go:build integration` and nothing structural with it has no insertion for
  that comment to belong to. Known, accepted, and written down so it is not
  discovered as a defect. A leading comment run before the first structural line
  could be special-cased if it turns out to matter.
constraints:
  - >-
    Insertions only. If the edit script from skeleton to rendered template
    carries any replacement or deletion, the run halts naming the file and the
    first line it could not reconcile. There is no partial application: a file
    takes its whole template or none of it.
  - >-
    Alignment is over structural lines - not blank, not a plain comment - and a
    marker is structural. comment_prefix is the only input, and it is already
    declared by the package, so no target knowledge enters Phase 3 and no line
    is parsed.
  - >-
    Lines are compared with their indentation intact. This is what lets a bare
    `end` match a class's closing line rather than a nested block's, and
    normalizing whitespace before comparison would silently break placement
    rather than fail.
  - >-
    The skeleton is the file with every marked region removed, and an insertion
    that follows a skeleton line is written after the region that line owns. A
    new private keyword must land below the methods already injected above it,
    not between an anchor and its own region.
  - >-
    The comparison is against the rendered template, never the template source.
    A pattern like {{name|constantize}} matches nothing in a real file, and
    Phase 3 already has the rendered text at the point the decision is made.
  - >-
    No fuzz, no thresholds, no match distance, and no tunable that trades
    correctness for success rate. Three-way merge and fuzzy patch application
    were both measured and both rejected - the first refuses the motivating
    case, the second accepts it in the wrong place.
  - >-
    No new dependency. The rule is a diff over exact line comparison plus one
    constraint on the edit script.
  - >-
    What was written into each existing file is reported. Applying a whole
    template can add behavior a team did not write, and a team adopting Sedum
    into a repository must be able to read what it did rather than discover it.
  - >-
    Restoring a line deleted from a file's boilerplate is accepted behavior, not
    a defect. An insertions-only edit script cannot distinguish template growth
    from file shrinkage, and no file-level record of the template exists to tell
    them apart.
  - >-
    A halt is per run, not per file. A file that cannot be reconciled stops the
    run rather than being skipped, because a skipped file fails later in Phase 7
    with a worse message than Phase 3 can give.
  - >-
    No durable artifact changes shape. Markers and recordings are untouched, and
    a repository whose files already carry their markers behaves exactly as it
    does today.
