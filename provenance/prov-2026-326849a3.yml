intent: '0.9.2 -> 0.10.0: minor. Adds `sedum check` (runs provenance check per commit and waives only violations it can prove are its own pure regenerations or pure marker migrations; exit 0/1/2), `sedum init`, `sedum hooks install` (sedum''s own commit-msg and pre-push hooks), and `sedum evidence` (committable .sedum/evidence/ code-freshness files); `grow --check` skips scope paths no package claims. These let provenance drop all knowledge of Sedum in its next release. See CHANGELOG.md.'
