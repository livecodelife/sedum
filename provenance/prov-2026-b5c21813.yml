id: prov-2026-b5c21813
title: grow --repair feeds project verification failures back to the model
type: blueprint
status: open
version: 7
reason: 'Make verify shell and process-kill behaviour platform-neutral and add Windows: sh -c when sh is on PATH else cmd /C, whole-tree termination on timeout/cancel, compile-time platform selection, a cgo-free windows/amd64 build must succeed; records the new shared, Unix, Windows and cross-build verify tests as proof. Re-applied on top of upstream v6 after the v2 marker migration'
created_at: "2026-10-16"
author: calebcowen@gmail.com
intent: |-
  provisio-mgr (#provisio, 2026-10-16), from Caleb's bounded-retry idea: a model answer can pass every check sedum has and still not compile, fail a test or fail lint. Today that is found afterwards, by a person or a hook. Let a project name its own verification commands, run them against what the model's selection would write, and feed a failure back to the model, within a small hard bound.

  ## What exists, so this does not duplicate it
  `--retries` (default 3) already re-prompts Phase 5 rejections: schema, anchor, variant, scope and the built-in syntax checker (go/format) for packages with `syntax:`. It stays as is and keeps its own budget. This adds a second, separate budget for failures only a project's own tools can see.

  ## Configuration
  Sedum has no project-level config today (sedum.yaml belongs to a generator package). A project config is added: `<output>/.sedum/config.yml`, read when present:

      verify:                  # shell commands, run in the scratch root, in order; all must exit 0
        - go build ./...
        - go vet ./internal/...
      verify_timeout: 120s     # per command; default 120s

  `.sedum/config.yml` is un-ignored in .gitignore like context.md. `--verify <cmd>` (repeatable) adds commands for one run, and `--no-verify` skips verification for one run (it cannot be combined with `--verify`), after the config's. Nothing configured means no verification and today's behaviour exactly. Generator packages never contribute commands: running a third-party package's commands is arbitrary code execution, and the person who owns the project owns the commands.

  ## The loop
  `grow --repair N` (default 1, hard cap 3, N above 3 is an error; 0 means verify once and fail fast, with no repair). Per record, after Phase 5 accepts a selection:
  1. Build the candidate with inject.Preview (the files Phase 7 would write; no disk writes).
  2. Copy the output tree to a scratch directory (skipping hidden directories and the generators and records directories, as the orphan walk does), overlay the candidate, run each verify command there through the platform shell (see Platforms), `cwd` the scratch root, the timeout above, stdout+stderr captured.
  3. All pass: the selection is accepted as today. Any fails: with attempts left, the conversation gets the assistant's answer and a user message `These checks failed after applying your selection:` plus, per failing command, `$ <cmd>`, its exit status and the last 4000 bytes of output; the model is called again. The scratch directory is always removed.
  4. Out of attempts: the run fails naming the record, the command and its output and the model calls it spent, counting answers Phase 5 rejected as well as repairs, and writes no generated region (Phase 7 never ran for any record). A repair attempt is one extra model call, but the total can be higher: a Phase 5 rejection of a repaired answer spends a `--retries` re-prompt, and the failure message says so.
  A record whose selection is empty or whose files are all unmanaged is not verified. Records are verified one at a time, in the order they are selected, against the tree plus that record's own candidate; a command that depends on a later record's regions can therefore fail on a record that is fine once the run finishes. That is a known limit of verifying one record at a time, stated here and in the README rather than hidden.

  ## Trust and safety (provisio-mgr's conditions)
  - Commands come only from the project's own `.sedum/config.yml` or `--verify`; never from a generator package. Each command is printed (`verify: <cmd>`) before it runs. The README says plainly that grow in an untrusted checkout executes that file's commands, like a Makefile.
  - Each command runs with the scratch directory as cwd, and a timeout or cancellation stops the whole process tree, not just the shell. On Unix that is `sh -c` in its own process group, killed with SIGKILL to the group. On Windows it is `sh -c` when an `sh` is on PATH (as Git for Windows provides), otherwise `cmd /C`, terminating the command and every process it started.
  - The scratch directory is removed on every exit path: success, failure, timeout, error. A test covers the timeout path.

  ## Observability
  Every attempt is logged: record, attempt number, each command, exit status, duration, the truncated output. The text report prints `record <id>: repaired after N attempt(s)` when a repair was needed. The sedum.grow/1 report gains an additive per-record `repair_attempts` (omitted when 0; conformance/formats updated). Replay (`--execute`), `--check` and `--stamp` ignore verification and say so, like `--retries`.

  ## Platforms
  Sedum builds and runs on windows/amd64 with cgo off. Process start and tree-kill are chosen at compile time, by file name or build constraint, so a Windows build references no Unix-only symbol. `runCommand` stays in verify.go and calls per-platform hooks. Rejected: dropping tree-kill on Windows, because build and test children would outlive a timeout; and always using cmd, because it silently changes the meaning of verify commands for users who have sh.

  ## Not in scope
  Reordering or batching records, running verification at Phase 7 against the final tree (a project's own CI does that), caching, and any command from a generator package. Windows release builds (goreleaser, the CI cross-compile loop, install.sh, the archive format) are separate work.

  ## Generate first
  A new package internal/verify (config load, scratch tree, command runner, failure message) and its tests are grown by sedum-haiku via the go package. The hooks in selection.go (an optional Verify callback in selection.Options and the second budget), pipeline.go, grow.go, config.go, flags_test.go, the format doc and README/PRD are handwritten, because those files are not region-owned.
constraints:
  - A selection that still fails verification after the allowed repairs returns an error that holds the record, the repairs, the model calls, the rejected answers and the prompt and completion tokens spent, so a caller that records cost does not lose it; its message is unchanged.
  - On Unix platforms, a verify command must run as 'sh -c <command>' in the given directory, in its own process group
  - On Unix platforms, a timeout or context cancellation must kill the command's entire process group with SIGKILL, so no descendant of the shell survives
  - On Windows, a verify command must run through 'sh -c <command>' when an executable named sh is found on the PATH
  - On Windows, when no sh is found on the PATH, a verify command must run through 'cmd /C <command>'
  - On Windows, a timeout or context cancellation must terminate the command and every process it started, not only the shell
  - On every platform, a timeout must still report the status 'timed out after <duration>' with the tail of the captured output, and a cancelled context must still return the context's error
  - On every platform, a command that exits non-zero must still be reported as a failure with its exit status and captured output, and one that exits zero as a pass
  - The platform-specific code must be selected at compile time by file name or build constraint, so no Unix-only symbol is referenced when building for Windows
  - The command 'go build ./cmd/sedum' must succeed with GOOS=windows, GOARCH=amd64 and CGO_ENABLED=0
