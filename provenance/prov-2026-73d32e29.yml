id: prov-2026-73d32e29
title: A package can declare anchors completeness never asks about
status: open
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: |
  The go package plants an imports anchor in every file, and most
  declarations need no new import. Phase 5's completeness check
  (prov-2026-6d87dc11) asks the model about every planted anchor its answer
  leaves empty that some action could fill, so every such answer costs one
  extra model call whose right reply is almost always "no change". provisio-mgr
  asked for the fix (#provisio, 2026-10-15): +1 call per record adds up.

  sedum.yaml gains `optional_anchors`: anchor names this package's templates
  plant that completeness never asks about. They are still injection points;
  they are simply not work a file expects. A name no template of the package
  plants is a load error, so the list cannot silently go stale. The go package
  declares `imports` optional; `decls` stays, because a file with no
  declarations is worth a question.
constraints:
  - Optional anchors are skipped by completeness only; injection, ordering and every other rule are unchanged.
  - An optional_anchors entry no file template of the package plants rejects the package at load.
