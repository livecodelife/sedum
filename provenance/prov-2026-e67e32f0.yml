intent: The buildMigrationRecording function builds the recording of one record from the regions migrated for it.
constraints:
  - The function lives in internal/pipeline/migrate.go, package pipeline, and adds no imports
  - The function is unexported, named buildMigrationRecording, and returns a recording.Recording
  - It receives the record id as a string
  - It receives a slice of migratedRegion, the record's migrated regions
  - It receives a pointer to record.Set, the loaded records, in which Lookup(id) returns a pointer to a record.Record whose CreatedAt field is the creation date string and a bool
  - It receives a slice of resolve.File, the resolved files of the run, in which each file's Path, Package, Template, Captures and Unmanaged fields come from its embedded Resolution
  - It receives the owners as a map[string]inject.Owner
  - It receives the run's variables as a map[string]string
  - It receives a pointer to recording.Recording that is nil when the record has no recording file
  - The migrated regions are taken in path then position order
  - When the existing recording is not nil, its files, phases, gen and created_at are kept
  - When the existing recording is not nil, its Regions are kept except those with the same recording.RegionKey as a migrated entry
  - recording.RegionKey receives a path, action and variant as strings and an id map and returns a string
  - When the existing recording is not nil, the migrated entries are added to its Regions
  - Otherwise the recording has SedumVersion recording.Version
  - Otherwise the recording has the variables it received
  - Otherwise the recording has one Record with the record id
  - Otherwise that Record's CreatedAt is the creation date of the record in the record set
  - Otherwise the recording's Packages holds the extensions of the packages of the record's managed files
  - That Record's Gen is the Gen of the marker of the first migrated region, not the record's current gen
  - That Record's Files are the files filesOf, defined in this package, which receives the resolved files and a record id and returns the record's files, gives, skipping any file that is Unmanaged or has no Package
  - Each of those files is given with its path, package name, template and captures
  - That Record's single phase is the phase named recording.DefaultPhase
  - The phase's invocations are what priorFromMarkers, defined in this package, which receives the record id, a slice of inject.OwnedRegion and the owners and returns a slice of recording.Invocation, returns
  - Each inject.OwnedRegion given to priorFromMarkers has the migratedRegion's Path, its Package and its Region as read, with the v1 marker
  - That Record's Regions are the migrated entries
  - Its parameters are, in order, the record id, the migrated regions, the record set, the resolved files, the owners, the variables and the existing recording pointer
