id: prov-2026-66bea9f3
title: Markers carry gen and pkg hashes as first-class attributes
status: open
version: 6
reason: 'Marker v2 records: remove cross-record duplicates and tighten shapes'
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: 'Every region Sedum writes records the two inputs that decide whether it is current. gen is the gen_hash of the record that wrote the region, SHA-256 over the canonical encoding of the record''s intent, constraints, affected_scope and forbidden_scope, computed by internal/genhash. pkg is a hash of what the region was rendered from: the resolved action declaration, its templates, and the package''s transforms and op_exceptions, computed once at package load. pkg is deliberately conservative, so an unrelated transform edit costs a re-render, never a model call. A pkg mismatch alone means re-render with no model call.'
constraints:
  - An absent gen or pkg means unknown and must read as stale to later consumers, never as current.
  - A marker carrying gen or pkg as an unknown key, written by a foreign tool, has it promoted to the declared field on parse and never also re-emitted from Extra.
  - 'Both values use the form sha256: followed by 64 lowercase hex digits.'
  - A composite's regions carry the pkg hash of the child action named on the marker, since that is what re-rendering replays.
  - pkg is deterministic across loads, machines and map iteration order.
  - The encoding of pkg is documented in conformance/ so a harness can compute it without linking Sedum.
  - A region written when neither the recording nor the records supply a gen has no gen
  - 'gen_hash follows DESIGN.md''s canonical encoding exactly: sorted keys, UTF-8 NFC, trimmed and collapsed whitespace, list order kept'
