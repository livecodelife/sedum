id: prov-2026-206fa618
title: The completeness pass asks about anchors Phase 0 knows nothing can fill
status: open
created_at: "2026-08-15"
author: calebcowen@gmail.com
intent: |
  [[prov-2026-6d87dc11]] compares the anchors a run planted against the anchors
  its selections fill, and re-prompts about the difference. It does not ask
  whether the difference is *fillable*, so a package carrying an anchor no action
  targets earns a second model call on every sample, forever, for a question with
  no available answer.

  Sedum already knows better at load time. [[prov-2026-a9e59197]] warns when a
  package's file templates plant a marker no action in that package targets -
  so the same run that reports "nothing can inject there" then asks a model to
  inject there.

  ## Measured

  The chi eval fixture plants four such anchors and, after its record's scope was
  cut to functionality, one survives: init.sql carries both extensions and
  tables, createTable fills tables, and nothing fills extensions. It is not a
  mistake - it is a deliberate extension point for a CREATE EXTENSION a later
  record might want.

  The cost of asking about it anyway, five samples each at commit 3e38d7c:

  | Case | Unfillable anchors | Valid | Wall |
  |---|---|---|---|
  | todo-rails-defined | none | 5/5 | 7m43s |
  | todo-chi-defined | one | 5/5 | 31m03s |

  Chi is four times slower for work of comparable size, and roughly half of that
  is the completeness re-prompt firing on every sample and being declined every
  time. The earlier chi run makes the mechanism visible from the other side: it
  took 17m45s with only 3 of 5 valid, because an invalid sample fails before it
  can earn a re-prompt. **The case gets slower the better the model does**, which
  is the wrong shape for a cost.

  ## The cause is not the package

  Worth saying plainly, because the obvious reading is that the fixture is badly
  authored. It is not. Planting a region a later record will fill is exactly the
  case 6d87dc11 wrote its own "never a hard error" rule for:

    A template may plant a region for an action a later record will fill, or for
    one this change legitimately does not need. A run that refused to proceed
    would make every such template a liability.

  That reasoning is right and is not being revisited. The defect is that having
  correctly decided not to *fail* on such an anchor, the implementation still
  *asks* about it - and asking has a price that recurs.

  ## The fix

  Subtract the statically-unfillable markers from the unfilled set before
  deciding whether to re-prompt. An anchor no action can fill is not an omission
  the model can act on.

  **Fillability is computed across every package the run loaded, not per
  package.** a9e59197's check is package-scoped because it asks an authoring
  question - is this package internally coherent - and that is the right scope
  for a warning. This asks a different question: can anything in this run fill
  this anchor. An action's injects_into renders to a path, and that path resolves
  to a package by extension, so an action in one package can target a file owned
  by another. Scoping the subtraction per package would drop an anchor something
  else could have filled, and [[prov-2026-14c832bf]]'s free targets make that
  more likely rather than less.

  **The subtraction is silent.** An author who wants to know their package has
  dead anchors already gets told at load, by name, with the reason. Repeating it
  per run would be the same warning charged per sample.

  ## Measured after

  Same case, same model, same concurrency, five samples again - entry
  todo-chi-defined at commit a9f97fe, qwen2.5-coder-14b-instruct/llama.cpp-q4_k_m,
  n=5:

  | Commit | Valid | Valid-sample times | Wall |
  |---|---|---|---|
  | 3e38d7c | 5/5 | 527-776s, mean 674s | 31m03s |
  | a9f97fe | 2/5 | 360-468s, mean 414s | 13m34s |

  **The wall figure is not the evidence**, and reading it as one would repeat
  the confound this record already names from the other side: three samples were
  invalid this time, and an invalid sample fails on its first call before it
  could earn a re-prompt, so it is cheap. Halving the wall clock is what a run
  with three cheap samples looks like whether or not anything was fixed.

  The per-sample *valid* times are the evidence. They fall from a 527-776s band
  to a 360-468s one, with no overlap - one model call per valid sample where
  there were two. Nothing else in the run changed, and nothing else could have:
  the first call's prompt is untouched by this record, and the pass it narrows
  runs only after an answer has already validated.

  Validity moving from 5/5 to 2/5 is sampling rather than this change, for the
  same reason. It is the same spread the earlier 3/5 run showed, and it is worth
  saying that five samples of one case measure that case loosely.

  ## What does not change

  An anchor that is fillable and was not filled is still the whole point, and
  the measurement behind it stands: addColumn went from 1 of 6 to 6 of 6 once the
  observation was fed back. This narrows the question rather than the feature.

  Nor does the rule that an unfilled anchor is never a hard error. Both halves
  survive - the model still keeps the judgment, and still gets asked at most once
  about anything it could actually have done.
constraints:
  - >-
    An anchor no action in the run can fill is excluded from the unfilled set
    before any re-prompt decision. It is not an omission the model can act on.
  - >-
    Fillability is computed across every package the run loaded, not per package.
    An action's rendered target may be a file another package owns, and a
    per-package rule would drop anchors something else could fill.
  - >-
    The subtraction is silent at run time. Phase 0 already names every dead
    anchor at load, and repeating it per sample would charge an authoring
    warning by the sample.
  - >-
    An anchor that is fillable and unfilled still produces the observation. This
    narrows which anchors are asked about and changes nothing about what happens
    when one is.
  - >-
    An unfilled anchor remains never a hard error, and the observation is still
    fed back at most once per record.
  - >-
    "An action targets this marker" is defined once, in genpkg, and read by both
    a9e59197's load-time warning and the run-time fillable set. Two copies would
    let the run ask about an anchor load already called dead, which is the exact
    disagreement this record exists to remove.
  - >-
    A package planting an anchor no action fills stays legal. Planting a region
    for a later record is the case prov-2026-6d87dc11's own rule was written for,
    and the defect is asking about it rather than tolerating it.
