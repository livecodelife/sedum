id: prov-2026-ac15ed2b
title: Does a description move the selection rate, and against what baseline
status: implemented
created_at: "2026-08-15"
author: calebcowen@gmail.com
intent: |
  Run the harness twice over one application, once with a generator package whose
  kwargs carry descriptions and once without, and record what the difference was.

  ## Why this is the harness's first job

  [[prov-2026-c5697387]] shipped descriptions on the strength of four hand-observed
  wrong bindings, and the package those were observed on has since been rewritten
  to avoid them - the options string it describes no longer exists. So the feature
  landed with no measurement behind it and no way to get one. It is the least
  verified thing in the repository.

  [[prov-2026-6d87dc11]] has the complementary problem from the other direction. It
  claims enriching the catalog will not fix under-selection, and the one A/B run so
  far covers derived requirements only. Descriptions are the other half of that
  claim and are untested.

  Both records want the same experiment, which is why it is one imprint rather
  than two.

  ## The design

  Two cases over todo-rails, differing in exactly one thing. Everything else -
  model, record, sample size, retries - held fixed, and Compare reports the pair.

  ## Where the described package lives

  Here, as a second package set under `generators/`, derived from the existing
  one by adding description fields and changing nothing else.

  An earlier draft of this record put it in the todo-rails repository instead, on
  the grounds that a package edited only to make an eval look good is a confound
  rather than a fixture. The instinct is right and the remedy was wrong, for
  three reasons.

  The fixtures already do not mirror their projects, by a rule this repository
  wrote down before this record existed: a fixture exists to make a measurement
  mean something rather than to mirror a project, and where those pull apart the
  measurement wins and the deviation is recorded. todo-api's three records are
  condensed here into one, under an id of its own so it does not claim to be the
  original.

  Package *sets* are the mechanism this harness was built around. `generators/`
  holds sets rather than packages precisely so one can be swapped while the
  record is held fixed, which is what makes a comparison mean anything. A
  described set is the intended use of a structure that already exists, not a
  liberty taken with it.

  And the ordering was backwards. Descriptions are a Sedum feature of unknown
  value; changing a real project to adopt them in order to find out whether
  they are worth adopting inverts the question. If the rate moves, todo-rails
  adopts them afterwards under its own record, with a measurement behind it.

  ## What replaces the safeguard

  The confound the earlier draft feared is real: a hand-written second package
  drifts, and a reworded action name or a dropped required flag would make the
  comparison measure something nobody chose. A procedural rule about which
  repository holds the file is a weak guard against that, because it constrains
  the author's location rather than the diff.

  So the guard is mechanical and lives in the default test suite. The described
  set is produced by copying the original and adding description fields, and a
  test diffs the two sets and fails on any difference that is not a description.
  That is the shape TestTheLanguageArmsAreControlled already uses to keep the
  rails and chi arms honest, and it holds whoever edits the package next.

  ## The sample size, fixed before the run

  Thirty per arm, at the fine resolution, per [[prov-2026-3039750e]].

  The rails arm has come in at 4/4 and 5/5 across its whole history, so this is
  the question that taxonomy calls fine: moving a rate that is already at the
  ceiling. At five samples 4/5 is [0.38,0.96] and 5/5 is [0.57,1.00], which
  overlap - a run that size cannot see this effect in either direction, and its
  null result would mean nothing while reading exactly like a finding.

  Both arms are drawn fresh at thirty. The entries already in results/ cannot
  serve as the undescribed arm: every one is five samples or fewer, none states
  a resolution, and all were taken against a dirty tree.

  ## What would make the result mean anything

  A rate is not evidence on its own, and this experiment is small enough to
  mislead in three specific ways worth naming before the numbers arrive:

  The sample is one application, one model, one framework. A difference here is
  a difference there, not a property of descriptions.

  The two packages differ by more than descriptions if the edit is careless. Only
  description fields may be added - not a reworded kwarg name, not a changed
  required flag, not a new variant - or the comparison measures something nobody
  chose.

  A null result is a result. If the rate does not move, that is evidence for
  prov-2026-6d87dc11's central claim and against prov-2026-c5697387's implicit
  one, and it gets recorded exactly as readily as a positive one would. The
  temptation to keep sampling until the number moves is the specific failure this
  constraint exists to prevent.

  ## What it cannot answer

  Selection rate is not correctness. Every wrong binding prov-2026-c5697387 was
  written from produced a *selected* action with a *bad argument* - the catalog
  count would have been perfect in all four cases. So this measures whether
  descriptions help the model pick, and says nothing about whether they help it
  bind, which is what they were added for.

  Measuring the thing they were actually added for needs the rendered output
  checked, and that is deferred with the behavioral half of the harness. Stating
  the gap here rather than letting a green selection rate be mistaken for
  validation of the feature.
constraints:
  - >-
    The two packages differ only by added description fields. No renamed kwarg,
    no changed required flag, no new variant - a second difference makes the
    comparison measure something nobody chose.
  - >-
    Model, record, sample size and retry count are identical across both arms,
    and the reported pair carries all four.
  - >-
    A null result is recorded as readily as a positive one. Sampling does not
    continue until the number moves.
  - >-
    Thirty samples per arm, at the fine resolution, fixed here before the run.
    The rails arm sits at the ceiling, and five samples cannot distinguish 4/5
    from 5/5 in either direction.
  - >-
    Both arms are drawn fresh at that size. The entries already in results/ are
    not the undescribed arm - they are smaller, unlabelled, and were taken
    against a dirty tree.
  - >-
    The described set is derived from the existing one by adding descriptions,
    and a test in the default suite fails on any difference between the two sets
    that is not a description. The guard is the diff, not which repository holds
    the file.
  - >-
    This measures selection, not binding. Every wrong binding that motivated
    prov-2026-c5697387 would have scored a perfect catalog count, so the result
    must not be reported as validating that record's feature.
affected_scope:
  - evals/cases/**
  # The described package set, and the test that holds it to one difference.
  - evals/testdata/todo-rails/generators/**
  - evals/run_test.go
  - evals/README.md
  # The fixture layout doc lists what generators/ holds, so a set added without
  # touching it leaves the one map of the directory wrong by omission.
  - evals/testdata/README.md
  # The measurement itself. Results are append-only observations governed by
  # prov-2026-eb283c56, and each entry is committed under the record whose
  # question it answers - which for these two files is this one.
  - evals/results/todo-rails-described.jsonl
  - evals/results/todo-rails-defined.jsonl
