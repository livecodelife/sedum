id: prov-2026-cc73cf61
title: Orphans, deprecated records, stamping, and prompt context for grow
status: open
version: 8
reason: 'Marker v2 records: remove cross-record duplicates and tighten shapes'
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: |-
  Retired records, orphans, stamping, and the context a re-selected record's prompt carries.

  ## Deprecated records are retired

  A deprecated record takes no new versions and its regions become orphans. Sedum reads no lifecycle field except the value "deprecated". A deprecated record is never grown (--only naming one is an error saying so) and owns nothing.

  ## --prune-orphans

  An orphan is an owned-tier region whose marker names a record that is not in the records directory, by id or alias, or that is deprecated. With --prune-orphans, grow removes orphans in every file some record in the directory authorizes, inside Phase 7's all-or-nothing write. Orphans in files no record authorizes are reported and left alone. Seeded and unowned regions are never orphans.

  ## --check reports orphans

  --check lists orphans and fails on them, as it fails on stale regions.

  ## grow --stamp

  Opt-in, no model call. For each record grown, writes the record's current gen onto its owned regions whose marker has no gen, and the action's current pkg onto those with no pkg, where the owning record exists. It changes nothing else. Only missing values are written, so stamping never hides real staleness. With --dry-run it reports what it would stamp.

  ## Alias markers move to the surviving id when next written

  A region whose marker names an alias is rewritten with the surviving id whenever its region is next written. Untouched regions keep the alias, which still resolves to the owner; --stamp does not rename.

  ## Selection-prompt context

  - For each file a record may write, the prompt lists the regions other records already own there - action, selecting kwargs, owner - marked already present, do not select. Hashes stay out of the prompt.
  - A re-selected record is shown its earlier selections as context: those --prior-recording supplies, else the invocations in the phases of its own recording, else the selections rebuilt from its markers.
constraints:
  - Sedum reads status only to recognize "deprecated"; every other value means nothing to it.
  - A deprecated record is never grown and owns no regions; --only naming one is an error that says it is deprecated.
  - --check reports orphans and exits non-zero when there are any.
  - The steering list and the rebuilt prior name no hash, and the steering list names only regions owned by other records in this record's files.
  - selectAll, defined in internal/pipeline/pipeline.go, chooses the prior selection of each re-selected record.
  - A re-selected record's prior selection is the one --prior-recording supplies when it names the record.
  - Otherwise the prior selection is the invocations in the phases of the record's recording, when that recording is readable and its phases hold at least one invocation.
  - Otherwise the prior selection is what priorFromMarkers, defined in internal/pipeline/pipeline.go, which receives a record id, a slice of inject.OwnedRegion and the owners and returns a slice of recording.Invocation, builds from the record's owned regions.
  - Prior selections include only exposed actions, whether they come from a recording's phases or from markers.
  - Prior selections include only the kwargs the action declares, whether they come from a recording's phases or from markers.
  - A prior selection that exceeds MaxPriorBytes is left out rather than failing the run, whatever its source.
  - An explicit --prior-recording still wins.
  - priorFromMarkers over a v2 region with no recording yields only the identity kwargs of that region that its action declares.
  - The PRD and README describe orphans, deprecated records, --prune-orphans, --stamp, and the prompt context; the flag-surface test lists the flags.
  - --stamp makes no model call
  - --stamp writes only a missing gen or pkg onto markers owned by an existing, non-deprecated record
  - --stamp changes no other byte
  - --stamp is refused with --check, --execute, --force and --record, whatever the value of --record
  - --stamp with --dry-run reports what it would write and writes nothing
  - --prune-orphans removes only owned-tier orphans
  - --prune-orphans removes orphans only in files some record in the directory authorizes
  - --prune-orphans removes orphans only inside Phase 7's all-or-nothing write
  - Orphans in other files are reported and not touched
  - selectAll reads the recording of a record from the recordings directory of the run with recording.ReadRecord
