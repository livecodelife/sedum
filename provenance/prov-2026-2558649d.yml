intent: |
  Implements prov-2026-8394826c, behaviour 2: a run that fails removes what it created. New file internal/pipeline/cleanup.go holds an unexported `runCleanup` with:
  - `newRunCleanup(output string, paths []string) *runCleanup`: records, before Phase 3 runs, every ancestor directory of each authorized path (relative, slash paths, joined under output) that does not exist yet, ordered deepest first.
  - `(*runCleanup).created(files []resolve.File)`: records the files this run wrote: each File with Existed false and Unmanaged false (resolve.File embeds Resolution, which carries Path and Unmanaged).
  - `(*runCleanup).undo(log *runlog.Log)`: removes the recorded files, then the recorded directories deepest first, each with os.Remove so a directory that is not empty (something else lives there) is left, and logs `removed file created by a failed run` (path) per removal at Info. A nil log discards. It ignores a file already gone and never removes anything not recorded, so a file that existed before the run, and its directory, are never touched.
  pipeline.go's Run is hand-edited (it is not region-owned): it builds newRunCleanup before resolve.Create when the run writes (not DryRun, Check or Stamp), calls created(files) after Create, and on any error return after that point calls undo; a successful run, including one stopped by --stop-after, keeps everything. Tests in internal/pipeline/cleanup_test.go cover: undo removes created files and the directories the run made, but keeps a directory that already existed or still holds another file; a pre-existing file is never touched even when the run fails; end to end through Run (using the rails generators fixture in pipeline_test.go) a failing run (a model answer targeting an unauthorized file, as TestAnUnauthorizedTargetHaltsWithNothingInjected does) leaves the output tree as it was, while the same run succeeding keeps the created file; a DryRun creates nothing and so removes nothing. Grown via sedum-haiku (setType runCleanup, setFunction/setMethod, tests).
