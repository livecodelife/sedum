id: prov-2026-672c6471
title: An intent-only arm, to separate what the record specifies from what the catalog does
status: draft
created_at: "2026-08-19"
author: calebcowen@gmail.com
intent: |
  A third arm. It asks the same model for the same files from the same record,
  with the constraints removed from the prompt.

  ## What the current baseline actually measures

  baseline.go says "baselinePrompt is the record, and only the record", and the
  record is a detailed specification. The six constraints name the five
  endpoints and their verbs, the exact nullability and default of both columns,
  that only title and completed may be assigned, that a missing row is a 404
  decided the same way everywhere, and that each endpoint carries a test. The
  prompt also lists the files to write.

  So the baseline arm is not a model without tooling. It is a model handed a
  precise spec, and it scores accordingly: at n=50 the 14B took 967 of 1000
  assertions and 34 of 50 samples working, which does not distinguish it from
  either sedum arm - 32 and 30 of 50, on intervals that overlap almost entirely.

  That result is read two ways and this arm decides between them. Either the
  catalog adds nothing for a capable model, or the record is doing the work on
  both arms and the catalog's contribution is invisible because the baseline
  already has most of it.

  The 4B says the second reading has something in it: unaided it took 300 of
  1000 assertions and not one working sample, with `create returns 201` failing
  in all fifty - and with the catalog and descriptions it took 900 of 900. A spec
  it could not act on became a service it could.

  ## What the arm is

  Intent, and the list of files to write. Nothing else.

  Intent. Not the constraints, and not the file list either.

  The three arms are then a ladder of what the model was given: a prompt, a
  record, a record and a catalog. The point of the first rung is what a sentence
  alone produces, so anything else in the prompt is a rung it is not standing on.

  ## What dropping the file list costs, and why it is the right cost

  parseFencedFiles keeps only the paths a record authorized, because the sedum
  arm cannot write outside them either - Phase 3 creates only what
  affected_scope names. An arm with no file list has to be exempt from that
  filter, or every sample is invalid for naming paths nobody told it about.

  So this arm accepts whatever paths the answer carries, and it is therefore not
  a path-for-path comparison against the sedum arm. That is the intended
  reading: it is not measuring Sedum, it is measuring the absence of it. What it
  shares with the other arms is the question the behaviour target asks - does
  the service run and does it do what the record describes - and verify is HTTP
  assertions against a running service, which is the same question whoever wrote
  the code and whatever the files are called.

  Paths the record did not authorize are recorded rather than discarded, because
  a model writing the right code in files of its own choosing is the most likely
  outcome here and is a finding, not an error.

constraints:
  - >-
    The arm differs from baseline in the prompt and in nothing else. Same record,
    same behaviour target, same parsing of the answer, same outcome vocabulary -
    or the two cannot be read side by side, which is the only reason to build it.
  - >-
    The prompt carries intent and nothing else. No constraints, no file list: the
    rung this arm stands on is a sentence, and anything added to it is a
    different rung.
  - >-
    The arm accepts whatever paths the answer carries, and records the ones no
    record authorized. It is exempt from the path filter the other arms are held
    to, so it is not a path-for-path comparison with them - which is the point
    rather than a defect, because it is measuring the absence of Sedum.
  - >-
    What the arms share is the behaviour question. verify boots the service and
    asserts over HTTP, which is the same question whoever wrote the code and
    whatever the files were called.
  - >-
    A third arm value is a schema change: arm is validated against sedum and
    baseline today, and a case naming anything else is refused. The value is
    added rather than the check relaxed.
  - >-
    Nothing about the sedum or baseline arms changes. Entries already drawn on
    either remain comparable with entries drawn after this record, because this
    adds a column to the matrix rather than moving one.
  - >-
    The retry asymmetry is stated wherever the arms are compared. A baseline is
    structurally one call, so a comparison against a sedum arm drawn at retries
    two is not like-for-like and the report should not imply it is.
