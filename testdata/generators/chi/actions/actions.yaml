actions:
  # A composite bundles actions that are always performed together. It has no
  # template of its own and takes its kwargs from its children.
  createHandler:
    composes: [addHandlerFunc, addRoute]

  addHandlerFunc:
    kwargs:
      resource: { type: string, required: true }
      verb: { type: string, required: true }
    injects_into: "internal/handlers/{{resource|snake}}.go"
    anchor: handlers
    exposed: false

  addRoute:
    kwargs:
      resource: { type: string, required: true }
      # Required because the template renders {{verb|upper}} unconditionally.
      # This said false until the derivation in prov-2026-369544c1 read the
      # template and disagreed with it - the exact drift that record exists to
      # catch, sitting in this repository's own fixture.
      verb: { type: string, required: true }
    injects_into: "internal/handlers/{{resource|snake}}.go"
    anchor: end_of_file
    exposed: false

  # The imports anchor a file template plants has to have an action that fills
  # it, or the marker is an injection point nothing can reach. The import path
  # is the argument: which files exist is the package's business, which package
  # to import is the caller's.
  addImport:
    kwargs:
      resource: { type: string, required: true }
      path: { type: string, required: true }
    injects_into: "internal/handlers/{{resource|snake}}.go"
    anchor: imports

  # The other target form. An action's target may be a kwarg rather than a
  # convention, which is what lets one file-agnostic action serve every file
  # group instead of one action per group (prov-2026-14c832bf).
  #
  # Both forms are here deliberately. addImport above encodes its target as a
  # path pattern and can only ever reach a handler; this one is aimed by its
  # caller and is applicable to any file whose template plants an "imports"
  # marker. Nothing in sedum.yaml gates the choice - a package that wants only
  # convention-driven layout simply declares no action shaped like this.
  addImportTo:
    kwargs:
      file: { type: string, required: true, description: "The file to import into. It must be one of the authorized files, and it must carry an imports injection point." }
      path: { type: string, required: true, description: "The import path, without quotes." }
    injects_into: "{{file}}"
    anchor: imports
