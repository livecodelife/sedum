actions:
  # A composite bundles actions that are always performed together. It has no
  # template of its own and takes its kwargs from its children.
  createHandler:
    composes: [addHandlerFunc, addRoute]

  addHandlerFunc:
    kwargs:
      resource: { type: string, required: true }
      verb: { type: string, required: true }
    injects_into: "internal/handlers/{{resource|snake}}.go"
    anchor: handlers
    exposed: false

  addRoute:
    kwargs:
      resource: { type: string, required: true }
      verb: { type: string, required: false }
    injects_into: "internal/handlers/{{resource|snake}}.go"
    anchor: end_of_file
    exposed: false

  # The imports anchor a file template plants has to have an action that fills
  # it, or the marker is an injection point nothing can reach. The import path
  # is the argument: which files exist is the package's business, which package
  # to import is the caller's.
  addImport:
    kwargs:
      resource: { type: string, required: true }
      path: { type: string, required: true }
    injects_into: "internal/handlers/{{resource|snake}}.go"
    anchor: imports
