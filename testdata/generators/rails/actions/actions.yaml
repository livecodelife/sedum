actions:
  # Descriptions are the author's prose, carried to the catalog untouched. They
  # exist because a kwarg whose type is string and whose meaning is a
  # convention cannot say what it means in the type system - and a comment like
  # this one is written where the model never sees it (prov-2026-c5697387).
  addBeforeFilter:
    description: Registers a before_action callback at the top of the controller class.
    kwargs:
      controller:
        type: string
        required: true
        description: the controller's resource name, singular or plural, without the Controller suffix
      filter:
        type: string
        required: true
        description: the method name to call, bare - the template writes the leading colon
      only:
        type: list
        required: false
        description: method names to restrict the callback to; omit to apply it to every action
    injects_into: "app/controllers/{{controller|snake}}_controller.rb"
    anchor: class_body_top

  # A discriminated action: the kwarg named by discriminator selects the
  # template, and variants enumerates the values that have a dedicated one.
  createControllerMethod:
    kwargs:
      controller: { type: string, required: true }
      name: { type: string, required: true }
      # Required, because every variant template renders it unconditionally.
      # An optional kwarg a template always references fails at render with a
      # diagnostic about the template, after Phase 5 has already passed the
      # invocation - the schema is what has to say it is needed.
      collection: { type: string, required: true }
    discriminator: name
    variants: [index, show, create]
    injects_into: "app/controllers/{{controller|snake}}_controller.rb"
    anchor: class_body

  createModelClass:
    kwargs:
      name: { type: string, required: true }
    injects_into: "app/models/{{name|snake}}.rb"
    anchor: class_body

  # _default.rb plants start_of_body, so something has to be able to fill it.
  addFileHeader:
    kwargs:
      name: { type: string, required: true }
      # A literal rather than a string: the template emits it into a Ruby file
      # verbatim, so what is bound here is source and not prose. Nothing in
      # Sedum reads it - the type exists to say that to the model, which is the
      # only reader that was ever missing the distinction (prov-2026-e3d7b9ac).
      note: { type: literal, required: true }
    injects_into: "config/initializers/{{name|snake}}.rb"
    anchor: start_of_body
