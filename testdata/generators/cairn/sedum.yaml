# A generator package for a target that does not exist.
#
# It exists to prove the milestone constraint that no target knowledge is in
# Sedum's core: it shares no extension, comment prefix, pipeline name, or
# directory convention with any other fixture, and it is not a real language, so
# nothing Sedum could plausibly know about it can be doing the work. If paths
# resolve and files are created here on the same terms as for rails and chi,
# configuration is carrying all of it.
name: cairn
extensions: [".crn"]
comment_prefix: ";;"

# Paths this package declares Sedum does not write. A record may still name
# them - they are part of a change - but something other than Sedum is what
# changes them, and the run reports them as work it left alone.
unmanaged:
  - Cairnfile
  - "Vault/"

transforms:
  unitname: [singular, pascal]
  slug: [plural, kebab]
  shout: [snake, upper]
