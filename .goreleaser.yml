# Release configuration for Sedum. See https://goreleaser.com
#
# Sedum is pure Go, so every target cross-compiles from one runner with
# CGO_ENABLED=0 and the result is a static binary with no runtime dependency.
#
# There is deliberately no `-X ...Version=` ldflag here. prov-2026-b5465dfa put
# the version in internal/recording as a const rather than a build-time stamp,
# because a version injected at link time is absent from `go build` and `go run`
# — exactly when someone is developing against it. Releasing does not change
# that reasoning, so the tag is checked against the constant in CI
# (.github/workflows/release.yml) instead of overwriting it here
# (prov-2026-4746d9ed). internal/cli/release_test.go fails if this file starts
# stamping the version.

version: 2

project_name: sedum

before:
  hooks:
    - go mod tidy

builds:
  - id: sedum
    main: ./cmd/sedum
    binary: sedum
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # -s -w strip the symbol table and DWARF. No -X: see the header.
    ldflags:
      - -s -w

archives:
  - id: sedum
    ids:
      - sedum
    # install.sh derives this name from `uname -s` and `uname -m`. Changing the
    # template breaks the installer for every release after the change.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - TOOL_BOUNDARIES.md
      - conformance/README.md
      - src: conformance/**/*
        info:
          mode: 0644

# The installer verifies against this file, so it is not optional decoration.
checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: livecodelife
    name: sedum
  prerelease: auto
  header: |
    ## Sedum {{ .Version }}

    ### Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/livecodelife/sedum/main/install.sh | sh
    ```

    Or with Go:

    ```sh
    go install github.com/livecodelife/sedum/cmd/sedum@{{ .Tag }}
    ```

    Or download an archive below and verify it against `checksums.txt`.
  footer: |
    ### Pinning this version

    `sedum --version` emits a bare semver, and it is the same string a recording
    carries in `sedum_version`. A caller that depends on a command depends on a
    version of it — see [TOOL_BOUNDARIES.md](./TOOL_BOUNDARIES.md) for the six
    surfaces that version covers.
