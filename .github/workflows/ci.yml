# Runs the suite on every push and pull request.
#
# Before prov-2026-4746d9ed there was no such workflow, so `go test ./...` had
# never run anywhere but a developer's machine, and a tag would have published
# whatever happened to be on main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Every target the release publishes is cross-compiled from one runner,
      # so a build tag that only breaks on darwin/arm64 should break here and
      # not during a release.
      - name: Cross-compile every released target
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/sedum
          done

  # Records drift silently: a spec file edited, a snapshot missing, a parent
  # moved. Nothing ran `provenance lint` here until prov-2026-1a93993f went
  # stale on main with every job green. The CLI is pinned to a full commit SHA
  # of github.com/livecodelife/provenance (no tag exists yet).
  provenance:
    name: Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install the provenance CLI
        run: go install github.com/livecodelife/provenance/cmd/provenance@0eca9872c67a92396400a7eb4d8c25a243b26b1e

      # The commit check runs through `sedum check`, which adds sedum's waivers for
      # regeneration and marker migration commits. Pinned to the v0.11.0 commit.
      - name: Install sedum
        run: go install github.com/livecodelife/sedum/cmd/sedum@00ae003d624f89c611b3387a33a828a9c86d0c4a

      - name: Lint records
        run: provenance lint --enforcement strict

      # Informational: 66 imprints are pinned to older versions of blueprints
      # that were revised since, which is normal here, so `--exit-code` would
      # fail every build. The list is in the log; repin when one matters.
      - name: List stale records
        run: provenance stale

      - name: Check the commits in this pull request
        if: github.event_name == 'pull_request'
        run: sedum check --range "origin/${{ github.base_ref }}..HEAD"

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      # The installer is piped into a shell by strangers. A syntax error in it
      # is a broken install for everyone until someone notices.
      - name: Check the installer parses as POSIX sh
        run: |
          sh -n install.sh
          command -v shellcheck >/dev/null && shellcheck -s sh install.sh || true
